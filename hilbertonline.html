<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HERO ONLINE // Pass 18 Old MMO Palette + Mountain Boundary + Correct Click-to-Move</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#05070a; }
  canvas { display:block; touch-action:none; }
  #hud {
    position:fixed; top:7px; left:8px; width:auto; max-width:48%;
    padding:7px 10px; font-family:Georgia,serif; color:#e5d2a0;
    text-shadow:1px 1px 2px #000; pointer-events:none; font-size:12px;
    line-height:1.35; z-index:5; background:rgba(35,24,17,.72);
    border:1px solid rgba(205,174,111,.75); box-shadow:inset 0 0 0 1px rgba(0,0,0,.55);
  }
  #hud .bar { color:#9ad; }
  /* touch joystick */
  #joyZone {
    position:fixed; left:0; bottom:0; width:45%; height:45%;
    z-index:10; touch-action:none;
  }
  #joyBase {
    position:fixed; width:100px; height:100px; border-radius:50%;
    border:2px solid #4f8; background:rgba(80,255,150,0.08);
    display:none; z-index:11; pointer-events:none;
  }
  #joyStick {
    position:fixed; width:46px; height:46px; border-radius:50%;
    background:rgba(80,255,150,0.35); border:1px solid #7fffb0;
    display:none; z-index:12; pointer-events:none;
  }
  #jumpBtn {
    position:fixed; right:12px; bottom:13%; width:58px; height:58px;
    border-radius:50%; background:rgba(38,27,20,.68);
    border:1px solid #c6a766; color:#e6d4a8; font-family:Georgia,serif;
    font-size:11px; z-index:11; display:flex; align-items:center;
    justify-content:center; user-select:none; text-shadow:1px 1px 2px #000;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);
  }
  #hotbar {
    position:fixed; left:50%; bottom:2.2%; transform:translateX(-50%);
    display:flex; gap:3px; z-index:11;
  }
  .hbSlot {
    width:44px; height:44px; border:1px solid #9e824d;
    background:rgba(29,22,18,.86); color:#d8c28f;
    font-family:Georgia,serif; font-size:9px; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    user-select:none; position:relative;
  }
  .hbSlot .num { position:absolute; top:1px; left:3px; font-size:8px; color:#b99a5d; }
  .hbSlot.active { background:rgba(112,78,37,.78); box-shadow:inset 0 0 0 1px #d9b96f; }
  .hbSlot.empty { opacity:0.35; border-style:dashed; }
  #vitals {
    position:fixed; left:50%; bottom:8.5%; transform:translateX(-50%);
    width:min(230px,46vw); z-index:11; font-family:Georgia,serif;
    filter:drop-shadow(1px 1px 2px #000);
  }
  .barRow { display:flex; align-items:center; gap:6px; margin-bottom:4px; }
  .barLabel { color:#e1cd9c; font-size:9px; width:28px; text-shadow:1px 1px 2px #000; }
  .barTrack { flex:1; height:8px; border:1px solid #a68b56; background:rgba(18,14,11,.8); position:relative; overflow:hidden; }
  .barFill { position:absolute; left:0; top:0; bottom:0; width:100%; }
  .hpFill { background:#a52e27; }
  .xpFill { background:#6b8b4b; }
  #levelUpMsg, #deathOverlay {
    position:fixed; top:35%; left:50%; transform:translate(-50%,-50%);
    font-family:monospace; font-size:22px; text-shadow:0 0 10px currentColor;
    opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:20;
  }
  #levelUpMsg { color:#7fffb0; }
  #deathOverlay { color:#ff5555; font-size:26px; }
  .show { opacity:1 !important; }
  #note {
    position:fixed; bottom:6px; left:6px; color:#456; font-family:monospace;
    font-size:10px; z-index:5; pointer-events:none;
  }
  #minimap {
    position:fixed; top:8px; right:8px; width:78px; height:78px;
    border-radius:50%; border:2px solid #b7985b; background:rgba(18,14,10,.78);
    z-index:6; overflow:hidden; box-shadow:0 1px 5px rgba(0,0,0,.6);
  }
  #miniCanvas { width:100%; height:100%; display:block; }
  #targetRing { position:fixed; width:28px; height:28px; margin:-14px 0 0 -14px; border:2px solid rgba(117,255,139,.95); border-radius:50%; box-shadow:0 0 7px rgba(117,255,139,.65); pointer-events:none; z-index:9; display:none; }
  #clickHint { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); color:#d7c28e; font:11px Georgia,serif; text-shadow:1px 1px 3px #000; opacity:0; pointer-events:none; z-index:8; transition:opacity .18s; }
  #clickHint.show { opacity:.92; }
  @media (max-width: 600px) {
    #hud { font-size:10px; padding:5px 7px; max-width:52%; }
    #minimap { width:70px; height:70px; }
    #vitals { bottom:8%; width:min(205px,44vw); }
    .hbSlot { width:40px; height:40px; }
    #hotbar { gap:2px; bottom:1.7%; }
    #jumpBtn { width:52px; height:52px; right:10px; bottom:14%; }
    #note { display:none; }
  }
  @media (min-width: 800px) {
    #hud { font-size:13px; }
    #minimap { width:86px; height:86px; }
    .hbSlot { width:48px; height:48px; }
  }

  /* PASS 19: compact classic MMO interaction windows */
  #inventoryPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,88vw);background:rgba(34,28,22,.97);border:2px solid #8b7650;box-shadow:0 8px 28px rgba(0,0,0,.65);padding:12px;display:none;z-index:30;color:#d9c9a2;font:12px Georgia,serif}
  #inventoryPanel.show{display:block}
  #inventoryPanel h3{margin:0 0 8px;color:#e6d2a0;font-size:15px}
  .invGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.invSlot{height:46px;border:1px solid #66563b;background:#171513;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#b9aa8b}.invSlot.item{background:#282318;color:#e0c889}
  #questPanel{position:fixed;left:14px;top:118px;width:190px;background:rgba(28,25,20,.78);border-left:2px solid #8d7549;padding:7px 9px;color:#cbbd9e;font:11px Georgia,serif;z-index:6}.qtitle{color:#e3cd98;font-weight:bold;margin-bottom:3px}
  .worldLabel{position:absolute;transform:translate(-50%,-100%);pointer-events:none;color:#e6d8b7;font:11px Georgia,serif;text-shadow:1px 1px 3px #000;white-space:nowrap;z-index:5}
</style>
</head>
<body>

<div id="hud">
  <strong>HERO ONLINE</strong> <span class="bar">// Starter Village</span><br>
  HP: <span id="hpVal">100</span> &nbsp; POS: <span id="posVal">0,0,0</span><br>
  LVL: <span id="hudLvl">1</span> &nbsp; Gold: <span id="hudGold">0</span> &nbsp; Loot: <span id="lootText">none</span>
</div>
<div id="vitals">
  <div class="barRow"><span class="barLabel">HP</span><div class="barTrack"><div id="hpBarFill" class="barFill hpFill"></div></div></div>
  <div class="barRow"><span class="barLabel" id="lvlLabel">LV 1</span><div class="barTrack"><div id="xpBarFill" class="barFill xpFill"></div></div></div>
</div>
<div id="levelUpMsg">LEVEL UP!</div>

<div id="questPanel"><div class="qtitle">FIRST HUNT</div><div>Defeat Wolves</div><div id="questProgress">0 / 3</div><div style="margin-top:4px;color:#9d8d6d">Reward: 25 XP · 12 Gold</div></div>
<div id="inventoryPanel"><h3>INVENTORY</h3><div class="invGrid" id="invGrid"></div><div style="margin-top:8px;color:#8f8067">Gold: <span id="invGold">0</span></div><button id="invClose" style="margin-top:8px;background:#30281e;border:1px solid #806d4c;color:#d9c79d;padding:5px 12px">Close</button></div>
<div id="targetRing"></div><div id="clickHint">MOVE</div>
<div id="deathOverlay">YOU DIED — respawning...</div>
<div id="joyZone"></div>
<div id="joyBase"></div>
<div id="joyStick"></div>
<div id="jumpBtn">JUMP</div>
<div id="hotbar">
  <div class="hbSlot" id="slot1"><span class="num">1</span>ATK</div>
  <div class="hbSlot" id="slot2"><span class="num">2</span>PWR</div>
  <div class="hbSlot empty"><span class="num">3</span></div>
  <div class="hbSlot empty"><span class="num">4</span></div>
  <div class="hbSlot empty"><span class="num">5</span></div>
  <div class="hbSlot empty"><span class="num">6</span></div>
</div>
<div id="minimap"><canvas id="miniCanvas" width="92" height="92"></canvas></div>
<div id="note">Tap ground to move · tap creature to target · 1 attack · 2 power</div><button id="invButton" style="position:fixed;right:12px;bottom:92px;z-index:12;background:rgba(42,34,25,.88);border:1px solid #806b48;color:#d7c79f;padding:7px 10px;font:11px Georgia,serif">INV</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- basic setup ----------
  var scene = new THREE.Scene();
  // PASS 14: push the presentation toward an old outdoor MMORPG map — sky
  // gradient, distant terrain silhouettes, warmer sun, restrained shadows.
  scene.background = new THREE.Color(0x7898a2);
  scene.fog = new THREE.Fog(0x667d80, 48, 165);

  var camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 500);

  var renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:"low-power" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.25));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  window.addEventListener("resize", function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- lights ----------
  var hemi = new THREE.HemisphereLight(0x82979a, 0x24201c, 0.34);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xd8bd92, 0.66);
  sun.position.set(-48, 62, 30);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left = -75; sun.shadow.camera.right = 75;
  sun.shadow.camera.top = 75; sun.shadow.camera.bottom = -75;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 180;
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  // ---------- crude painted sky + high mountain boundary ----------
  // The goal is NOT a modern HDR skybox. It is a simple, slightly painted
  // 2000s-MMORPG horizon: pale sky overhead, darker atmospheric horizon,
  // and broad low-poly mountain masses that visually close the zone.
  var skyGeo = new THREE.SphereGeometry(245, 24, 12);
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: { top: {value:new THREE.Color(0x5f8190)}, mid:{value:new THREE.Color(0x789aa3)}, horizon:{value:new THREE.Color(0x8c968c)} },
    vertexShader: 'varying vec3 vWorld; void main(){ vWorld=(modelMatrix*vec4(position,1.0)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: 'uniform vec3 top; uniform vec3 mid; uniform vec3 horizon; varying vec3 vWorld; void main(){ float h=normalize(vWorld).y; float t=smoothstep(-0.12,0.58,h); vec3 c=mix(horizon,mid,smoothstep(0.0,0.42,t)); c=mix(c,top,smoothstep(0.42,1.0,t)); gl_FragColor=vec4(c,1.0); }'
  });
  var skyDome = new THREE.Mesh(skyGeo, skyMat);
  skyDome.position.y = 8;
  skyDome.renderOrder = -10;
  scene.add(skyDome);

  function makeMountainRidge(z, width, peakBase, color, opacity, seed){
    var group = new THREE.Group();
    var n = 18, step = width/n;
    var verts=[];
    var front=[];
    for(var i=0;i<=n;i++){
      var x=-width/2+i*step;
      var wave=0.35+0.65*Math.abs(Math.sin((i+seed)*1.37));
      var broad=0.72+0.28*Math.sin((i+seed)*0.43+1.2);
      var h=peakBase*(0.38+wave*0.62)*broad;
      if(i===Math.floor(n*0.54)) h*=1.28;
      front.push({x:x,y:h});
    }
    var depth=7;
    for(var j=0;j<=n;j++){ verts.push(front[j].x, -4, z); }
    for(var k=0;k<=n;k++){ verts.push(front[k].x, front[k].y, z); }
    var positions=[];
    for(var q=0;q<n;q++){
      var a=q, b=q+1, c=(n+1)+q, d=(n+1)+q+1;
      positions.push(a,b,c, b,d,c);
    }
    // Back strip so the mountain reads as a solid low-poly landform.
    var backStart=verts.length/3;
    for(var r=0;r<=n;r++){ verts.push(front[r].x, -4, z-depth); }
    for(var rr=0;rr<=n;rr++){ verts.push(front[rr].x, front[rr].y, z-depth); }
    for(var qq=0;qq<n;qq++){
      var a2=backStart+qq,b2=backStart+qq+1,c2=backStart+n+1+qq,d2=backStart+n+2+qq;
      positions.push(a2,c2,b2,b2,c2,d2);
      // side faces
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(positions); geo.computeVertexNormals();
    var mat=new THREE.MeshLambertMaterial({color:color,transparent:true,opacity:opacity,flatShading:true,fog:true});
    var mesh=new THREE.Mesh(geo,mat);
    group.add(mesh); scene.add(group);
  }
  makeMountainRidge(-142, 330, 34, 0x536f79, 0.72, 2);
  makeMountainRidge(-116, 285, 24, 0x657f86, 0.56, 7);
  makeMountainRidge(-92, 245, 15, 0x81989a, 0.38, 11);

  // ---------- PASS 16: complete mountain-ring boundary ----------
  // Hero Online's outdoor zones read as enclosed maps: huge mountains frame the
  // playable field on multiple sides. These are intentionally crude, low-poly
  // silhouettes. Their job is composition, scale and navigation -- not realism.
  function makeBoundaryRidge(width, peakBase, color, opacity, seed, side, offset){
    var group = new THREE.Group();
    var n = 22, step = width/n, verts=[], front=[];
    for(var i=0;i<=n;i++){
      var x=-width/2+i*step;
      var wave=0.30+0.70*Math.abs(Math.sin((i+seed)*1.11));
      var broad=0.74+0.26*Math.sin((i+seed)*0.31+0.8);
      var h=peakBase*(0.42+wave*0.58)*broad;
      if(i===Math.floor(n*0.22) || i===Math.floor(n*0.72)) h*=1.18;
      front.push({x:x,y:h});
    }
    var depth=14;
    for(var j=0;j<=n;j++) verts.push(front[j].x,-5,0);
    for(var k=0;k<=n;k++) verts.push(front[k].x,front[k].y,0);
    var idx=[];
    for(var q=0;q<n;q++){ var a=q,b=q+1,c=n+1+q,d=n+2+q; idx.push(a,b,c,b,d,c); }
    var back=verts.length/3;
    for(var r=0;r<=n;r++) verts.push(front[r].x,-5,-depth);
    for(var rr=0;rr<=n;rr++) verts.push(front[rr].x,front[rr].y,-depth);
    for(var qq=0;qq<n;qq++){ var a2=back+qq,b2=back+qq+1,c2=back+n+1+qq,d2=back+n+2+qq; idx.push(a2,c2,b2,b2,c2,d2); }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(idx); geo.computeVertexNormals();
    var mat=new THREE.MeshLambertMaterial({color:color,transparent:true,opacity:opacity,flatShading:true,fog:true});
    var mesh=new THREE.Mesh(geo,mat);
    group.add(mesh);
    if(side==='north'){ group.rotation.y=Math.PI; group.position.set(0,0,-158); }
    if(side==='south'){ group.position.set(0,0,158); }
    if(side==='west'){ group.rotation.y=-Math.PI/2; group.position.set(-158,0,0); }
    if(side==='east'){ group.rotation.y=Math.PI/2; group.position.set(158,0,0); }
    scene.add(group);
  }

  // Three atmospheric layers on every edge: dark close ridge, softer middle ridge,
  // pale distant ridge. The gaps between them let the sky remain visible overhead.
  var boundarySides=['north','south','west','east'];
  for(var bsi=0;bsi<boundarySides.length;bsi++){
    var bs=boundarySides[bsi];
    makeBoundaryRidge(330,58,0x4d6871,0.88,19+bsi*7,bs);
    makeBoundaryRidge(350,43,0x617c82,0.58,33+bsi*5,bs);
    makeBoundaryRidge(370,29,0x82979a,0.34,47+bsi*3,bs);
  }

  // PASS 17: visible mountain barrier walls. The first few meters are climbable;
  // the collision boundary stops the player inside the mountain rather than at
  // an unrelated invisible rectangle.
  function addMountainBarrier(side){
    // The boundary itself is the mountain. No flat colored wall: a crude, broad,
    // irregular ridge rises from the playable terrain and disappears into fog.
    var n=20, width=300, depth=16, verts=[], idx=[];
    for(var i=0;i<=n;i++){
      var t=i/n, along=-width/2+t*width;
      var wave=0.55+0.45*Math.abs(Math.sin(i*1.37+(side==='east'?3:side==='west'?8:side==='south'?13:1)));
      var broad=0.72+0.28*Math.sin(i*.43+2.1);
      var h=34+28*wave*broad;
      if(i===6||i===14) h+=9;
      verts.push(along,-2,0, along,h,0, along,-2,-depth, along,h,-depth);
    }
    for(var j=0;j<n;j++){
      var a=j*4,b=(j+1)*4;
      idx.push(a,a+1,b+1, a,b+1,b);       // front
      idx.push(a+2,b+2,b+3, a+2,b+3,a+3); // back
      idx.push(a+1,a+3,b+3, a+1,b+3,b+1); // top
      idx.push(a,a+2,a+3, a,a+3,a+1);     // bottom/inner
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
    geo.setIndex(idx); geo.computeVertexNormals();
    var mat=new THREE.MeshLambertMaterial({color:0x53636a,flatShading:true,fog:true});
    var m=new THREE.Mesh(geo,mat);
    m.castShadow=true; m.receiveShadow=true;
    if(side==='north'){m.rotation.y=Math.PI; m.position.set(0,0,-140);}
    if(side==='south'){m.position.set(0,0,140);}
    if(side==='west'){m.rotation.y=-Math.PI/2; m.position.set(-140,0,0);}
    if(side==='east'){m.rotation.y=Math.PI/2; m.position.set(140,0,0);}
    scene.add(m);
  }
  ['north','south','west','east'].forEach(addMountainBarrier);

  // Very subtle border shadows help the mountain feet sit on the world.
  var borderShadowMat=new THREE.MeshBasicMaterial({color:0x34484b,transparent:true,opacity:.10,depthWrite:false,side:THREE.DoubleSide});
  function addBorderShadow(side){
    var sh=new THREE.Mesh(new THREE.PlaneGeometry(300,18),borderShadowMat);
    sh.rotation.x=-Math.PI/2;
    if(side==='north') sh.position.set(0,.025,-136);
    if(side==='south') sh.position.set(0,.025,136);
    if(side==='west') {sh.position.set(-136,.025,0); sh.rotation.z=Math.PI/2;}
    if(side==='east') {sh.position.set(136,.025,0); sh.rotation.z=Math.PI/2;}
    scene.add(sh);
  }
  ['north','south','west','east'].forEach(addBorderShadow);

  // Low atmospheric shadow bands at the mountain feet. These are deliberately
  // broad and transparent: they create the old foggy painted-backdrop transition
  // instead of looking like a sharp 3D skybox wall.
  var hazeMat = new THREE.MeshBasicMaterial({color:0x62797d,transparent:true,opacity:0.12,depthWrite:false,fog:true,side:THREE.DoubleSide});
  for(var hi=0;hi<4;hi++){
    var haze=new THREE.Mesh(new THREE.PlaneGeometry(330,34),hazeMat);
    haze.position.y=7+hi*5;
    if(hi%2===0){ haze.rotation.y=0; haze.position.z=(hi<2?-145:145); }
    else { haze.rotation.y=Math.PI/2; haze.position.x=(hi<2?-145:145); }
    scene.add(haze);
  }

  // Distant tree-line makes the zone feel populated without adding expensive
  // geometry near the player.
  var distantTreeMat = new THREE.MeshLambertMaterial({color:0x566b5f,transparent:true,opacity:0.52,flatShading:true,fog:true});
  for(var dti=0;dti<42;dti++){
    var dt=new THREE.Mesh(new THREE.ConeGeometry(1.0+(dti%3)*0.25,3.2+(dti%4)*0.55,5),distantTreeMat);
    dt.position.set(-170+dti*8.2,1.8+(dti%2)*0.3,-74+(dti%3)*3);
    scene.add(dt);
  }

  // ---------- PASS 19: broad old-engine hills in open areas ----------
  // These are intentionally simple low-poly landforms, not realistic mountains.
  // They occupy empty spaces and help the map read as geography instead of a flat arena.
  var hillMat = new THREE.MeshLambertMaterial({color:0x566557,flatShading:true,fog:true});
  function addHill(x,z,sx,sy,sz,rot){
    var h=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),hillMat);
    h.position.set(x,sy*.45+groundHeight(x,z),z); h.scale.set(sx,sy,sz); h.rotation.y=rot||0; h.castShadow=true; h.receiveShadow=true; scene.add(h);
  }
  addHill(-88,-62,25,13,18,.2); addHill(78,-72,31,15,21,-.4);
  addHill(-92,72,29,14,20,.7); addHill(86,70,24,12,17,-.2);
  addHill(-58,-92,34,16,20,.1); addHill(54,94,38,17,23,.5);

  // ---------- texture helper (procedural, no external image assets) ----------
  function makeNoiseTexture(baseHex, variance, size){
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    var base = new THREE.Color(baseHex);
    var img = ctx.createImageData(size, size);
    for (var i=0; i<size*size; i++){
      var v = (Math.random()-0.5) * variance;
      img.data[i*4+0] = Math.max(0, Math.min(255, (base.r + v)*255));
      img.data[i*4+1] = Math.max(0, Math.min(255, (base.g + v)*255));
      img.data[i*4+2] = Math.max(0, Math.min(255, (base.b + v)*255));
      img.data[i*4+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    var tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.magFilter = THREE.NearestFilter; // keep it a bit chunky/dated on purpose
    return tex;
  }

  function makeGroundTexture(size){
    var canvas = document.createElement('canvas');
    canvas.width = size; canvas.height = size;
    var ctx = canvas.getContext('2d');
    var img = ctx.createImageData(size,size);
    var grass = new THREE.Color(0x4d6244);
    var grass2 = new THREE.Color(0x667052);
    var dirt = new THREE.Color(0x70563b);
    var dry = new THREE.Color(0x7b6848);
    for(var y=0;y<size;y++){
      for(var x=0;x<size;x++){
        var idx=y*size+x;
        var n=Math.sin(x*0.065)*Math.cos(y*0.055)
          + Math.sin(x*0.023+y*0.031)*0.9
          + Math.cos(x*0.12-y*0.08)*0.22;
        var broad=Math.max(0,Math.min(1,(n-0.42)*0.78));
        var dryPatch=Math.max(0,Math.min(1,(Math.sin(x*0.035-y*0.041)+Math.cos(x*0.018+y*0.027)-0.55)*0.55));
        var base=(Math.sin(x*0.14+y*0.09)>0.55)?grass2:grass;
        var r=base.r, g=base.g, b=base.b;
        r += (dirt.r-r)*broad*0.72; g += (dirt.g-g)*broad*0.72; b += (dirt.b-b)*broad*0.72;
        r += (dry.r-r)*dryPatch*0.18; g += (dry.g-g)*dryPatch*0.18; b += (dry.b-b)*dryPatch*0.18;
        var v=(Math.random()-0.5)*0.035;
        img.data[idx*4]=Math.max(0,Math.min(255,(r+v)*255));
        img.data[idx*4+1]=Math.max(0,Math.min(255,(g+v)*255));
        img.data[idx*4+2]=Math.max(0,Math.min(255,(b+v)*255));
        img.data[idx*4+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
    var tex=new THREE.CanvasTexture(canvas);
    tex.wrapS=THREE.RepeatWrapping; tex.wrapT=THREE.RepeatWrapping;
    tex.magFilter=THREE.LinearFilter; tex.minFilter=THREE.LinearMipMapLinearFilter;
    return tex;
  }

  function groundHeight(x,z){
    var village = Math.exp(-(x*x + z*z)/2600) * 0.35;
    var rolling = Math.sin(x*0.045)*0.9 + Math.cos(z*0.052)*0.75 + Math.sin(x*0.018-z*0.025)*0.65;
    var ridge = Math.exp(-Math.pow(z-42,2)/700) * (1.8 + 0.35*Math.cos(x*0.08));
    var valley = -Math.exp(-Math.pow(z+38,2)/900) * 0.8;
    var sideSlope = Math.sin((x+z)*0.018)*0.55;
    return village + rolling + ridge + valley + sideSlope;

  function pickWorld(clientX,clientY){
    var rect=renderer.domElement.getBoundingClientRect();
    pointer.x=((clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointer,camera);

    var meshes=[];
    for(var i=0;i<enemies.length;i++){
      if(enemies[i].userData.alive) enemies[i].traverse(function(m){if(m.isMesh) meshes.push(m);});
    }
    var hits=raycaster.intersectObjects(meshes,false);
    if(hits.length){
      var obj=hits[0].object;
      while(obj && !obj.userData.alive) obj=obj.parent;
      if(obj && obj.userData.alive){ setEnemyTarget(obj); return; }
    }

    // Classic MMO ground targeting: intersect the actual terrain instead of a
    // flat y=0 plane. This prevents clicks from producing reversed/offset movement
    // when the camera is pitched or the terrain is sloped.
    var terrainHits=raycaster.intersectObject(ground,true);
    if(terrainHits.length){
      var gp=terrainHits[0].point;
      setMoveTarget(gp.x,gp.z);
      return;
    }
    // No mathematical fallback plane: if the terrain was not hit, ignore the click.
    // This prevents the old opposite-direction / endless-orbit failure mode.

  }

    joyVec = { x: cx/JOY_R, y: cy/JOY_R };

  function triggerDeath(){
    isDead = true;
    hero.visible = false;
    respawnTimer = 3;
    deathOverlay.classList.add("show");
  }

  // ---------- minimap ----------
  var miniCanvas = document.getElementById("miniCanvas");
  var miniCtx = miniCanvas.getContext("2d");
  var MINI_RANGE = 60; // world units from center to edge
  function drawMinimap(){
    var w = miniCanvas.width, h = miniCanvas.height;
    miniCtx.clearRect(0,0,w,h);
    miniCtx.fillStyle = "rgba(10,30,20,0.9)";
    miniCtx.beginPath(); miniCtx.arc(w/2,h/2,w/2,0,Math.PI*2); miniCtx.fill();

    // palace landmark
    var pdx = 0-hero.position.x, pdz = 34-hero.position.z;
    var pmx = (pdx/MINI_RANGE)*(w/2), pmz = (pdz/MINI_RANGE)*(h/2);
    if (Math.abs(pmx) <= w/2 && Math.abs(pmz) <= h/2){
      miniCtx.fillStyle = "#ffd166";
      miniCtx.fillRect(w/2+pmx-2, h/2+pmz-2, 4, 4);
    }

    // wolves
    for (var i=0;i<enemies.length;i++){
      var e = enemies[i];
      if (!e.userData.alive) continue;
      var dx = e.position.x - hero.position.x, dz = e.position.z - hero.position.z;
      var mx = (dx/MINI_RANGE)*(w/2), mz = (dz/MINI_RANGE)*(h/2);
      if (Math.abs(mx) > w/2 || Math.abs(mz) > h/2) continue;
      miniCtx.fillStyle = "#ff5555";
      miniCtx.beginPath(); miniCtx.arc(w/2+mx, h/2+mz, 2, 0, Math.PI*2); miniCtx.fill();
    }

    // player (always center, arrow points facing direction)
    miniCtx.save();
    miniCtx.translate(w/2, h/2);
    miniCtx.rotate(hero.rotation.y);
    miniCtx.fillStyle = "#7fffb0";
    miniCtx.beginPath();
    miniCtx.moveTo(0,-4); miniCtx.lineTo(3,4); miniCtx.lineTo(-3,4);
    miniCtx.closePath(); miniCtx.fill();
    miniCtx.restore();
  }

  var clock = new THREE.Clock();
  var GRAVITY = -18;
  var walkCycle = 0;

  function update(dt){
    if (isDead){
      respawnTimer -= dt;
      if (respawnTimer <= 0){
        hero.position.set(0, groundHeight(0,0), 0);
        velY = 0; onGround = true;
        hp = maxHp;
        isDead = false;
        hero.visible = true;
        deathOverlay.classList.remove("show");
      }
      updateTargetMarker(dt); updateVitalsUI();
      return;
    }

    // movement input vector (world-relative to yaw)
    var mx = 0, mz = 0;
    if (keys["KeyW"] || keys["ArrowUp"]) mz -= 1;
    if (keys["KeyS"] || keys["ArrowDown"]) mz += 1;
    if (keys["KeyA"] || keys["ArrowLeft"]) mx -= 1;
    if (keys["KeyD"] || keys["ArrowRight"]) mx += 1;

    if (joyActive){
      mx += joyVec.x;
      mz += joyVec.y;
    }

    if (moveTarget && !joyActive && !dragging){
      var tx=moveTarget.x-hero.position.x, tz=moveTarget.z-hero.position.z;
      var td=Math.sqrt(tx*tx+tz*tz);
      if(td<1.0){
        moveTarget=null; targetDisc.visible=false;
      } else {
        mx += tx/td; mz += tz/td;
      }
    }

    if (dragging) mz -= 1; // holding left mouse walks forward, same as holding W

    var len = Math.sqrt(mx*mx+mz*mz);
    if (len > 1){ mx/=len; mz/=len; }

    if(selectedEnemy && selectedEnemy.userData.alive){
      var ex=selectedEnemy.position.x-hero.position.x, ez=selectedEnemy.position.z-hero.position.z;
      var ed=Math.sqrt(ex*ex+ez*ez);
      if(ed<3.0 && attackTimer<=0){
        hero.rotation.y=Math.atan2(ex,ez);
        doAttack();
      } else if(ed>2.35 && !joyActive && !dragging){
        moveTarget={x:selectedEnemy.position.x,z:selectedEnemy.position.z};
      }
    }

    var speed = 6.5;
    // rotate movement by yaw so "forward" is camera-forward
    var sinY = Math.sin(yaw), cosY = Math.cos(yaw);
    var worldX = -mx*cosY - mz*sinY;
    var worldZ = mx*sinY - mz*cosY;

    hero.position.x += worldX * speed * dt;
    hero.position.z += worldZ * speed * dt;

    if (len > 0.05){
      var targetRot = Math.atan2(worldX, worldZ);
      var angleDiff = targetRot - hero.rotation.y;
      angleDiff = ((angleDiff + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI; // shortest-path wrap, avoids the -pi/pi snap
      hero.rotation.y += angleDiff * Math.min(1, dt*10);
    }

    // procedural walk cycle — smoothly scales with actual movement speed, fades to neutral when idle
    var moveMag = Math.min(1, len);
    if (moveMag > 0.05) walkCycle += dt * (8 + moveMag*4);
    var swingAmt = Math.sin(walkCycle) * 0.55 * moveMag;
    legL.rotation.x = swingAmt;
    legR.rotation.x = -swingAmt;
    armL.rotation.x = -swingAmt*0.8;
    armR.rotation.x = swingAmt*0.8;

    // gravity / jump — floor follows the actual terrain under the hero
    velY += GRAVITY * dt;
    hero.position.y += velY * dt;
    var floorY = groundHeight(hero.position.x, hero.position.z);
    if (hero.position.y <= floorY){
      hero.position.y = floorY; velY = 0; onGround = true;
    }

    // Visible mountain walls are the playable boundary. Keep a small climbable
    // foothill before the hard stop so the collision feels like terrain, not UI.
    var B = 137;
    hero.position.x = Math.max(-B, Math.min(B, hero.position.x));
    hero.position.z = Math.max(-B, Math.min(B, hero.position.z));

    // attack cooldowns + weapon swing animations
    attackTimer = Math.max(0, attackTimer - dt);
    attackAnimTimer = Math.max(0, attackAnimTimer - dt);
    pwrTimer = Math.max(0, pwrTimer - dt);
    pwrAnimTimer = Math.max(0, pwrAnimTimer - dt);
    var swingT = attackAnimTimer > 0 ? (attackAnimTimer/0.22) : 0;
    var pwrT = pwrAnimTimer > 0 ? (pwrAnimTimer/0.4) : 0;
    weapon.rotation.x = -Math.PI/3 - swingT*1.3;
    weapon.rotation.z = pwrT * Math.PI*2; // full spin for the power strike

    // enemies: wander while alive, respawn a bit after death
    for (var i=0;i<enemies.length;i++){
      var e = enemies[i];

      if (!e.userData.alive){
        e.userData.respawnTimer -= dt;
        if (e.userData.respawnTimer <= 0){
          var rx = (Math.random()-0.5)*100, rz = (Math.random()-0.5)*100;
          e.position.set(rx, groundHeight(rx,rz), rz);
          e.userData.hp = e.userData.maxHp;
          e.userData.alive = true;
          e.visible = true;
        }
        continue;
      }

      e.userData.timer -= dt;
      if (e.userData.timer <= 0){
        e.userData.dir = Math.random()*Math.PI*2;
        e.userData.timer = 2 + Math.random()*3;
      }
      var wvx = Math.cos(e.userData.dir), wvz = Math.sin(e.userData.dir);
      e.position.x += wvx * 1.2 * dt;
      e.position.z += wvz * 1.2 * dt;
      e.position.y = groundHeight(e.position.x, e.position.z);
      var wolfTargetRot = Math.atan2(wvx, wvz);
      var wolfAngleDiff = wolfTargetRot - e.rotation.y;
      wolfAngleDiff = ((wolfAngleDiff + Math.PI) % (Math.PI*2) + Math.PI*2) % (Math.PI*2) - Math.PI;
      e.rotation.y += wolfAngleDiff * Math.min(1, dt*4);

      // hit flash feedback across every body part
      var parts = e.userData.parts, bases = e.userData.baseColors;
      if (e.userData.hitFlash > 0){
        e.userData.hitFlash -= dt;
        for (var p=0;p<parts.length;p++) parts[p].material.color.setHex(0xffffff);
      } else {
        for (var p2=0;p2<parts.length;p2++) parts[p2].material.color.copy(bases[p2]);
      }

      var dist = e.position.distanceTo(hero.position);
      if (dist < 1.5){
        hp = Math.max(0, hp - dt*20);
        lastDamageTime = performance.now();
        hpEl.textContent = hp.toFixed(0);
        if (hp <= 0) triggerDeath();
      }
    }

    // restrained old-MMORPG idle/walk motion
    for (var ni=0; ni<npcs.length; ni++){
      npcs[ni].userData.idle += dt*1.5;
      npcs[ni].position.y = groundHeight(npcs[ni].position.x,npcs[ni].position.z)
        + Math.sin(npcs[ni].userData.idle)*0.012;
    }

    // slow HP regen once you've been out of danger for a few seconds
    if (hp < maxHp && performance.now() - lastDamageTime > 4000){
      hp = Math.min(maxHp, hp + dt*5);
    }
    updateTargetMarker(dt); updateVitalsUI();
    drawMinimap();
    updateWorldLabels();

    // camera follows behind hero based on yaw/pitch
    var camDist = 9.0, camHeight = 3.35 + pitch*4.0;
    var cx = hero.position.x - Math.sin(yaw)*camDist;
    var cz = hero.position.z - Math.cos(yaw)*camDist;
    camera.position.set(cx, hero.position.y + camHeight, cz);
    camera.lookAt(hero.position.x, hero.position.y + 1.2, hero.position.z);

    posEl.textContent = hero.position.x.toFixed(1)+","+hero.position.y.toFixed(1)+","+hero.position.z.toFixed(1);
  }

  // ---------- PASS 19: small MMO interaction layer ----------
  var invPanel=document.getElementById('inventoryPanel'), invGrid=document.getElementById('invGrid'), invGold=document.getElementById('invGold');
  var invButton=document.getElementById('invButton'), invClose=document.getElementById('invClose');
  var questProgress=document.getElementById('questProgress'); var wolfKills=0;
  var inventoryNames=['Rusty Sword','Wolf Fang','Small Potion'];
  function refreshInventory(){
    invGrid.innerHTML='';
    var items=[];
    for(var k in lootCounts) for(var n=0;n<lootCounts[k];n++) items.push(k);
    if(equippedWeapon==='rusty_sword' && items.indexOf('Rusty Sword')<0) items.unshift('Rusty Sword');
    for(var i=0;i<15;i++){ var d=document.createElement('div'); d.className='invSlot'; d.textContent=items[i]||''; if(items[i]) d.className+=' item'; invGrid.appendChild(d); }
    invGold.textContent=gold;
  }
  invButton.addEventListener('click',function(){refreshInventory();invPanel.classList.add('show');moveTarget=null;});
  invClose.addEventListener('click',function(){invPanel.classList.remove('show');});
  function addWorldLabel(obj,text){
    var el=document.createElement('div'); el.className='worldLabel'; el.textContent=text; document.body.appendChild(el); obj.userData.labelEl=el;
  }
  for(var ei=0;ei<enemies.length;ei++){ addWorldLabel(enemies[ei],'Wolf'); }
  for(var ni2=0;ni2<npcs.length;ni2++){ addWorldLabel(npcs[ni2],['Village Elder','Merchant','Healer','Guard','Blacksmith','Villager'][ni2]||'Villager'); }
  function updateWorldLabels(){
    var all=enemies.concat(npcs);
    for(var i=0;i<all.length;i++){ var o=all[i]; var el=o.userData.labelEl; if(!el) continue; if(o.userData.alive===false){el.style.display='none';continue;} var p=o.position.clone(); p.y+=1.55; p.project(camera); el.style.left=((p.x*.5+.5)*innerWidth)+'px'; el.style.top=((-p.y*.5+.5)*innerHeight)+'px'; el.style.display=(p.z<1?'block':'none'); }
  }
  // Wrap the existing XP gain so kills also drive the starter quest shell.
  var _gainXp=gainXp; gainXp=function(amount){ _gainXp(amount); if(selectedEnemy===null){} };
  var _performAttack=performAttack; performAttack=function(dmgMult,rangeMult,facingMin,slotEl){
    var before=[]; for(var i=0;i<enemies.length;i++) before.push(enemies[i].userData.alive);
    _performAttack(dmgMult,rangeMult,facingMin,slotEl);
    for(var j=0;j<enemies.length;j++) if(before[j] && !enemies[j].userData.alive){ wolfKills++; questProgress.textContent=Math.min(3,wolfKills)+' / 3'; refreshInventory(); }
    if(wolfKills===3){ showFlash('QUEST COMPLETE!','#d8c17e'); questProgress.textContent='COMPLETE'; }
  };

  function loop(){
    var dt = Math.min(0.05, clock.getDelta());
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
</body>
