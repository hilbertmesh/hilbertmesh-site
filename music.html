<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HILBERT MESH // DJ BOOTH</title>
<style>
  :root {
    --bg:        #000000;
    --bg2:       #050905;
    --bg3:       #080e08;
    --green-hi:  #1aff6b;
    --green-mid: #208564;
    --green-dim: #0d3d28;
    --green-deep:#081a10;
    --green-txt: #d0ffd8;
    --green-sub: #4a6650;
    --border:    #0d2a14;
    --scan:      rgba(0,0,0,0.35);
    --red:       #ff4444;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--green-txt);
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
    user-select: none;
  }

  /* ── Scanline overlay ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 3px,
      rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  /* ── Layout ── */
  #app { width: 100%; height: 100%; display: flex; flex-direction: column; }

  /* ── Tab bar ── */
  #tabbar {
    display: flex;
    background: #020602;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    order: 2;
  }
  .tab {
    flex: 1; padding: 12px 4px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-size: 9px; letter-spacing: 2px; color: var(--green-dim);
    cursor: pointer; transition: color 0.15s;
    border: none; background: none; outline: none;
  }
  .tab.active { color: var(--green-hi); }
  .tab svg { width: 22px; height: 22px; }

  /* ── Screens ── */
  #screens { flex: 1; overflow: hidden; order: 1; position: relative; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity 0.15s; }
  .screen.active { opacity: 1; pointer-events: all; }

  /* ── Top bar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .topbar-title { font-size: 12px; letter-spacing: 4px; color: var(--green-hi); font-weight: 700; }
  .topbar-action { background: none; border: none; color: var(--green-hi); font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .topbar-action.dim { color: var(--green-dim); font-size: 13px; letter-spacing: 1px; }

  /* ── Scrollable content ── */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--bg2); }

  /* ── Track row ── */
  .track-row {
    display: flex; align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .track-row:active { background: rgba(26,255,107,0.04); }
  .track-row.playing { border-left: 2px solid var(--green-hi); background: rgba(26,255,107,0.04); }
  .track-num { width: 28px; text-align: center; font-size: 11px; color: var(--green-dim); flex-shrink: 0; }
  .track-info { flex: 1; min-width: 0; }
  .track-title { font-size: 13px; color: var(--green-txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-row.playing .track-title { color: var(--green-hi); font-weight: 700; }
  .track-artist { font-size: 11px; color: var(--green-sub); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-dur { font-size: 11px; color: var(--green-dim); flex-shrink: 0; }
  .track-action { background: none; border: none; color: var(--green-dim); font-size: 20px; cursor: pointer; padding: 4px 6px; flex-shrink: 0; line-height: 1; }
  .track-action:active { color: var(--green-hi); }

  /* ── Empty state ── */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 12px; color: var(--green-dim);
  }
  .empty-icon { font-size: 48px; opacity: 0.3; }
  .empty-title { font-size: 13px; letter-spacing: 4px; color: var(--green-mid); }
  .empty-sub { font-size: 11px; color: var(--green-deep); }

  /* ── Queue controls bar ── */
  .queue-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .queue-bar-info { font-size: 11px; color: var(--green-sub); letter-spacing: 1px; }
  .lock-btn {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: 2px;
    padding: 7px 12px;
    border: 1px solid var(--green-dim);
    background: none; color: var(--green-mid); cursor: pointer;
    transition: all 0.15s;
  }
  .lock-btn.locked { border-color: var(--green-hi); color: var(--green-hi); background: rgba(26,255,107,0.06); }

  /* ── Queue row extras ── */
  .reorder-btns { display: flex; flex-direction: column; gap: 0; flex-shrink: 0; }
  .reorder-btn { background: none; border: none; color: var(--green-dim); font-size: 14px; cursor: pointer; padding: 1px 6px; line-height: 1.4; }
  .reorder-btn:active { color: var(--green-hi); }

  /* ── Mini player ── */
  #miniplayer {
    background: var(--bg3);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
    order: 3;
    display: none;
  }
  #miniplayer.visible { display: block; }
  .mini-progress { height: 1px; background: var(--green-deep); }
  .mini-progress-fill { height: 1px; background: var(--green-mid); width: 0%; transition: width 0.5s linear; }
  .mini-inner {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px;
  }
  .mini-info { flex: 1; min-width: 0; }
  .mini-title { font-size: 12px; color: var(--green-txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .mini-artist { font-size: 10px; color: var(--green-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-btn { background: none; border: none; color: var(--green-mid); font-size: 24px; cursor: pointer; padding: 4px 6px; line-height: 1; flex-shrink: 0; }
  .mini-btn:disabled { color: var(--green-deep); }
  .mini-btn.primary { color: var(--green-hi); font-size: 28px; }

  /* ── Player screen ── */
  #screen-player { background: var(--bg); }
  #visualizer-canvas { width: 100%; display: block; flex-shrink: 0; }

  .player-info {
    padding: 14px 20px 8px;
    background: var(--bg2);
    flex-shrink: 0;
  }
  .player-title { font-size: 17px; color: #e0ffe8; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-artist { font-size: 12px; color: var(--green-dim); margin-top: 3px; }
  .player-pos { font-size: 10px; color: var(--green-mid); margin-top: 2px; letter-spacing: 1px; }

  .seek-wrap { padding: 4px 20px 0; background: var(--bg2); flex-shrink: 0; }
  .seek-bar { width: 100%; height: 28px; display: flex; align-items: center; cursor: pointer; }
  .seek-track { flex: 1; height: 2px; background: var(--green-deep); position: relative; }
  .seek-fill { height: 2px; background: var(--green-mid); width: 0%; }
  .seek-thumb { width: 10px; height: 10px; background: var(--green-hi); border-radius: 50%; position: absolute; top: -4px; left: 0%; transform: translateX(-50%); }
  .seek-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--green-dim); padding: 0 0 6px; }

  .transport {
    display: flex; align-items: center; justify-content: space-evenly;
    padding: 12px 20px 14px;
    background: var(--bg2);
    flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .t-btn { background: none; border: none; color: var(--green-hi); font-size: 32px; cursor: pointer; padding: 8px; line-height: 1; }
  .t-btn:disabled { color: var(--green-deep); }
  .t-btn.play-pause {
    width: 62px; height: 62px; border-radius: 50%;
    border: 1.5px solid var(--green-mid);
    background: rgba(32,133,100,0.08);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }

  /* ── Dialog ── */
  .dialog-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; display: none;
  }
  .dialog-overlay.open { display: flex; }
  .dialog {
    background: var(--bg3); border: 1px solid var(--green-dim);
    padding: 24px 20px; width: 80%; max-width: 320px;
  }
  .dialog h3 { font-size: 13px; letter-spacing: 3px; color: var(--green-hi); margin-bottom: 12px; }
  .dialog p { font-size: 12px; color: var(--green-sub); margin-bottom: 20px; }
  .dialog-btns { display: flex; gap: 12px; justify-content: flex-end; }
  .dbtn { background: none; border: 1px solid var(--green-dim); color: var(--green-sub); font-family: inherit; font-size: 11px; letter-spacing: 2px; padding: 8px 16px; cursor: pointer; }
  .dbtn.danger { border-color: var(--red); color: var(--red); }
  .dbtn.primary { border-color: var(--green-hi); color: var(--green-hi); }

  /* ── Scrollbar ── */
  .content::-webkit-scrollbar { width: 3px; }
  .content::-webkit-scrollbar-track { background: var(--bg); }
  .content::-webkit-scrollbar-thumb { background: var(--green-deep); }
</style>
</head>
<body>
<div id="app">
  <div id="screens">
    <!-- S5 NOTE: current local player tests library/queue/playback. Server-backed paid song vault and master upload arrive in backend music phase. -->

    <!-- ══ LIBRARY ══ -->
    <div class="screen active" id="screen-library">
      <div class="topbar">
        <span class="topbar-title">DJ BOOTH</span>
        <a href="index.html" class="topbar-action dim" style="text-decoration:none">NODE</a>

      </div>

    <!-- ══ PLAYER ══ -->

  <!-- ══ TAB BAR ══ -->
  <div id="tabbar">

      LIBRARY
    </button>
    <button class="tab" data-screen="queue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
      QUEUE
    </button>
    <button class="tab" data-screen="player">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z" fill="currentColor" stroke="none"/></svg>

<!-- ══ DIALOG ══ -->
<div class="dialog-overlay" id="dialog">
  <div class="dialog">
    <h3 id="dialog-title">CONFIRM</h3>
    <p id="dialog-msg">Are you sure?</p>

      <button class="dbtn danger" id="dialog-confirm">CONFIRM</button>
    </div>

<audio id="audio-el"></audio>

<script>
'use strict';

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════

const state = {
  library: [],      // [{id, title, artist, duration, file, url}]
  queue: [],        // [{...track}] — ordered
  queueIndex: -1,   // current playing index in queue
  locked: false,    // queue lock
  playing: false,
  duration: 0,
  position: 0,
  nextId: 0,
};

function mkId() { return ++state.nextId; }

// ════════════════════════════════════════════════════════
// AUDIO ENGINE
// ════════════════════════════════════════════════════════

const audio = document.getElementById('audio-el');
audio.preload = 'auto';

// Web Audio for visualizer
let audioCtx = null, analyser = null, sourceNode = null, analyserConnected = false;

function ensureAudioCtx() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  analyser.smoothingTimeConstant = 0.75;
  analyser.connect(audioCtx.destination);
}

function connectSource() {
  if (analyserConnected) return;
  ensureAudioCtx();
  try {
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyserConnected = true;
  } catch(e) {}
}

function playTrack(queueIdx) {
  if (queueIdx < 0 || queueIdx >= state.queue.length) return;
  const track = state.queue[queueIdx];
  state.queueIndex = queueIdx;

  // Revoke old url is handled per-track via track.url
  audio.src = track.url;
  audio.load();

  connectSource();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

  audio.play().then(() => {
    state.playing = true;
    updateAll();
    updateMediaSession(track);
  }).catch(() => {
    // Autoplay blocked — show play button, user must tap
    state.playing = false;
    updateAll();
  });
}

function togglePlay() {
  if (!state.queue.length) return;
  if (state.queueIndex < 0) { playTrack(0); return; }
  if (audio.paused) {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    audio.play().then(() => { state.playing = true; updateAll(); });
  } else {
    audio.pause();
    state.playing = false;
    updateAll();
  }
}

function playNext() {
  const next = state.queueIndex + 1;
  if (next < state.queue.length) {
    playTrack(next);
  } else if (!state.locked) {
    // unlocked & at end — stop
    audio.pause();
    state.playing = false;
    updateAll();
  } else {
    // locked — stop at end
    audio.pause();
    state.playing = false;
    updateAll();
  }
}

function playPrev() {
  if (state.position > 3) {
    audio.currentTime = 0;
    return;
  }
  const prev = state.queueIndex - 1;
  if (prev >= 0) playTrack(prev);
}

audio.addEventListener('ended', () => {
  const next = state.queueIndex + 1;
  if (next < state.queue.length) {
    playTrack(next);
  } else {
    // End of queue — always stop regardless of lock
    state.playing = false;
    updateAll();
  }
});

audio.addEventListener('timeupdate', () => {
  state.position = audio.currentTime;
  state.duration = audio.duration || 0;
  updateProgress();
});

audio.addEventListener('durationchange', () => {
  state.duration = audio.duration || 0;
});

audio.addEventListener('play',  () => { state.playing = true;  updatePlayButtons(); });
audio.addEventListener('pause', () => { state.playing = false; updatePlayButtons(); });

// ════════════════════════════════════════════════════════
// LIBRARY
// ════════════════════════════════════════════════════════

function importFiles(files) {
  for (const file of files) {
    if (!file.type.startsWith('audio/')) continue;
    const url = URL.createObjectURL(file);
    const {title, artist} = parseMeta(file.name);
    const track = { id: mkId(), title, artist, duration: 0, file, url };
    state.library.push(track);

    // Probe duration
    const probe = new Audio();
    probe.preload = 'metadata';
    probe.src = url;
    probe.addEventListener('loadedmetadata', () => {
      track.duration = probe.duration;
      renderLibrary();
    }, { once: true });
  }
  renderLibrary();
}

function parseMeta(filename) {
  const base = filename.replace(/\.[^.]+$/, '');
  const sep = base.indexOf(' - ');
  if (sep > 0) {
    return { artist: base.slice(0, sep).trim(), title: base.slice(sep + 3).trim() };
  }
  return { artist: 'Unknown Artist', title: base || filename };
}

function addToQueue(track) {
  // Copy track so queue has independent refs
  const qt = { ...track };
  state.queue.push(qt);
  renderQueue();
  updateMiniPlayer();
  // If nothing playing, start
  if (state.queueIndex < 0) {
    playTrack(state.queue.length - 1);
  }
}

// ════════════════════════════════════════════════════════
// QUEUE OPERATIONS
// ════════════════════════════════════════════════════════

function removeFromQueue(idx) {
  const wasCurrent = idx === state.queueIndex;
  const wasPlaying = state.playing;

  state.queue.splice(idx, 1);

  if (state.queue.length === 0) {
    state.queueIndex = -1;
    audio.pause();
    audio.src = '';
    state.playing = false;
  } else if (idx < state.queueIndex) {
    state.queueIndex--;
  } else if (wasCurrent) {
    const newIdx = Math.min(idx, state.queue.length - 1);
    state.queueIndex = -1; // reset before playTrack
    if (wasPlaying) playTrack(newIdx);
    else { state.queueIndex = newIdx; }
  }

  renderQueue();
  updateAll();
}

function moveUp(idx) {
  if (idx <= 0) return;
  [state.queue[idx - 1], state.queue[idx]] = [state.queue[idx], state.queue[idx - 1]];
  if (state.queueIndex === idx) state.queueIndex = idx - 1;
  else if (state.queueIndex === idx - 1) state.queueIndex = idx;
  renderQueue();
  updateMiniPlayer();
}

function moveDown(idx) {
  if (idx >= state.queue.length - 1) return;
  [state.queue[idx], state.queue[idx + 1]] = [state.queue[idx + 1], state.queue[idx]];
  if (state.queueIndex === idx) state.queueIndex = idx + 1;
  else if (state.queueIndex === idx + 1) state.queueIndex = idx;
  renderQueue();
  updateMiniPlayer();
}

function clearQueue() {
  audio.pause();
  audio.src = '';
  state.queue = [];
  state.queueIndex = -1;
  state.playing = false;
  renderQueue();
  updateAll();
}

// ════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════

function fmt(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function renderLibrary() {
  const el = document.getElementById('library-list');
  if (!state.library.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">♪</div><div class="empty-title">NO TRACKS</div><div class="empty-sub">tap + to import audio</div></div>`;
    return;
  }
  el.innerHTML = state.library.map((t, i) => `
    <div class="track-row" data-lib="${i}">
      <div class="track-num">${i + 1}</div>
      <div class="track-info">
        <div class="track-title">${esc(t.title)}</div>
        <div class="track-artist">${esc(t.artist)}</div>
      </div>
      <div class="track-dur">${fmt(t.duration)}</div>
      <button class="track-action" data-add="${i}" title="Add to queue">＋</button>
    </div>
  `).join('');

  el.querySelectorAll('[data-add]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      addToQueue(state.library[+btn.dataset.add]);
    });
  });
  el.querySelectorAll('[data-lib]').forEach(row => {
    row.addEventListener('click', () => {
      addToQueue(state.library[+row.dataset.lib]);
    });
  });
}

function renderQueue() {
  const el = document.getElementById('queue-list');
  const titleEl = document.getElementById('queue-title');
  const infoEl = document.getElementById('queue-info');

  titleEl.textContent = `QUEUE [${state.queue.length}]`;
  infoEl.textContent = `${state.queue.length} TRACK${state.queue.length !== 1 ? 'S' : ''}`;

  if (!state.queue.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">≡</div><div class="empty-title">QUEUE EMPTY</div><div class="empty-sub">add tracks from library</div></div>`;
    return;
  }

  el.innerHTML = state.queue.map((t, i) => `
    <div class="track-row ${i === state.queueIndex ? 'playing' : ''}" data-qi="${i}">
      <div class="track-num">
        ${i === state.queueIndex && state.playing ? '▶' : (i + 1)}
      </div>
      <div class="track-info">
        <div class="track-title">${esc(t.title)}</div>
        <div class="track-artist">${esc(t.artist)}</div>
      </div>
      <div class="track-dur">${fmt(t.duration)}</div>
      <div class="reorder-btns">
        <button class="reorder-btn" data-up="${i}" title="Move up">▲</button>
        <button class="reorder-btn" data-dn="${i}" title="Move down">▼</button>
      </div>
      <button class="track-action" data-rm="${i}" title="Remove">✕</button>
    </div>
  `).join('');

  el.querySelectorAll('[data-qi]').forEach(row => {
    row.addEventListener('click', () => playTrack(+row.dataset.qi));
  });
  el.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); moveUp(+b.dataset.up); }));
  el.querySelectorAll('[data-dn]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); moveDown(+b.dataset.dn); }));
  el.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removeFromQueue(+b.dataset.rm); }));
}

function updateMiniPlayer() {
  const mp = document.getElementById('miniplayer');
  if (!state.queue.length || state.queueIndex < 0) {
    mp.classList.remove('visible');
    return;
  }
  mp.classList.add('visible');
  const t = state.queue[state.queueIndex];
  document.getElementById('mini-title').textContent  = t.title;
  document.getElementById('mini-artist').textContent = t.artist;
  document.getElementById('mini-play').textContent   = state.playing ? '⏸' : '▶';
  document.getElementById('mini-prev').disabled      = state.queueIndex <= 0;
  document.getElementById('mini-next').disabled      = state.queueIndex >= state.queue.length - 1;
}

function updateProgress() {
  const pct = state.duration > 0 ? (state.position / state.duration) * 100 : 0;
  document.getElementById('seek-fill').style.width  = pct + '%';
  document.getElementById('seek-thumb').style.left  = pct + '%';
  document.getElementById('mini-fill').style.width  = pct + '%';
  document.getElementById('time-elapsed').textContent   = fmt(state.position);
  const rem = state.duration - state.position;
  document.getElementById('time-remaining').textContent = '-' + fmt(rem);

  if (state.queueIndex >= 0 && state.queue[state.queueIndex]) {
    const t = state.queue[state.queueIndex];
    document.getElementById('player-pos').textContent =
      `${state.queueIndex + 1} / ${state.queue.length}  •  ${fmt(state.position)} / ${fmt(state.duration)}`;
  }
}

function updatePlayButtons() {
  const icon = state.playing ? '⏸' : '▶';
  document.getElementById('play-pause-btn').textContent = icon;
  document.getElementById('mini-play').textContent = icon;
}

function updatePlayerInfo() {
  if (state.queueIndex >= 0 && state.queue[state.queueIndex]) {
    const t = state.queue[state.queueIndex];
    document.getElementById('player-title').textContent  = t.title;
    document.getElementById('player-artist').textContent = t.artist;
    document.getElementById('mini-title').textContent    = t.title;
    document.getElementById('mini-artist').textContent   = t.artist;
  } else {
    document.getElementById('player-title').textContent  = '—';
    document.getElementById('player-artist').textContent = '—';
  }
}

function updateNavButtons() {
  const pi = state.queueIndex;
  document.getElementById('prev-btn').disabled  = pi <= 0;
  document.getElementById('next-btn').disabled  = pi < 0 || pi >= state.queue.length - 1;
  document.getElementById('mini-prev').disabled = pi <= 0;
  document.getElementById('mini-next').disabled = pi < 0 || pi >= state.queue.length - 1;
}

function updateLockBtn() {
  const btn = document.getElementById('lock-btn');
  if (state.locked) {
    btn.textContent = '🔒 LOCKED';
    btn.classList.add('locked');
  } else {
    btn.textContent = '🔓 UNLOCKED';
    btn.classList.remove('locked');
  }
}

function updateAll() {
  updatePlayerInfo();
  updatePlayButtons();
  updateNavButtons();
  updateMiniPlayer();
  updateProgress();
  renderQueue();
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ════════════════════════════════════════════════════════
// SEEK BAR
// ════════════════════════════════════════════════════════

(function setupSeek() {
  const bar = document.getElementById('seek-bar');
  let seeking = false;

  function seek(e) {
    const rect = bar.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const frac = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    if (state.duration > 0) {
      audio.currentTime = frac * state.duration;
    }
  }

  bar.addEventListener('touchstart', e => { seeking = true; seek(e); }, { passive: true });
  bar.addEventListener('touchmove',  e => { if (seeking) seek(e); }, { passive: true });
  bar.addEventListener('touchend',   () => { seeking = false; });
  bar.addEventListener('mousedown',  e => { seeking = true; seek(e); });
  bar.addEventListener('mousemove',  e => { if (seeking) seek(e); });
  window.addEventListener('mouseup', () => { seeking = false; });
})();

document.querySelectorAll('.tab').forEach(tab => {

    document.getElementById('screen-' + tab.dataset.screen).classList.add('active');

});

document.getElementById('mini-info-tap').addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelector('[data-screen="player"]').classList.add('active');
  document.getElementById('screen-player').classList.add('active');
  resizeCanvas();
});

document.getElementById('import-btn').addEventListener('click', () => {
  document.getElementById('file-input').click();
});
document.getElementById('file-input').addEventListener('change', e => {
  importFiles(e.target.files);
  e.target.value = '';
});

document.getElementById('play-pause-btn').addEventListener('click', togglePlay);
document.getElementById('mini-play').addEventListener('click', togglePlay);

document.getElementById('prev-btn').addEventListener('click', playPrev);
document.getElementById('mini-prev').addEventListener('click', playPrev);

document.getElementById('next-btn').addEventListener('click', () => {
  if (state.queueIndex < state.queue.length - 1) playTrack(state.queueIndex + 1);
});
document.getElementById('mini-next').addEventListener('click', () => {
  if (state.queueIndex < state.queue.length - 1) playTrack(state.queueIndex + 1);
});

document.getElementById('lock-btn').addEventListener('click', () => {
  state.locked = !state.locked;
  updateLockBtn();
});

document.getElementById('clear-queue-btn').addEventListener('click', () => {
  if (!state.queue.length) return;
  showDialog('CLEAR QUEUE', 'Remove all tracks from the queue?', clearQueue);
});

// DIALOG
// ════════════════════════════════════════════════════════

let dialogCallback = null;

function showDialog(title, msg, onConfirm) {
  document.getElementById('dialog-title').textContent = title;
  document.getElementById('dialog-msg').textContent = msg;
  dialogCallback = onConfirm;
  document.getElementById('dialog').classList.add('open');
}

document.getElementById('dialog-cancel').addEventListener('click', () => {
  document.getElementById('dialog').classList.remove('open');
  dialogCallback = null;
});
document.getElementById('dialog-confirm').addEventListener('click', () => {
  document.getElementById('dialog').classList.remove('open');
  if (dialogCallback) dialogCallback();
  dialogCallback = null;
});

// ════════════════════════════════════════════════════════
// MEDIA SESSION API
// ════════════════════════════════════════════════════════

function updateMediaSession(track) {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: track.artist,
    album: 'Hilbert DJ Booth',
  });
  navigator.mediaSession.setActionHandler('play',          () => { audio.play(); state.playing = true; updateAll(); });
  navigator.mediaSession.setActionHandler('pause',         () => { audio.pause(); state.playing = false; updateAll(); });
  navigator.mediaSession.setActionHandler('previoustrack', playPrev);
  navigator.mediaSession.setActionHandler('nexttrack',     () => {
    if (state.queueIndex < state.queue.length - 1) playTrack(state.queueIndex + 1);
  });
}

// ════════════════════════════════════════════════════════
// VISUALIZER
// ════════════════════════════════════════════════════════

const canvas = document.getElementById('visualizer-canvas');
const ctx2d  = canvas.getContext('2d');

function resizeCanvas() {
  const screen = document.getElementById('screen-player');
  const W = screen.clientWidth;
  // Take ~46% of screen height for visualizer
  const H = Math.floor(screen.clientHeight * 0.46);
  canvas.width  = W;
  canvas.height = H;
  canvas.style.height = H + 'px';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Visualizer state
const BARS      = 24;
const barPhase  = Array.from({length: BARS}, (_, i) => i * 0.41 + i * i * 0.013);
const flickerWords = ['QLCK','SYS','AUD','BUF','PCM','0xFF','RDY','RUN','LOCK','DMA'];
let vizT = 0;

// Frequency data buffer
const freqData = new Uint8Array(32);

function drawVisualizer(ts) {
  requestAnimationFrame(drawVisualizer);

  const W = canvas.width, H = canvas.height;
  if (W === 0 || H === 0) return;

  // Advance time — slower when paused
  vizT += state.playing ? 0.004 : 0.0005;

  // Get real freq data if analyser available
  let hasRealData = false;
  if (analyser && analyserConnected && state.playing) {
    analyser.getByteFrequencyData(freqData);
    hasRealData = true;
  }

  // Compute overall amplitude
  let amplitude = 0;
  if (hasRealData) {
    let sum = 0;
    for (let i = 0; i < freqData.length; i++) sum += freqData[i];
    amplitude = (sum / freqData.length) / 255;
  } else {
    amplitude = state.playing
      ? Math.abs(Math.sin(vizT * 2.1) * 0.4 + Math.sin(vizT * 5.3) * 0.25 + Math.sin(vizT * 11.1) * 0.15)
      : 0.03;
  }

  // Background
  ctx2d.fillStyle = '#000000';
  ctx2d.fillRect(0, 0, W, H);

  // ── Drifting grid ──
  const gridCols = 10, gridRows = 6;
  const driftX = (vizT * W * 0.25) % (W / gridCols);
  const driftY = (vizT * H * 0.18) % (H / gridRows);
  ctx2d.strokeStyle = 'rgba(8,26,16,0.9)';
  ctx2d.lineWidth = 0.5;
  for (let c = 0; c <= gridCols + 1; c++) {
    const x = c * (W / gridCols) - driftX;
    ctx2d.beginPath(); ctx2d.moveTo(x, 0); ctx2d.lineTo(x, H); ctx2d.stroke();
  }
  for (let r = 0; r <= gridRows + 1; r++) {
    const y = r * (H / gridRows) - driftY;
    ctx2d.beginPath(); ctx2d.moveTo(0, y); ctx2d.lineTo(W, y); ctx2d.stroke();
  }

  // ── Bars ──
  const gap  = 3;
  const barW = (W - gap * (BARS + 1)) / BARS;
  const maxH = H * 0.70;

  for (let i = 0; i < BARS; i++) {
    const phase = barPhase[i];
    let fraction;
    if (hasRealData) {
      const bin = Math.floor(i / BARS * freqData.length);
      const raw = freqData[bin] / 255;
      const synth = Math.abs(
        Math.sin(vizT * Math.PI * 2 + phase) * 0.3 +
        Math.sin(vizT * Math.PI * 5.3 + phase * 1.7) * 0.2
      );
      fraction = Math.max(0.03, raw * 0.8 + synth * 0.2);
    } else {
      const raw = Math.abs(
        Math.sin(vizT * Math.PI * 2 + phase) * 0.45 +
        Math.sin(vizT * Math.PI * 5.3 + phase * 1.7) * 0.30 +
        Math.sin(vizT * Math.PI * 11.1 + phase * 0.9) * 0.25
      );
      fraction = Math.max(0.02, raw * amplitude);
    }

    const bH = maxH * Math.min(1, fraction);
    const x  = gap + i * (barW + gap);
    const y  = H - bH;

    // Bar body
    ctx2d.fillStyle = 'rgba(13,61,40,0.75)';
    ctx2d.fillRect(x, y, barW, bH);

    // Upper third brighter
    if (bH > 8) {
      ctx2d.fillStyle = 'rgba(32,133,100,0.5)';
      ctx2d.fillRect(x, y, barW, bH * 0.3);
    }

    // Cap
    if (bH > 4) {
      ctx2d.fillStyle = 'rgba(26,255,107,0.75)';
      ctx2d.fillRect(x, y, barW, 2);
    }
  }

  // ── Waveform ──
  const cy   = H * 0.36;
  const steps = 100;
  ctx2d.beginPath();
  ctx2d.strokeStyle = 'rgba(32,133,100,0.55)';
  ctx2d.lineWidth = 1.5;
  for (let i = 0; i <= steps; i++) {
    const x     = (i / steps) * W;
    const phase = (i / steps) * Math.PI * 6;
    const y = cy +
      Math.sin(phase + vizT * Math.PI * 4) * amplitude * H * 0.09 +
      Math.sin(phase * 2.3 + vizT * Math.PI * 2.7) * amplitude * H * 0.04;
    i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  // Second harmonic
  ctx2d.beginPath();
  ctx2d.strokeStyle = 'rgba(13,61,40,0.4)';
  ctx2d.lineWidth = 1;
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * W;
    const y = cy + Math.sin((i / steps) * Math.PI * 4 - vizT * Math.PI * 2.1) * amplitude * H * 0.06;
    i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
  }
  ctx2d.stroke();

  // ── Scanlines ──
  ctx2d.fillStyle = 'rgba(0,0,0,0.22)';
  for (let y = 0; y < H; y += 4) ctx2d.fillRect(0, y, W, 1);

  // ── Flicker text ──
  const slot    = Math.floor(vizT * 7) % flickerWords.length;
  const flicker = Math.abs(Math.sin(vizT * Math.PI * 14));
  if (flicker > 0.87) {
    const word  = flickerWords[slot];
    const xFrac = ((Math.sin(slot * 1.618) * 0.5 + 0.5) * 0.8 + 0.05);
    const yFrac = ((Math.cos(slot * 2.718) * 0.5 + 0.5) * 0.55 + 0.05);
    ctx2d.fillStyle = `rgba(32,133,100,${(flicker * 0.5).toFixed(2)})`;
    ctx2d.font = '10px monospace';
    ctx2d.letterSpacing = '2px';
    ctx2d.fillText(word, xFrac * W, yFrac * H);
  }
}

requestAnimationFrame(drawVisualizer);
