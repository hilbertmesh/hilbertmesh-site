<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STONEHOLD</title>
<style>
  :root{
    --parch:#efe4c8; --parch-dk:#d8c8a2; --ink:#2a2018; --ink-soft:#5a4a34;
    --gold:#d4ab43; --gold-lt:#f0d27a; --gold-dk:#9a7820;
    --blood:#9c3322; --green-dk:#4e7a28; --green:#6fa83a;
    --stone:#8a8278; --frame:#7a5a2a;
    --dirt:#c2a06a; --dirt-dk:#9c7c48;
    --panelbg:#e9dcbd;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;background:#1a1610;color:var(--ink);
    user-select:none;touch-action:manipulation;font-size:14px;}
  #game{position:fixed;inset:0;display:flex;flex-direction:column;background:#b89a64;}

  /* sprite helper: element with .spr gets bg image; falls back to color if missing */
  .spr{background-size:contain;background-repeat:no-repeat;background-position:center bottom;}

  /* ===== NAV ===== */
  #nav{display:flex;height:44px;background:linear-gradient(180deg,#f0e6cc,#d8c8a0);
    border-bottom:2px solid var(--frame);z-index:30;box-shadow:0 2px 6px #0006;}
  .navtab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;
    font-weight:bold;color:var(--ink-soft);cursor:pointer;border-right:1px solid #0002;letter-spacing:.5px;}
  .navtab.active{background:linear-gradient(180deg,#f7be3e,#d99a23);color:#3a2410;box-shadow:inset 0 -3px 0 #0003;}
  #srv{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 9px;
    background:#2a2018;color:var(--gold-lt);font-size:9px;min-width:62px;}
  #srv b{font-size:12px;color:var(--gold);letter-spacing:1px;}

  /* ===== RESOURCE BAR ===== */
  #resbar{display:flex;background:linear-gradient(180deg,#33291c,#221a10);
    border-bottom:2px solid var(--gold-dk);z-index:25;overflow-x:auto;}
  #resbar::-webkit-scrollbar{display:none;}
  .res{flex:1;min-width:74px;display:flex;align-items:center;gap:5px;padding:5px 6px;border-right:1px solid #0005;}
  .res .ic{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background-size:cover;
    background-color:#3a2c18;border:1px solid var(--gold-dk);}
  .res .col{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .res .amt{font-size:12px;font-weight:bold;color:var(--parch);font-variant-numeric:tabular-nums;}
  .res .rate{font-size:9px;color:var(--green);font-variant-numeric:tabular-nums;}
  .res .rate.neg{color:#e8654a;}
  .res.full .amt{color:var(--gold-lt);}
  #cents{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:5px 8px;cursor:pointer;
    background:linear-gradient(180deg,#5a3a1a,#3a2410);border-left:2px solid var(--gold-dk);}
  #cents .cv{font-size:12px;font-weight:bold;color:var(--gold-lt);}
  #cents .cl{font-size:8px;color:var(--parch-dk);}

  /* ===== STAGE ===== */
  #stage{flex:1;position:relative;overflow:hidden;}
  .screen{position:absolute;inset:0;display:none;}
  .screen.active{display:block;}

  /* CITY: sky + dry-field outer + walled inner */
  #cityScroll{position:absolute;inset:0;overflow:auto;
    background:linear-gradient(180deg,#9ec0e8 0,#bcd6ec 12%,
      var(--dirt) 12%,var(--dirt-dk) 100%);}
  #cityScroll::-webkit-scrollbar{display:none;}
  #cityInner{position:relative;width:680px;height:600px;margin:12px auto;}
  /* outer field ground */
  #fieldGround{position:absolute;inset:0;border-radius:8px;
    background-color:var(--dirt);background-size:200px;opacity:.96;
    box-shadow:inset 0 0 60px #0003;}
  /* inner walled town: a cobble pad framed by wall sprites */
  #innerTown{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:330px;height:300px;}
  #cobble{position:absolute;inset:14px;background-color:#9a9182;background-size:120px;
    border-radius:4px;box-shadow:inset 0 0 0 2px #6a6258, inset 0 0 30px #0004;}
  /* wall frame drawn from sprite slices (fallback = stone border) */
  .wallpiece{position:absolute;background-size:contain;background-repeat:no-repeat;background-position:center;}
  #wallTop,#wallBot{left:0;right:0;height:30px;background-color:transparent;}
  #wallTop{top:-6px;border-top:8px solid #8a8278;}
  #wallBot{bottom:-6px;border-bottom:8px solid #6a6258;}
  #wallL,#wallR{top:0;bottom:0;width:14px;}
  #wallL{left:-6px;border-left:8px solid #7a7268;}
  #wallR{right:-6px;border-right:8px solid #7a7268;}
  .corner{position:absolute;width:34px;height:42px;z-index:6;background-size:contain;
    background-repeat:no-repeat;background-position:center bottom;
    background-color:transparent;}
  .corner.fb{background-color:#9a9182;border:2px solid #5a5048;border-radius:3px;}
  .corner.tl{top:-22px;left:-16px}.corner.tr{top:-22px;right:-16px}
  .corner.bl{bottom:-12px;left:-16px}.corner.br{bottom:-12px;right:-16px}

  .plot{position:absolute;width:62px;height:62px;cursor:pointer;display:flex;
    align-items:flex-end;justify-content:center;}
  .plot .bspr{width:58px;height:58px;background-size:contain;background-repeat:no-repeat;
    background-position:center bottom;filter:drop-shadow(0 2px 2px #0005);}
  .plot.empty .bspr{background-color:transparent;}
  .plot.empty::after{content:"";position:absolute;width:30px;height:16px;bottom:8px;left:50%;
    transform:translateX(-50%) rotateX(55deg);border:2px dashed #fff7;border-radius:3px;opacity:.5;}
  .plot .blvl{position:absolute;top:0;right:2px;font-size:9px;font-weight:bold;color:#fff;
    background:#000a;border:1px solid var(--gold-dk);border-radius:7px;padding:0 4px;z-index:3;}
  .plot .btmr{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:8px;
    color:#fff;background:var(--blood);border-radius:5px;padding:0 4px;white-space:nowrap;
    font-variant-numeric:tabular-nums;z-index:4;}
  .plot.sel .bspr{filter:drop-shadow(0 0 5px var(--gold)) brightness(1.1);}
  .plot.working .bspr{animation:bob 1.3s ease-in-out infinite;}
  @keyframes bob{50%{transform:translateY(-3px);}}
  .zonelabel{position:absolute;font-size:10px;color:#fff9;text-shadow:0 1px 2px #000;
    pointer-events:none;letter-spacing:1px;z-index:2;}

  /* clouds */
  .cloud{position:absolute;top:4px;width:60px;height:34px;background-size:contain;
    background-repeat:no-repeat;opacity:.9;pointer-events:none;z-index:7;
    animation:drift linear infinite;}
  .cloud.fb{background:radial-gradient(circle at 30% 60%,#fff 30%,transparent 31%),
    radial-gradient(circle at 60% 50%,#fff 36%,transparent 37%),
    radial-gradient(circle at 50% 70%,#fff 40%,transparent 41%);}
  @keyframes drift{from{transform:translateX(-90px);}to{transform:translateX(760px);}}

  /* MAP */
  #mapScroll{position:absolute;inset:0;overflow:auto;background-color:var(--dirt-dk);background-size:260px;}
  #mapScroll::-webkit-scrollbar{display:none;}
  #mapInner{position:relative;width:820px;height:680px;}
  .mcell{position:absolute;width:78px;height:78px;cursor:pointer;display:flex;align-items:flex-end;
    justify-content:center;}
  .mcell .mspr{width:72px;height:72px;background-size:contain;background-repeat:no-repeat;
    background-position:center bottom;filter:drop-shadow(0 2px 3px #0006);}
  .mcell .mlbl{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:8px;
    color:#fff;background:#000a;padding:0 3px;border-radius:4px;white-space:nowrap;}
  .mcell.mine .mspr{filter:drop-shadow(0 0 5px var(--gold));}
  .mcell:active .mspr{filter:brightness(1.15);}

  /* ===== DEV BAR ===== */
  #devbar{position:absolute;top:6px;right:6px;z-index:35;display:flex;gap:4px;}
  #devbar .db{background:#2a2018cc;color:var(--gold-lt);border:1px solid var(--gold-dk);
    border-radius:6px;font-size:10px;padding:4px 7px;cursor:pointer;font-family:inherit;}
  #devbar .db:active{background:var(--blood);}

  .hint{position:absolute;left:8px;right:8px;bottom:74px;text-align:center;color:#fff;
    font-size:11px;text-shadow:0 1px 3px #000;pointer-events:none;z-index:8;}

  /* ===== BUILD QUEUE DOCK ===== */
  #dock{height:60px;display:flex;align-items:center;gap:6px;padding:6px 8px;
    background:linear-gradient(180deg,#e8dcbd,#cbb888);border-top:2px solid var(--frame);
    z-index:20;overflow-x:auto;}
  #dock::-webkit-scrollbar{display:none;}
  .qs{flex:0 0 auto;width:106px;height:46px;background:#f6efdb;border:1.5px solid var(--frame);
    border-radius:6px;position:relative;display:flex;align-items:center;gap:5px;padding:4px 6px;overflow:hidden;}
  .qs .qic{width:26px;height:26px;background-size:contain;background-repeat:no-repeat;background-position:center;flex:0 0 26px;}
  .qs .qm{display:flex;flex-direction:column;min-width:0;line-height:1.2;}
  .qs .qn{font-size:10px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54px;}
  .qs .qt{font-size:10px;color:var(--blood);font-variant-numeric:tabular-nums;}
  .qs .qbar{position:absolute;left:0;bottom:0;height:3px;background:var(--green);}
  .qs .qx{position:absolute;top:0;right:2px;color:var(--blood);font-size:13px;cursor:pointer;line-height:1;}
  .qs.empty{border-style:dashed;opacity:.5;justify-content:center;}
  .qs.empty .qn{color:var(--stone);}

  /* ===== PANEL ===== */
  #scrim{position:absolute;inset:0;background:#0007;z-index:39;display:none;}
  #scrim.show{display:block;}
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:40;max-height:82%;
    background:var(--panelbg);border-top:3px solid var(--frame);border-radius:14px 14px 0 0;
    transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;box-shadow:0 -8px 26px #0008;}
  #panel.open{transform:translateY(0);}
  #phead{display:flex;align-items:center;gap:10px;padding:11px 14px;
    background:linear-gradient(180deg,#f7be3e,#dd9f26);border-radius:11px 11px 0 0;
    border-bottom:2px solid var(--frame);}
  #phead .pic{width:30px;height:30px;background-size:contain;background-repeat:no-repeat;background-position:center;}
  #phead .pt{font-size:16px;font-weight:bold;color:#3a2410;}
  #phead .ps{font-size:11px;color:#5a3c14;}
  #pclose{margin-left:auto;font-size:22px;color:#3a2410;cursor:pointer;font-weight:bold;}
  #ptabs{display:flex;background:#ddd0b0;border-bottom:1px solid var(--frame);}
  #ptabs .t2{flex:1;text-align:center;padding:7px;font-size:11px;font-weight:bold;color:var(--ink-soft);
    cursor:pointer;border-right:1px solid #0001;}
  #ptabs .t2.on{background:var(--panelbg);color:var(--blood);box-shadow:inset 0 -2px 0 var(--blood);}
  #pbody{overflow-y:auto;padding:10px 12px 16px;}

  .card{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-bottom:8px;
    background:#fbf6e8;border:1px solid var(--frame);border-radius:8px;}
  .card .ci{width:36px;height:36px;flex:0 0 36px;background-size:contain;background-repeat:no-repeat;
    background-position:center;}
  .card .cm{flex:1;min-width:0;}
  .card .cn{font-size:13px;font-weight:bold;}
  .card .cd{font-size:10.5px;color:var(--ink-soft);margin-top:1px;}
  .card .cc{font-size:10.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums;}
  .card .cc .ok{color:var(--green-dk);} .card .cc .no{color:var(--blood);} .card .cc .tm{color:var(--gold-dk);}
  .btn{padding:7px 12px;border-radius:6px;border:1px solid var(--gold-dk);cursor:pointer;
    background:linear-gradient(180deg,#f7be3e,#d99a23);color:#3a2410;font-weight:bold;font-size:12px;
    font-family:inherit;white-space:nowrap;}
  .btn:active{filter:brightness(.92);}
  .btn.gray{background:linear-gradient(180deg,#d8cdb2,#b4a684);}
  .btn.gem{background:linear-gradient(180deg,#e85a8a,#b83a6a);color:#fff;border-color:#822848;}
  .btn:disabled{opacity:.4;filter:grayscale(.5);}
  .pinfo{font-size:11px;color:var(--ink-soft);padding:6px 2px 10px;line-height:1.5;}
  .joke{font-size:10px;color:#a85a3a;font-style:italic;padding:2px 2px 8px;}

  /* WHEEL */
  #wheelWrap{display:flex;flex-direction:column;align-items:center;padding:6px;}
  #wheel{width:230px;height:230px;border-radius:50%;position:relative;border:6px solid var(--gold-dk);
    background:conic-gradient(#c0533a 0 45deg,#d4ab43 45deg 90deg,#4e7a28 90deg 135deg,
      #3a6ea5 135deg 180deg,#9c3322 180deg 225deg,#d99a23 225deg 270deg,#5a7a38 270deg 315deg,#7a4a9a 315deg 360deg);
    transition:transform 4s cubic-bezier(.15,.6,.2,1);box-shadow:0 4px 16px #0007,inset 0 0 30px #0005;}
  #wheel .seg{position:absolute;left:50%;top:50%;font-size:18px;transform-origin:0 0;}
  #wheelPin{font-size:28px;margin-bottom:-6px;z-index:2;filter:drop-shadow(0 2px 2px #000);}
  #wheelHub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;
    border-radius:50%;background:radial-gradient(#f0d27a,#9a7820);border:3px solid #6a5010;z-index:3;}

  /* ===== TOAST ===== */
  #toast{position:absolute;left:50%;top:96px;transform:translateX(-50%) translateY(-16px);
    background:#2a2018ee;color:var(--gold-lt);border:1px solid var(--gold-dk);padding:8px 16px;
    border-radius:18px;font-size:12px;z-index:60;opacity:0;transition:.2s;pointer-events:none;
    max-width:88%;text-align:center;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="game">
  <div id="nav">
    <div class="navtab active" data-s="city"><span>🏰</span>TOWN</div>
    <div class="navtab" data-s="map"><span>🗺️</span>MAP</div>
    <div class="navtab" data-s="shop"><span>🛒</span>SHOP</div>
    <div id="srv"><span>Server</span><b>SS37</b></div>
  </div>

  <div id="resbar"></div>

  <div id="stage">
    <div class="screen active" id="screen-city">
      <div id="cityScroll"><div id="cityInner">
        <div id="fieldGround" class="spr"></div>
        <div class="zonelabel" id="zoneOuter">⬡ OUTER FIELDS — resources</div>
        <div id="innerTown">
          <div id="cobble" class="spr"></div>
          <div class="wallpiece" id="wallTop"></div>
          <div class="wallpiece" id="wallBot"></div>
          <div class="wallpiece" id="wallL"></div>
          <div class="wallpiece" id="wallR"></div>
          <div class="corner fb tl" id="cTL"></div><div class="corner fb tr" id="cTR"></div>
          <div class="corner fb bl" id="cBL"></div><div class="corner fb br" id="cBR"></div>
          <div class="zonelabel" id="zoneInner" style="top:-2px;left:50%;transform:translateX(-50%)">⚔ INNER TOWN</div>
        </div>
        <div id="plots"></div>
      </div></div>
      <div class="hint" id="cityHint">Build resource fields outside · town buildings inside the walls</div>
    </div>

    <div class="screen" id="screen-map">
      <div id="mapScroll"><div id="mapInner"></div></div>
      <div class="hint">Tap a barbarian or derelict town to scout or attack</div>
    </div>

    <div class="screen" id="screen-shop"></div>

    <div id="devbar">
      <button class="db" id="dev-ff">⏩+1h</button>
      <button class="db" id="dev-ff6">⏩+6h</button>
      <button class="db" id="dev-res">💰</button>
      <button class="db" id="dev-reset">↺</button>
    </div>
  </div>

  <div id="dock"></div>

  <div id="scrim"></div>
  <div id="panel">
    <div id="phead"><span class="pic spr" id="pic"></span>
      <div><div class="pt" id="ptitle">Title</div><div class="ps" id="psub">sub</div></div>
      <span id="pclose">✕</span></div>
    <div id="ptabs"></div>
    <div id="pbody"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
"use strict";
/* ===========================================================
   STONEHOLD v3
   Folder architecture: sprites referenced by path, graceful fallback.
   One town · Evony-hard economy · wheel · satirical shop.
   =========================================================== */

const SPRITES="sprites/", SOUNDS="sounds/";

/* ===== ATLAS SYSTEM =====================================================
   All sprites live in ONE image (sprites/atlas.webp) sliced by coordinates
   from the embedded ATLAS map. One HTTP request instead of 30+.
   Logical game names are bridged to atlas keys via ANAME below.        */
const ATLAS={"image": "atlas.webp", "w": 522, "h": 800, "count": 28, "sprites": {"bld_farm": {"x": 392, "y": 713, "w": 128, "h": 85}, "bld_sawmill": {"x": 2, "y": 713, "w": 128, "h": 85}, "bld_quarry": {"x": 262, "y": 713, "w": 128, "h": 85}, "bld_mine": {"x": 132, "y": 713, "w": 128, "h": 85}, "bld_cottage": {"x": 2, "y": 626, "w": 128, "h": 85}, "bld_beacon": {"x": 392, "y": 496, "w": 102, "h": 128}, "wall_set": {"x": 392, "y": 366, "w": 128, "h": 85}, "map_castle": {"x": 2, "y": 496, "w": 128, "h": 102}, "icons_books": {"x": 132, "y": 496, "w": 128, "h": 85}, "terrain_cobble": {"x": 262, "y": 236, "w": 128, "h": 128}, "terrain_grass": {"x": 262, "y": 366, "w": 128, "h": 128}, "terrain_dirt": {"x": 132, "y": 366, "w": 128, "h": 102}, "gui_button": {"x": 392, "y": 236, "w": 128, "h": 64}, "icons_resources": {"x": 132, "y": 236, "w": 128, "h": 52}, "map_barbarian": {"x": 2, "y": 366, "w": 128, "h": 107}, "map_derelict": {"x": 262, "y": 132, "w": 128, "h": 102}, "icons_stats": {"x": 2, "y": 236, "w": 128, "h": 43}, "gui_label": {"x": 392, "y": 132, "w": 128, "h": 64}, "gui_banner": {"x": 392, "y": 2, "w": 128, "h": 43}, "gui_panel": {"x": 132, "y": 132, "w": 128, "h": 85}, "deco_rocks": {"x": 2, "y": 132, "w": 128, "h": 85}, "deco_pond": {"x": 262, "y": 2, "w": 128, "h": 85}, "deco_shrub": {"x": 132, "y": 2, "w": 128, "h": 85}, "deco_reeds": {"x": 2, "y": 2, "w": 128, "h": 128}, "bld_townhall": {"x": 132, "y": 626, "w": 128, "h": 85}, "bld_market": {"x": 262, "y": 496, "w": 128, "h": 85}, "bld_barracks": {"x": 392, "y": 626, "w": 128, "h": 85}, "bld_warehouse": {"x": 262, "y": 626, "w": 128, "h": 85}}};
const ATLAS_IMG=SPRITES+ATLAS.image;   // sprites/atlas.webp
let ATLAS_OK=false;
const _atlasImg=new Image();
_atlasImg.onload=()=>{ATLAS_OK=true;};
_atlasImg.onerror=()=>{ATLAS_OK=false;};
_atlasImg.src=ATLAS_IMG;

/* logical sprite name -> atlas key */
const ANAME={
  field:"terrain_dirt", cobble:"terrain_cobble", grass:"terrain_grass",
  farm:"bld_farm", sawmill:"bld_sawmill", quarry:"bld_quarry", mine:"bld_mine",
  townhall:"bld_townhall", market:"bld_market", barracks:"bld_barracks",
  cottage:"bld_cottage", beacon:"bld_beacon", warehouse:"bld_warehouse",
  map_castle:"map_castle", map_barb:"map_barbarian", map_derelict:"map_derelict",
  gui_panel:"gui_panel", gui_banner:"gui_banner", gui_button:"gui_button",
  // walls: the atlas packs segment+gate+tower as one "wall_set" strip (3 across)
  wallseg:"wall_set", wallgate:"wall_set", walltower:"wall_set",
  // decorations
  deco_rocks:"deco_rocks", deco_pond:"deco_pond", deco_shrub:"deco_shrub", deco_reeds:"deco_reeds",
};
/* wall_set sub-slicing: which third of the strip each wall piece uses */
const WALLSUB={wallseg:0, wallgate:1, walltower:2};

/* fallback emoji when atlas missing (alpha always reads) */
const FB={farm:"🌾",sawmill:"🪵",quarry:"🪨",mine:"⛏️",townhall:"🏛️",market:"🏪",barracks:"⚔️",
  cottage:"🏠",beacon:"🗼",warehouse:"📦",map_castle:"🏰",map_barb:"⛺",map_derelict:"🏚️",map_flat:"🟫",
  ic_food:"🌾",ic_wood:"🪵",ic_stone:"🪨",ic_iron:"⛓️",ic_gold:"🪙",
  def_trap:"🕳️",def_abatis:"🪵",def_archer:"🏹",def_rolling:"🪵",def_trebuchet:"⚙️",
  book_0:"📜",book_1:"📗",book_2:"📘",book_3:"📕",book_4:"📙"};

/* resource/book/defense icon rows: which atlas strip + index + count */
const SLICE={
  ic_food:{a:"icons_resources",i:0,n:5}, ic_wood:{a:"icons_resources",i:1,n:5},
  ic_stone:{a:"icons_resources",i:2,n:5}, ic_iron:{a:"icons_resources",i:3,n:5},
  ic_gold:{a:"icons_resources",i:4,n:5},
  book_0:{a:"icons_books",i:0,n:5}, book_1:{a:"icons_books",i:1,n:5},
  book_2:{a:"icons_books",i:2,n:5}, book_3:{a:"icons_books",i:3,n:5}, book_4:{a:"icons_books",i:4,n:5},
};

/* Build a CSS background that crops the atlas to one sprite cell.
   We scale the whole atlas so the target cell fills the element box. */
function atlasBg(key, sub, subN){
  const s=ATLAS.sprites[key]; if(!s||!ATLAS_OK) return null;
  // sub-slice within a horizontal strip (walls, icon rows)
  let sx=s.x, sw=s.w;
  if(typeof sub==="number" && subN){ sw=s.w/subN; sx=s.x+sub*sw; }
  // background-size scales atlas so the cell maps to 100% of the element;
  // background-position shifts to the cell origin.
  const bsW=ATLAS.w/sw*100, bsH=ATLAS.h/s.h*100;
  const posX = sw<ATLAS.w ? (sx/(ATLAS.w-sw))*100 : 0;
  const posY = s.h<ATLAS.h ? (s.y/(ATLAS.h-s.h))*100 : 0;
  return { image:`url("${ATLAS_IMG}")`, size:`${bsW}% ${bsH}%`,
           pos:`${posX}% ${posY}%` };
}

/* ===========================================================
   ONLINE LAYER — server-authoritative bridge
   When logged in (hmf_s5_session present), the game runs ONLINE:
   the server owns the economy, the client renders snapshots.
   When not logged in, falls back to local offline play (alpha).
   =========================================================== */
const API_BASE="https://hilbert-backend.vercel.app/api/profile";
function s5sid(){ return localStorage.getItem("hmf_s5_session")||localStorage.getItem("s5_session")||""; }
let ONLINE=!!s5sid();
let SNAP=null;            // latest server snapshot
let TIER="CIVILIAN";

async function srv(cmd,args={}){
  const sid=s5sid(); if(!sid){ONLINE=false;return {ok:false,error:"not_logged_in"};}
  try{
    const r=await fetch(API_BASE,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"game",s5SessionId:sid,cmd,...args})});
    const d=await r.json();
    if(d&&d.game){ SNAP=d.game; TIER=d.game.tier||"CIVILIAN"; hydrateFromSnap(d.game); }
    if(d&&!d.ok&&d.error&&d.error!=="ok") toast(gErr(d.error));
    return d;
  }catch(e){ return {ok:false,error:"network_error"}; }
}
const GERR={not_logged_in:"Log in with your S5 code to play online.",insufficient_resources:"Not enough resources.",
  queue_full:"Queue full — upgrade Town Hall.",already_queued:"Already in the build queue.",wrong_zone:"Resource fields go outside; town buildings inside.",
  plot_occupied:"That plot is taken.",max_level:"Already at max level.",no_barracks:"Build a Barracks first.",
  already_training:"Troops already training.",daily_not_ready:"Daily pack not ready yet.",rate_limited:"Slow down a moment.",
  network_error:"Connection hiccup — try again.",session_required:"Session expired — log in again."};
function gErr(c){ return GERR[c]||("Error: "+c); }

/* Map the server's flat plots[] onto the client S.outer[]/S.inner[] shape,
   so ALL existing render code keeps working unchanged. */
function hydrateFromSnap(g){
  // resources
  S.res={food:g.res.food,wood:g.res.wood,stone:g.res.stone,iron:g.res.iron,gold:g.res.gold};
  S._rates=g.rates; S._cap=g.storeCap; S._queueMax=g.queueMax;
  S.troops=g.troops; S.wallsLvl=g.wallsLvl; S._upkeep=g.upkeep; S._serverNow=g.serverNow;
  // plots: server ids o0..o7 (outer), i0..i15 (inner)
  S.outer.forEach((p,idx)=>{ const sp=g.plots.find(x=>x.id==="o"+idx); if(sp){p.type=sp.type;p.lvl=sp.lvl;} else {p.type=null;p.lvl=0;} });
  S.inner.forEach((p,idx)=>{ const sp=g.plots.find(x=>x.id==="i"+idx); if(sp){p.type=sp.type;p.lvl=sp.lvl;} else {p.type=null;p.lvl=0;} });
  // queue: map server queue → client shape with ref for plot-matching
  S.queue=(g.queue||[]).map(q=>{
    const o={type:q.kind==="walls"?"walls":(q.kind==="train"?"train":q.type),toLvl:q.toLvl,
      dur:Math.max(1,(q.ends - (g.serverNow - (Date.now()-g.serverNow)))/1000)*1000,
      ends:Date.now()+q.remainingMs, amount:q.amount, kind:q.kind};
    if(q.plotId){ const z=q.plotId[0]==="o"?"outer":"inner"; const idx=+q.plotId.slice(1); o.ref={zone:z,idx}; }
    return o;
  });
}

function load(){ if(MEM)return MEM; MEM=freshState(); return MEM; }

/* ---- derived ---- */
function allPlots(){ return [...S.outer,...S.inner]; }
function findType(t){ return allPlots().find(p=>p.type===t); }
function lvlOf(t){ if(t==="walls")return S.wallsLvl; const p=findType(t); return p?p.lvl:0; }
function queueMax(){ if(ONLINE&&S._queueMax!=null)return S._queueMax; return 1+Math.floor(lvlOf("townhall")/3); }
function storeCap(){ if(ONLINE&&S._cap!=null)return S._cap; let c=6000; for(const p of allPlots()) if(p.type==="warehouse")c+=p.lvl*10000;
  c+=lvlOf("townhall")*3000; return c; }
function upkeep(){ if(ONLINE&&S._upkeep!=null)return S._upkeep; return S.troops*2; }
function costFor(t,lv){ const d=(t==="walls")?B.walls:B[t]; const m=Math.pow(d.wall?2.05:1.7,lv-1);
  const o={}; for(const k in d.base)o[k]=Math.round(d.base[k]*m); return o; }
function timeFor(t,lv){ const d=(t==="walls")?B.walls:B[t]; const mult=d.wall?2.35:1.55;
  return Math.round(d.t*Math.pow(mult,lv-1)); }
function prodAt(t,lv){ const d=B[t]; const o={}; for(const k in d.prod)o[k]=Math.round(d.prod[k]*lv*(1+(lv-1)*0.2)); return o; }
function rates(){ if(ONLINE&&S._rates)return S._rates; const r={food:0,wood:0,stone:0,iron:0,gold:0};
  for(const p of allPlots()){ if(!p.type||p.lvl<1)continue; const pr=prodAt(p.type,p.lvl); for(const k in pr)r[k]+=pr[k]; }
  r.food-=upkeep(); return r; }
function canAfford(c){ for(const k in c) if((S.res[k]||0)<c[k])return false; return true; }
function spend(c){ for(const k in c)S.res[k]-=c[k]; }

/* ---- tick ---- */
function tick(){
  if(ONLINE){
    // Online: interpolate resource counters locally for a live feel.
    // Server is truth; we just smooth the display between polls.
    if(S._rates&&S._serverNow){ const elHr=Math.max(0,(Date.now()-S._serverNow))/3600000; const cap=storeCap();
      for(const k of RES){ let v=(SNAP?SNAP.res[k]:S.res[k])+(S._rates[k]||0)*elHr; if(v<0)v=0; if(v>cap)v=cap; S.res[k]=v; } }
    return;
  }
  const now=Date.now(); let dt=(now-S.lastTick)/1000; if(dt<0)dt=0;
  if(dt>0){ const r=rates(),cap=storeCap();
    for(const k of RES){ let v=S.res[k]+r[k]*dt/3600; v=Math.min(cap,v); if(k==="food")v=Math.max(0,v); S.res[k]=v; }
    S.lastTick=now; }
  let dirty=false;
  for(let i=S.queue.length-1;i>=0;i--){ const q=S.queue[i];
    if(now>=q.ends){
      if(q.def){ S.defense[q.def]++; toast(`${DEF[q.def].n} built!`); }
      else if(q.type==="walls"){ S.wallsLvl=q.toLvl; toast(`Walls → Lv.${q.toLvl}! ✨`); }
      else { const p=plotRef(q.ref); p.type=q.type; p.lvl=q.toLvl; toast(`${B[q.type].n} ${q.toLvl>1?"→ Lv."+q.toLvl:"raised"}! ✨`); }
      sfx("complete"); S.queue.splice(i,1); dirty=true;
    } }
  if(dirty){ renderCity(); renderDock(); }
}
function plotRef(ref){ return ref.zone==="outer"?S.outer[ref.idx]:S.inner[ref.idx]; }

/* ---- enqueue ---- */
function enqueue(ref,type,toLvl){
  if(ONLINE){
    const plotId=ref?(ref.zone==="outer"?"o"+ref.idx:"i"+ref.idx):null;
    if(toLvl===1){ srv("build",{plotId,type}).then(d=>{ if(d.ok){sfx("build");refresh();} }); }
    else { srv("upgrade",{plotId}).then(d=>{ if(d.ok){sfx("build");refresh();} }); }
    return true; // optimistic close; server result re-renders
  }
  if(S.queue.length>=queueMax()){ toast("Queue full — upgrade Town Hall."); return false; }
  if(ref && S.queue.some(q=>q.ref&&q.ref.zone===ref.zone&&q.ref.idx===ref.idx)){ toast("Plot already under work."); return false; }
  const c=costFor(type,toLvl); if(!canAfford(c)){ toast("Not enough resources."); return false; }
  spend(c); const dur=timeFor(type,toLvl)*1000;
  const q={type,toLvl,dur,ends:Date.now()+dur}; if(ref)q.ref=ref;
  S.queue.push(q); sfx("build"); save(); refresh(); return true;
}
function enqueueWall(toLvl){
  if(ONLINE){ srv("walls",{}).then(d=>{ if(d.ok){sfx("build");refresh();} }); return true; }
  if(S.queue.length>=queueMax()){ toast("Queue full."); return false; }
  if(S.queue.some(q=>q.type==="walls")){ toast("Walls already under work."); return false; }
  const c=costFor("walls",toLvl); if(!canAfford(c)){ toast("Not enough resources."); return false; }
  spend(c); const dur=timeFor("walls",toLvl)*1000;
  S.queue.push({type:"walls",toLvl,dur,ends:Date.now()+dur}); sfx("build"); save(); refresh(); return true;
}
function enqueueDef(key){
  if(S.queue.length>=queueMax()){ toast("Queue full."); return false; }
  const c=DEF[key].cost; if(!canAfford(c)){ toast("Not enough resources."); return false; }
  spend(c); S.queue.push({def:key,dur:DEF[key].t*1000,ends:Date.now()+DEF[key].t*1000}); sfx("build"); save(); refresh(); return true;
}
function cancelQ(i){ if(ONLINE){ toast("Cancel isnt available online yet."); return; } const q=S.queue[i]; if(!q)return;
  const c=q.def?DEF[q.def].cost:costFor(q.type,q.toLvl);
  for(const k in c)S.res[k]+=Math.round(c[k]*0.5);
  S.queue.splice(i,1); toast("Cancelled — half refunded."); sfx("click"); save(); refresh(); }
function applyGuide(qi,gk){ if(ONLINE){ toast("Speed-ups arent available online yet."); return; } const q=S.queue[qi]; if(!q)return;
  if((S.guides[gk]||0)<=0){ toast("None left."); return; }
  S.guides[gk]--; q.ends-=GUIDE.find(g=>g.k===gk).cut*1000; if(q.ends<Date.now())q.ends=Date.now();
  toast("Time shortened!"); sfx("click"); save(); refresh(); openSpeedup(qi); }

  // dock timers

  dock.querySelectorAll(".qs").forEach((s,i)=>{ const q=S.queue[i]; if(!q)return;
    const t=s.querySelector(".qt"); if(t)t.textContent=fmt((q.ends-Date.now())/1000);
    const bar=s.querySelector(".qbar"); if(bar){const prog=1-((q.ends-Date.now())/1000)/(q.dur/1000);bar.style.width=Math.max(0,Math.min(100,prog*100))+"%";}
  });
  // plot timers
  document.querySelectorAll(".plot .btmr").forEach(el=>{
    const pl=el.closest(".plot");
  });
}

/* ===========================================================
   INTERACTION
   =========================================================== */
let SEL=null;
function tapPlot(ref){
  SEL=ref; const p=plotRef(ref);
  const q=S.queue.find(q=>q.ref&&q.ref.zone===ref.zone&&q.ref.idx===ref.idx);
  if(q){ toast(`Building — ${fmt((q.ends-Date.now())/1000)} left`); renderCity(); return; }
  if(!p.type) openBuild(ref); else openUpgrade(ref);
  renderCity();
}
function tapMap(i){ const c=S.map[i]; if(c.kind==="castle")openMine(c); else openTarget(c,i); sfx("click"); }

/* panel plumbing */
const panel=document.getElementById("panel"),scrim=document.getElementById("scrim");
function setHead(iconName,t,s,sliceKey){ const pic=document.getElementById("pic");
  if(sliceKey)applySlice(pic,sliceKey); else if(iconName)applySpr(pic,iconName); else {pic.style.backgroundImage="none";pic.textContent="";}
  document.getElementById("ptitle").textContent=t; document.getElementById("psub").textContent=s; }
function setTabs(tabs,active,cb){ const w=document.getElementById("ptabs");
  if(!tabs){w.style.display="none";w.innerHTML="";return;} w.style.display="flex";w.innerHTML="";
  tabs.forEach(t=>{const e=document.createElement("div");e.className="t2"+(t.k===active?" on":"");e.textContent=t.label;e.onclick=()=>cb(t.k);w.appendChild(e);}); }
function openPanel(){ panel.classList.add("open"); scrim.classList.add("show"); }
function closePanel(){ panel.classList.remove("open"); scrim.classList.remove("show"); SEL=null; renderCity(); }
document.getElementById("pclose").onclick=closePanel; scrim.onclick=closePanel;

function openBuild(ref){
  const zone=ref.zone;
  setHead(null,"Raise a Building", zone==="outer"?"Outer field plot":"Inner town plot");
  setTabs(null);
  const body=document.getElementById("pbody"); body.innerHTML="";
  const note=document.createElement("div");note.className="pinfo";
  note.innerHTML = zone==="outer"
    ? "Outer fields hold your <b>resource economy</b> — farms, sawmills, quarries, mines."
    : "Inside the walls go <b>civic & military</b> buildings.";
  body.appendChild(note);
  const list = zone==="outer"?OUTER:INNER;
  list.forEach(type=>{ if(B[type].unique&&findType(type))return;
    body.appendChild(buildCard(type,1,()=>{ if(enqueue(ref,type,1))closePanel(); })); });
  openPanel();
}
function openUpgrade(ref){
  const p=plotRef(ref),d=B[p.type];
  setHead(p.type,d.n,`Level ${p.lvl}`);
  setTabs(null);
  const body=document.getElementById("pbody"); body.innerHTML="";
  if(Object.keys(d.prod).length){ const now=prodAt(p.type,p.lvl),nx=prodAt(p.type,p.lvl+1);
    const pv=document.createElement("div");pv.className="card";
    let h=`<div class="ci">📈</div><div class="cm"><div class="cn">Production</div><div class="cc">`;
    for(const k in now)h+=`<span class="ok">${now[k]} → ${nx[k]}/h ${k}</span>`; h+=`</div></div>`;
    pv.innerHTML=h; body.appendChild(pv); }
  if(d.barracks)body.appendChild(barracksCard(p,ref));
  if(d.max&&p.lvl>=d.max){ const m=document.createElement("div");m.className="pinfo";m.textContent="Maximum level.";body.appendChild(m); }
  else body.appendChild(buildCard(p.type,p.lvl+1,()=>{ if(enqueue(ref,p.type,p.lvl+1))closePanel(); },true));
  openPanel();
}
function buildCard(type,toLvl,onclick,isUpg){
  const d=B[type],c=costFor(type,toLvl);
  const card=document.createElement("div");card.className="card";
  let cc=""; for(const k in c){const ok=(S.res[k]||0)>=c[k];cc+=`<span class="${ok?"ok":"no"}">${c[k].toLocaleString()} ${k}</span>`;}
  cc+=`<span class="tm">⏱ ${fmt(timeFor(type,toLvl))}</span>`;
  let desc=d.d; if(type==="townhall")desc=`Queue slots → ${1+Math.floor(toLvl/3)}`;
  card.innerHTML=`<div class="ci" data-ci="${type}"></div><div class="cm">
    <div class="cn">${isUpg?("Upgrade → Lv."+toLvl):d.n}</div><div class="cd">${desc}</div>
    <div class="cc">${cc}</div></div>`;
  applySpr(card.querySelector("[data-ci]"),type);
  const b=document.createElement("button");b.className="btn";b.textContent=isUpg?"Upgrade":"Build";
  if(!canAfford(c))b.disabled=true; b.onclick=onclick; card.appendChild(b); return card;
}
function barracksCard(p,ref){
  const card=document.createElement("div");card.className="card";const cost={food:150,gold:60};
  card.innerHTML=`<div class="ci">🪖</div><div class="cm"><div class="cn">Train 10 Troops</div>
    <div class="cd">Troops ${S.troops} · upkeep ${upkeep()} food/h</div>
    <div class="cc"><span class="${S.res.food>=150?"ok":"no"}">150 food</span><span class="${S.res.gold>=60?"ok":"no"}">60 gold</span></div></div>`;
  const b=document.createElement("button");b.className="btn";b.textContent="Train";
  if(!canAfford(cost))b.disabled=true;
  b.onclick=()=>{ if(ONLINE){ srv("train",{batches:1}).then(d=>{ if(d.ok){toast("Training troops...");sfx("coin");refresh();openUpgrade(ref);} }); return; } spend(cost);S.troops+=10;toast("10 troops trained.");sfx("coin");save();refresh();openUpgrade(ref);};
  card.appendChild(b);return card;
}

/* walls */
let WT="up";
function openWallsPanel(){
  setHead("walltower","City Walls",`Level ${S.wallsLvl}`);
  setTabs([{k:"up",label:"Upgrade"},{k:"def",label:"Defenses"}],WT,(k)=>{WT=k;openWallsPanel();});
  const body=document.getElementById("pbody");body.innerHTML="";
  if(WT==="up"){ const info=document.createElement("div");info.className="pinfo";
    info.innerHTML=`Next level: <b>${fmt(timeFor("walls",S.wallsLvl+1))}</b> of building. ${S.wallsLvl>=8?"Near the top — these take real time.":""}`;
    body.appendChild(info);
    if(S.wallsLvl>=B.walls.max){const m=document.createElement("div");m.className="pinfo";m.textContent="Walls maxed (Lv.10).";body.appendChild(m);}
    else { const c=costFor("walls",S.wallsLvl+1);
      const card=document.createElement("div");card.className="card";
      let cc="";for(const k in c){const ok=S.res[k]>=c[k];cc+=`<span class="${ok?"ok":"no"}">${c[k].toLocaleString()} ${k}</span>`;}
      cc+=`<span class="tm">⏱ ${fmt(timeFor("walls",S.wallsLvl+1))}</span>`;
      card.innerHTML=`<div class="ci" data-ci="wt"></div><div class="cm"><div class="cn">Upgrade → Lv.${S.wallsLvl+1}</div>
        <div class="cd">${B.walls.d}</div><div class="cc">${cc}</div></div>`;
      applySpr(card.querySelector("[data-ci]"),"walltower");
      const b=document.createElement("button");b.className="btn";b.textContent="Upgrade";
      if(!canAfford(c))b.disabled=true; b.onclick=()=>{if(enqueueWall(S.wallsLvl+1))closePanel();};
      card.appendChild(b);body.appendChild(card); }
  } else {
    const info=document.createElement("div");info.className="pinfo";info.textContent="Fortifications atop your walls.";body.appendChild(info);
    for(const key in DEF){ const d=DEF[key];const card=document.createElement("div");card.className="card";
      let cc="";for(const k in d.cost){const ok=S.res[k]>=d.cost[k];cc+=`<span class="${ok?"ok":"no"}">${d.cost[k]} ${k}</span>`;}
      cc+=`<span class="tm">⏱ ${fmt(d.t)}</span>`;
      card.innerHTML=`<div class="ci" data-ci="${key}"></div><div class="cm">
        <div class="cn">${d.n} <span class="ok">×${S.defense[key]}</span></div><div class="cc">${cc}</div></div>`;
      applySlice(card.querySelector("[data-ci]"),d.ic);
      const b=document.createElement("button");b.className="btn";b.textContent="Build";
      if(!canAfford(d.cost))b.disabled=true; b.onclick=()=>{if(enqueueDef(key))openWallsPanel();};
      card.appendChild(b);body.appendChild(card); }
  }
  openPanel();
}

/* speedup */
function openSpeedup(qi){ const q=S.queue[qi]; if(!q){closePanel();return;}
  const nm=q.def?DEF[q.def].n:(q.type==="walls"?"Walls Lv."+q.toLvl:(B[q.type].n+(q.toLvl>1?" Lv."+q.toLvl:"")));
  if(q.def)setHead(null,nm,"Speed up",q.def===undefined?null:null);
  setHead(null,nm,"Speed up construction");
  if(q.def){const p=document.getElementById("pic");applySlice(p,DEF[q.def].ic);}
  else {const p=document.getElementById("pic");applySpr(p,q.type==="walls"?"walltower":q.type);}
  setTabs(null);
  const body=document.getElementById("pbody");body.innerHTML="";
  const t=document.createElement("div");t.className="pinfo";t.innerHTML=`Remaining: <b>${fmt((q.ends-Date.now())/1000)}</b>`;body.appendChild(t);
  GUIDE.forEach(g=>{ const card=document.createElement("div");card.className="card";
    card.innerHTML=`<div class="ci" data-ci="${g.k}"></div><div class="cm">
      <div class="cn">${g.n} <span class="ok">×${S.guides[g.k]||0}</span></div><div class="cd">Shortens ${fmt(g.cut)}</div></div>`;
    applySlice(card.querySelector("[data-ci]"),g.ic);
    const b=document.createElement("button");b.className="btn";b.textContent="Use";
    if((S.guides[g.k]||0)<=0)b.disabled=true; b.onclick=()=>applyGuide(qi,g.k);
    card.appendChild(b);body.appendChild(card); });
  const fin=document.createElement("button");fin.className="btn gem";fin.style.width="100%";fin.style.marginTop="6px";
  fin.textContent="💎 Finish Now — 3 Cents";
  fin.onclick=()=>{ if(S.cents<3){toast("Not enough Cents. Visit the shop 😏");return;} S.cents-=3;q.ends=Date.now();toast("Rushed with Cents!");sfx("coin");save();tick();refresh();closePanel(); };
  body.appendChild(fin);
  const joke=document.createElement("div");joke.className="joke";joke.textContent="(In real Evony this button cost real money. Here the Cents are fake. 💀)";body.appendChild(joke);
  openPanel();
}

/* map target */
function openTarget(c,i){
  setHead(c.kind==="barb"?"map_barb":"map_derelict",c.name,`Lv.${c.lvl} · ${c.taken?"Conquered":"Hostile"}`);
  setTabs(null);
  const body=document.getElementById("pbody");body.innerHTML="";
  if(c.taken){const d=document.createElement("div");d.className="pinfo";d.textContent="Conquered. Repopulates in time.";body.appendChild(d);openPanel();return;}
  const sc=document.createElement("div");sc.className="card";
  sc.innerHTML=`<div class="ci">🔭</div><div class="cm"><div class="cn">Scout</div><div class="cd">${c.scouted?("Garrison ~"+(c.lvl*50)+" troops"):"Reveal garrison"}</div></div>`;
  const sb=document.createElement("button");sb.className="btn gray";sb.textContent="Scout";
  sb.onclick=()=>{c.scouted=true;toast("Scouts report back.");sfx("click");save();openTarget(c,i);};
  sc.appendChild(sb);body.appendChild(sc);
  const need=c.lvl*50;const ac=document.createElement("div");ac.className="card";
  ac.innerHTML=`<div class="ci">⚔️</div><div class="cm"><div class="cn">Attack</div><div class="cd">You have ${S.troops} troops · need ~${need}</div></div>`;
  const ab=document.createElement("button");ab.className="btn";ab.textContent="Send Army";
  ab.onclick=()=>resolveAttack(c,need);
  ac.appendChild(ab);body.appendChild(ac); openPanel();
}
function resolveAttack(c,need){
  if(S.troops<=0){toast("No troops! Train at the Barracks.");return;}
  sfx("attack");
  if(S.troops>=need){ const loot={food:c.lvl*800,wood:c.lvl*600,stone:c.lvl*500,iron:c.lvl*300,gold:c.lvl*400};
    const lost=Math.round(need*0.3);S.troops-=lost;const cap=storeCap();
    for(const k in loot)S.res[k]=Math.min(cap,S.res[k]+loot[k]); c.taken=true;
    toast(`Victory! Plundered. Lost ${lost} troops.`);
  } else { const lost=Math.min(S.troops,Math.round(need*0.6));S.troops-=lost;toast(`Defeated — lost ${lost}. Bring more.`); }
  save();refresh();closePanel();
}
function openMine(c){
  setHead("map_castle",c.name,`Your hold · Walls Lv.${c.lvl}`);setTabs(null);
  const body=document.getElementById("pbody");body.innerHTML="";
  const d=document.createElement("div");d.className="pinfo";
  d.innerHTML="Your capital. This alpha plays it in the TOWN tab. Second-city expansion comes next.";
  body.appendChild(d);openPanel();
}

/* ===========================================================
   SHOP + WHEEL
   =========================================================== */
function renderShop(){
  const sc=document.getElementById("screen-shop");
  sc.innerHTML=`<div style="position:absolute;inset:0;overflow:auto;padding:14px;background:linear-gradient(180deg,#3a2c18,#241a10);">
    <div style="text-align:center;color:var(--gold);font-size:18px;font-weight:bold;letter-spacing:1px;">⚜ THE COUNTING HOUSE ⚜</div>
    <div style="text-align:center;color:#c8a860;font-size:11px;margin-bottom:14px;">Premium "Cents" — 100% satire, nothing costs real money 😄</div>
    <div id="wheelHost"></div>
    <div id="shopList"></div>
  </div>`;
  // wheel
  const host=sc.querySelector("#wheelHost");
  host.innerHTML=`<div id="wheelWrap">
    <div id="wheelPin">🔻</div>
    <div id="wheel"><div id="wheelHub"></div></div>
    <button class="btn gem" id="spinBtn" style="margin-top:12px;width:200px;">🎡 SPIN  (${S.spins} left)</button>
    <div class="joke" style="text-align:center;">Wheel of Fortune — the alpha already has gacha 💀</div>
  </div>`;
  sc.querySelector("#spinBtn").onclick=spinWheel;
  // shop list
  const list=sc.querySelector("#shopList");
  list.innerHTML=`<div style="color:var(--gold-lt);font-size:13px;font-weight:bold;margin:10px 2px;">🛒 Bundles</div>`;
  SHOP.forEach(item=>{
    const card=document.createElement("div");card.className="card";
    card.innerHTML=`<div class="ci">💎</div><div class="cm"><div class="cn">${item.n}</div>
      <div class="cd">${item.gives}</div><div class="joke">${item.joke}</div></div>`;
    const b=document.createElement("button");b.className="btn gem";b.textContent=`${item.cents}💎`;
    b.onclick=()=>buyItem(item);
    card.appendChild(b);list.appendChild(card);
  });
  // free cents (dev/fun)
  const free=document.createElement("button");free.className="btn";free.style.width="100%";free.style.marginTop="6px";
  free.textContent="🎁 +50 free Cents (alpha generosity)";
  free.onclick=()=>{S.cents+=50;toast("+50 Cents!");sfx("coin");renderRes();renderShop();};
  list.appendChild(free);
}
function buyItem(item){
  if(S.cents<item.cents){toast("Not enough Cents.");return;}
  S.cents-=item.cents; item.act(S); sfx("coin");
  toast(`Bought ${item.n}!`); save(); renderRes(); renderShop();
}
const WHEEL_PRIZES=[
  {label:"+20k Gold",act:s=>s.res.gold=Math.min(storeCap(),s.res.gold+20000)},
  {label:"+5 Cents",act:s=>s.cents+=5},
  {label:"Master Guideline",act:s=>s.guides.master++},
  {label:"+50 Troops",act:s=>s.troops+=50},
  {label:"Nothing 😭",act:s=>{}},
  {label:"+30k Wood",act:s=>s.res.wood=Math.min(storeCap(),s.res.wood+30000)},
  {label:"+2 Spins",act:s=>s.spins+=2},
  {label:"Jackpot! +50k all",act:s=>{const c=storeCap();RES.forEach(k=>s.res[k]=Math.min(c,s.res[k]+50000));}},
];
let spinning=false;
function spinWheel(){
  if(spinning)return;
  if(S.spins<=0){toast("No spins. Buy tokens in the shop 😏");return;}
  spinning=true; S.spins--; sfx("wheel");
  const idx=Math.floor(Math.random()*WHEEL_PRIZES.length);
  const seg=360/WHEEL_PRIZES.length;
  const turns=5*360 + (360 - (idx*seg + seg/2));
  const w=document.getElementById("wheel");
  const cur= (window.__wheelRot||0);
  const next=cur+turns; window.__wheelRot=next;
  w.style.transform=`rotate(${next}deg)`;
  document.getElementById("spinBtn").disabled=true;
  setTimeout(()=>{ const prize=WHEEL_PRIZES[idx]; prize.act(S);
    toast(`🎡 ${prize.label}`); sfx(prize.label.includes("Nothing")?"click":"coin");
    spinning=false; save(); renderRes(); renderShop();
  },4100);
}

/* ---- screens ---- */
function switchScreen(name){
  document.querySelectorAll(".navtab").forEach(x=>x.classList.toggle("active",x.dataset.s===name));
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+name).classList.add("active");
  if(name==="map")renderMap();
  if(name==="shop")renderShop();
  // music swap
  if(name==="map")playMusic("explore"); else if(name==="city")playMusic("town"); else playMusic("town");
}
document.querySelectorAll(".navtab[data-s]").forEach(t=>t.onclick=()=>{sfx("click");switchScreen(t.dataset.s);});

/* music */
let curMusic=null;
function playMusic(name){ const file=name==="explore"?"music_explore":"music_town";
  if(curMusic&&curMusic.dataset.n===name)return;
  try{ if(curMusic){curMusic.pause();}
    const a=new Audio(SOUNDS+file+".mp3"); a.loop=true; a.volume=.4; a.dataset.n=name;
    a.play().then(()=>{curMusic=a;}).catch(()=>{}); }catch(e){} }

/* dev */
function fastForward(sec){ if(ONLINE){ toast("⏱ Online runs on real time — no fast-forward."); return; } S.lastTick-=sec*1000; for(const q of S.queue)q.ends-=sec*1000; tick();refresh();toast(`⏩ +${fmt(sec)}`); }
document.getElementById("dev-ff").onclick=()=>fastForward(3600);
document.getElementById("dev-ff6").onclick=()=>fastForward(6*3600);
document.getElementById("dev-res").onclick=()=>{ if(ONLINE){ srv("daily",{}).then(d=>{ if(d.ok)toast("🎁 Daily pack claimed!"); refresh(); }); return; } const c=storeCap();RES.forEach(k=>S.res[k]=Math.min(c,S.res[k]+50000));refresh();toast("💰 +50k each");};
document.getElementById("dev-reset").onclick=()=>{ if(ONLINE){ srv("reset",{}).then(()=>{SEL=null;refresh();toast("Reset.");}); return; } MEM=freshState();S=MEM;SEL=null;refresh();toast("Reset.");};

/* hint */
function updateHint(){ const built=allPlots().filter(p=>p.type&&!["townhall","farm","sawmill"].includes(p.type)).length;
  document.getElementById("cityHint").style.display=built>0?"none":"block"; }

/* clouds */
function spawnClouds(){ const wrap=document.getElementById("cityScroll");
  for(let i=0;i<3;i++){ const el=document.createElement("div");el.className="cloud";
    const bg=bgFor("cloud"); if(bg)el.style.backgroundImage=bg; else el.classList.add("fb");
    el.style.top=(4+i*20)+"px"; el.style.animationDuration=(36+i*12)+"s"; el.style.animationDelay=(-i*9)+"s";
    wrap.appendChild(el); } }

/* helpers */
function fmt(sec){ sec=Math.max(0,Math.round(sec));
  const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  if(d>0)return `${d}d ${h}h`; if(h>0)return `${h}h ${String(m).padStart(2,"0")}m`;
  if(m>0)return `${m}m ${String(s).padStart(2,"0")}s`; return `${s}s`; }
let toTO; function toast(msg){ const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toTO);toTO=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---- intercept walls tap: the inner zone label opens walls ---- */
document.getElementById("zoneInner").addEventListener("click",openWallsPanel);
// also add a walls button near inner town
(function addWallBtn(){
  const it=document.getElementById("innerTown");
  const b=document.createElement("div");
  b.textContent="🧱 Walls";
  b.style.cssText="position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);background:#2a2018cc;color:#f0d27a;border:1px solid #9a7820;border-radius:6px;font-size:10px;padding:3px 9px;cursor:pointer;z-index:8;white-space:nowrap;";
  b.onclick=openWallsPanel; it.appendChild(b);
})();

/* ===========================================================
   BOOT — probe sprites, then render
   =========================================================== */
async function boot(){
  // Single atlas load replaces per-file probing. Wait briefly for it to decode.
  await new Promise(r=>{ if(ATLAS_OK)return r();
    let n=0; const t=setInterval(()=>{ if(ATLAS_OK||n++>40){clearInterval(t);r();} },50); });
  // apply terrain backgrounds if present
  const fg=document.getElementById("fieldGround"); const fgb=bgFor("field"); if(fgb)fg.style.backgroundImage=fgb;
  const cb=document.getElementById("cobble"); const cbb=bgFor("cobble"); if(cbb)cb.style.backgroundImage=cbb;
  spawnClouds();
  if(ONLINE){ await srv("state"); }   // pull authoritative state before first render
  refresh();
  switchScreen("city");
  updateTierBadge();
  setInterval(()=>{tick();renderRes();renderDock();},1000);
  if(ONLINE) setInterval(()=>{ srv("state").then(()=>{renderRes();renderDock();renderCity();}); },30000);
  setInterval(tickUI,250);
  window.addEventListener("resize",renderCity);
  // welcome-back
  const away=(Date.now()-S.lastTick)/1000;
  if(away>60)setTimeout(()=>toast(`Welcome back — hold worked ${fmt(away)}.`),500);
}

function updateTierBadge(){
  const el=document.querySelector('.navtab[data-s] .srv-sub')||null;
  // Show tier next to Server label if the element exists
  const srvTab=document.getElementById("srvTier");
  if(srvTab){ srvTab.textContent=TIER; srvTab.style.color=(TIER==="DEV"?"#ffd700":TIER==="SENIOR_AGENT"?"#7ad27a":TIER==="AGENT"?"#7aa7ff":"#c9b896"); }
}
boot();
window.RESET=()=>{MEM=freshState();S=MEM;refresh();toast("Reset.");};
