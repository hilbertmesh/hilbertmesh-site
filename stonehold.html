<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STONEHOLD</title>
<style>
  :root{--gold:#e7b24a;--gold-dk:#b9822b;--bg:#241a10;--ink:#f4e6c8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none;}
  #game{position:fixed;inset:0;display:flex;flex-direction:column;}
  #tabs{display:flex;flex:0 0 auto;height:56px;background:#160f08;}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;
    font-size:15px;background:linear-gradient(180deg,#f0e3bd,#ddc794);color:#4a3620;border-right:1px solid #b9822b55;
    font-family:Georgia,'Times New Roman',serif;text-shadow:0 1px 0 #fff8;border-bottom:3px solid #b9822b;}
  .tab.alt{background:linear-gradient(180deg,#eaddb4,#d5bf8c);}
  .tab.on{background:linear-gradient(180deg,#f6cf62,#d99b28);box-shadow:inset 0 -3px 0 #8a5f22,inset 0 2px 0 #ffe9ae;border-bottom-color:#8a5f22;}
  .tab.server{flex:0 0 84px;background:#160f08;color:var(--gold);flex-direction:column;gap:0;font-size:11px;}
  .tab.server b{font-size:15px;}
  #res{display:flex;flex:0 0 auto;height:60px;background:linear-gradient(180deg,#f2e4bf,#e0cb9b);border-bottom:3px solid #b9822b;}
  .rc{flex:1;display:flex;align-items:center;gap:6px;padding:0 5px;border-right:1px solid #b9822b40;}
  .rc canvas{width:26px;height:26px;flex:0 0 26px;}
  .rc .v{font-weight:800;font-size:16px;line-height:1;color:#3a2914;text-shadow:0 1px 0 #fff8;}
  .rc .r{font-size:11px;color:#3f7a26;line-height:1;margin-top:2px;font-weight:700;}
  #stageWrap{position:relative;flex:1 1 auto;overflow:hidden;background:#0c0906;}
  #stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;color:#fff;
    text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;font-weight:600;padding:0 12px;}
  #topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;}
  .tb{background:linear-gradient(180deg,#fdf3d5 0%,#f2ddae 46%,#e3c98f 54%,#d5b878 100%);border:2px solid #b9822b;color:#5a3c14;
    border-radius:8px;padding:6px 9px;font-weight:800;font-size:13px;
    box-shadow:0 2px 0 #8a5f22,0 3px 4px #0004,inset 0 1px 0 #fffb,inset 0 -3px 5px #b9822b44;
    text-shadow:0 1px 0 #fff8;}
  .tb:active{transform:translateY(1px);box-shadow:0 1px 0 #8a5f22,inset 0 1px 0 #fffb;}
  #logbar{flex:0 0 auto;background:linear-gradient(180deg,#fdf6e0,#f2e6c6);border-top:3px solid #b9822b;
    font-size:12.5px;max-height:26px;overflow:hidden;transition:max-height .18s;}
  #logbar.open{max-height:200px;}
  #logLatest{padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8a2f1f;font-weight:700;}
  #logList{display:none;overflow-y:auto;max-height:140px;padding:2px 10px 6px;}
  #logbar.open #logList{display:block;}
  #logbar.open #logLatest{border-bottom:1px solid #b9822b55;}
  #logChev{float:right;color:#8a5f22;font-weight:900;}
  #chatstub{display:none;padding:4px 10px 7px;color:#8a3a2a;font-size:11.5px;border-top:1px dashed #b9822b66;}
  #logbar.open #chatstub{display:block;}
  #chatstub .ch{background:#fff;border:1px solid #b9822b;border-radius:4px;padding:0 7px;margin-right:6px;color:#4a3620;font-weight:800;}
  .lg{padding:2px 0;line-height:1.35;}
  .lg .t{color:#8a7a55;font-size:10.5px;margin-right:5px;}
  .lg.system{color:#b3382a;} .lg.battle{color:#7a1f1f;font-weight:700;}
  .lg.scout{color:#1f4d7a;} .lg.done{color:#3f6d28;} .lg.world{color:#4a3620;}
  .lg.whisper{color:#7a3fa0;font-style:italic;}   /* private messages — purple, of course */
  #wallBtn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:linear-gradient(180deg,#f4e7c2,#dfc893);
    border:2px solid #b9822b;color:#5a3c14;border-radius:8px;padding:7px 16px;font-weight:800;display:none;
    box-shadow:0 2px 0 #8a5f22,inset 0 1px 0 #fff8;font-family:Georgia,serif;}
  #tier{position:absolute;top:8px;left:8px;background:linear-gradient(180deg,#f4e7c2,#dfc893);border:2px solid #b9822b;color:#5a3c14;
    border-radius:8px;padding:4px 9px;font-size:11px;font-weight:800;box-shadow:0 2px 0 #8a5f22;}
  #stageWrap{border-left:7px solid;border-right:7px solid;
    border-image:linear-gradient(180deg,#e2bd6d,#b9822b 30%,#8a5f22 90%) 1;}
  #shop{position:absolute;inset:0;display:none;overflow:auto;padding:16px;background:linear-gradient(180deg,#3a2c18,#241a10);}
  #shop h2{color:var(--gold);text-align:center;margin:2px;} #shop .sub{text-align:center;color:#d8b98a;font-size:13px;margin-bottom:12px;}
  #wheel{width:240px;height:240px;border-radius:50%;border:7px solid var(--gold-dk);display:block;margin:0 auto;}
  .shopSec{margin:16px 8px 6px;font-weight:800;color:#e7b24a;border-bottom:1px solid #b9822b55;padding-bottom:4px;}
  #spinBtn{display:block;margin:12px auto;background:#d24d84;color:#fff;border:none;border-radius:10px;padding:12px 40px;font-weight:800;font-size:17px;}
  .card{background:#f3e6c8;color:#3a2610;border-radius:12px;padding:14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;}
  #dock{flex:0 0 auto;height:78px;background:linear-gradient(180deg,#e9dcbd,#d6c49c);display:flex;gap:8px;padding:8px;overflow-x:auto;}
  .slot{flex:0 0 150px;border:2px dashed #a98f5f;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8a7245;font-weight:700;font-size:13px;}
  .slot.act{background:#fff8e6;border-style:solid;color:#3a2610;flex-direction:column;gap:2px;}
  .slot.act .t{font-size:11px;color:#b06a2a;font-weight:800;} .slot.act .bar{width:88%;height:6px;background:#d8c49a;border-radius:3px;overflow:hidden;margin-top:3px;}
  .slot.act .bar>i{display:block;height:100%;background:#3a8a3a;}
  #scrim{position:absolute;inset:0;background:#000a;display:none;z-index:40;}
  #modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,380px);max-height:80%;overflow:auto;
    background:linear-gradient(180deg,#f6ecd0,#e4d0a6);color:#3a2610;border-radius:12px;padding:16px;display:none;z-index:41;
    box-shadow:0 12px 40px #000a;border:3px solid #b9822b;outline:2px solid #e7c87e;outline-offset:-7px;}
  #modal h3{margin:0 0 10px;font-family:Georgia,'Times New Roman',serif;text-align:center;
    border-bottom:2px solid #b9822b;padding-bottom:7px;color:#4a2f10;text-shadow:0 1px 0 #fff8;} .opt{display:flex;align-items:center;gap:10px;padding:11px;background:#fff8e6;
    border:1px solid #cdb488;border-radius:10px;margin-bottom:8px;font-weight:700;}
  .opt .em{font-size:22px;width:26px;text-align:center;} .opt .meta{margin-left:auto;font-size:12px;color:#8a6a2a;text-align:right;}
  .opt.dis{opacity:.5;} #mClose{width:100%;padding:11px;border:none;border-radius:10px;background:#3a2c18;color:var(--gold);font-weight:800;margin-top:4px;}
  #toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;
    border-radius:20px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:82%;text-align:center;}
</style>

<script>
/* ===================== STONEHOLD — Town v2 (canvas iso engine) ===================== */
/* ---- debug console: captures errors + actions, exports to .txt ---- */
const DBG={buf:[],max:800,
  log(type,msg){this.buf.push({t:new Date().toISOString().slice(11,23),type,msg:String(msg)});if(this.buf.length>this.max)this.buf.shift();},
  download(){try{
    const lines=this.buf.map(e=>`[${e.t}] ${e.type}: ${e.msg}`).join('\n');
    const head='STONEHOLD DEBUG LOG\n'+new Date().toString()+'\nUA: '+navigator.userAgent+
      '\nviewport: '+innerWidth+'x'+innerHeight+' dpr='+(devicePixelRatio||1)+
      '\nview: '+(typeof view!=='undefined'?view:'?')+'  render: code-art (no image files)'+
      '\n\n=== RENDER DIAGNOSTICS ===\n'+
      'zoom: '+(typeof zoom!=='undefined'?zoom.toFixed(2):'?')+
      '\nwallTier: '+(typeof S!=='undefined'?S.wall:'?')+'   thLevel: '+(typeof S!=='undefined'?S.thLevel:'?')+
      '\ncityBuildings: '+(typeof S!=='undefined'?Object.keys(S.city||{}).length:'?')+'   resourceNodes: '+(typeof S!=='undefined'?Object.keys(S.nodes||{}).length:'?')+
      '\nqueue: '+(typeof S!=='undefined'?(S.queue||[]).length:'?')+'   hotspots(lastFrame): '+(typeof hots!=='undefined'?hots.length:'?')+
      '\nmapDecor: '+(typeof mapdecor!=='undefined'&&mapdecor?mapdecor.length:'0')+'   npcs: '+(typeof npcs!=='undefined'&&npcs?npcs.length:'0')+
      '\ncanvas: '+(typeof VW!=='undefined'?VW+'x'+VH:'?')+' @dpr'+(typeof DPR!=='undefined'?DPR:'?')+
      '\n\n=== STATE ===\n'+JSON.stringify(typeof S!=='undefined'?S:{},null,1)+'\n\n=== EVENT LOG ('+this.buf.length+') ===\n'+lines;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([head],{type:'text/plain'}));
    a.download='stonehold-debug-'+Date.now()+'.txt';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
    if(typeof toast==='function')toast('Debug log downloaded 🐛');
  }catch(err){alert('Debug export failed: '+err);}}
};
addEventListener('error',e=>DBG.log('JS-ERROR',(e.message||'')+' @'+((e.filename||'').split('/').pop())+':'+(e.lineno||'')+':'+(e.colno||'')));
addEventListener('unhandledrejection',e=>DBG.log('PROMISE-REJECT',(e.reason&&e.reason.message)||e.reason));
(function(){const _e=console.error;console.error=function(){DBG.log('console.error',[].join.call(arguments,' '));_e.apply(console,arguments);};})();

/* ================= CODE-DRAWN ART (no image files) ================= */
/* Evony Age-1/2 look: warm soft-lit palette, gabled houses (not tents),   */
/* warm outlines (never pure black), terrain backdrops, level badges.      */
let ATLAS_OK=true;                                   // guards throughout expect this
var _renderFails=0, _renderErrLogged=false, lastSave=Date.now();   // loop-state vars (declared before loop starts)
requestAnimationFrame(()=>loop());                    // kick the render loop (atlas used to)

const OUT='rgba(60,44,30,0.34)';                      // warm dark outline (never black)
function shade(c,f){return 'rgb('+(c[0]*f|0)+','+(c[1]*f|0)+','+(c[2]*f|0)+')';}
function poly(pts,fill,stroke,lw){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke!==null){ctx.strokeStyle=stroke||OUT;ctx.lineWidth=lw||1;ctx.stroke();}}
function softShadow(cx,cy,fw,fh){ctx.save();ctx.globalAlpha=.16;ctx.beginPath();
  ctx.ellipse(cx,cy,fw*1.02,fh*1.02,0,0,7);ctx.fillStyle='#000';ctx.fill();ctx.restore();}

/* ---- texture helpers (the sculpt toolkit) ---- */
/* GRAIN: seeded (no shimmer) speck pattern, anchored per-face so it pans with buildings.
   Kills the flat solid-color vector look — the #1 Evony de-blocker. */
const GRAIN=(function(){const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');let s=1234567;const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  const img=g.createImageData(64,64);
  for(let i=0;i<img.data.length;i+=4){const v=rnd();
    const l=v<0.5?0:255;img.data[i]=img.data[i+1]=img.data[i+2]=l;
    img.data[i+3]=(rnd()*26)|0;}                     // specks ≤10% alpha, light+dark mix
  g.putImageData(img,0,0);return c;})();
let GRAIN_PAT=null;
function grain(pts,a){                               // clip to face, stipple, anchored to face bbox
  if(!GRAIN_PAT){try{GRAIN_PAT=ctx.createPattern(GRAIN,'repeat');}catch(e){return;}}
  if(!GRAIN_PAT)return;
  let mx=1e9,my=1e9,Mx=-1e9,My=-1e9;
  for(const p of pts){if(p[0]<mx)mx=p[0];if(p[1]<my)my=p[1];if(p[0]>Mx)Mx=p[0];if(p[1]>My)My=p[1];}
  if((Mx-mx)*(My-my)<60)return;                      // tiny faces: texture is invisible, skip the work
  ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.clip();
  ctx.globalAlpha=(a===undefined?0.55:a);
  ctx.translate(Math.round(mx),Math.round(my));      // pattern rides with the face, not the screen
  ctx.fillStyle=GRAIN_PAT;ctx.fillRect(-1,-1,(Mx-mx)+3,(My-my)+3);
  ctx.restore();}
function gfill(pts,c,f1,f2,stroke){                 // vertical gradient fill of a face
  let miny=1e9,maxy=-1e9;for(const p of pts){if(p[1]<miny)miny=p[1];if(p[1]>maxy)maxy=p[1];}
  if(maxy-miny<0.5)maxy=miny+1;const g=ctx.createLinearGradient(0,miny,0,maxy);
  g.addColorStop(0,shade(c,f1));g.addColorStop(1,shade(c,f2));
  poly(pts,g,stroke===undefined?OUT:stroke,1);
  grain(pts);}                                       // weathering on every face (walls/roofs/soil)
function facePt(f,u,v){                              // f=[bA,bB,tB,tA]; u along base, v up
  const bx=f[0][0]+(f[1][0]-f[0][0])*u, by=f[0][1]+(f[1][1]-f[0][1])*u;
  const tx=f[3][0]+(f[2][0]-f[3][0])*u, ty=f[3][1]+(f[2][1]-f[3][1])*u;
  return [bx+(tx-bx)*v, by+(ty-by)*v];}
function courses(f,n,col,lw){ctx.strokeStyle=col;ctx.lineWidth=lw||1;   // lines ∥ base (stone/timber)
  for(let k=1;k<n;k++){const v=k/n;const a=facePt(f,0,v),b=facePt(f,1,v);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}}
function win(f,u,v,du,dv,col){const p=[facePt(f,u-du,v-dv),facePt(f,u+du,v-dv),facePt(f,u+du,v+dv),facePt(f,u-du,v+dv)];
  poly(p,col,'rgba(40,30,18,0.45)',1);}
function shingles(eaveA,eaveB,ridgeA,ridgeB,col){ctx.strokeStyle=col;ctx.lineWidth=1; // roof courses
  for(let k=1;k<=3;k++){const t=k/4;
    const a=[eaveA[0]+(ridgeA[0]-eaveA[0])*t,eaveA[1]+(ridgeA[1]-eaveA[1])*t];
    const b=[eaveB[0]+(ridgeB[0]-eaveB[0])*t,eaveB[1]+(ridgeB[1]-eaveB[1])*t];
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}}
function rim(a,b,col){ctx.strokeStyle=col;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();} // warm sun edge

/* ---- gabled house: a real house shape (ridge parallel to a wall) ---- */
function house(cx,cy,fw,fh,H,R,wall,roof,opt){opt=opt||{};
  const N=[cx,cy-fh],E=[cx+fw,cy],S=[cx,cy+fh],W=[cx-fw,cy];         // ground diamond
  const tN=[N[0],N[1]-H],tE=[E[0],E[1]-H],tS=[S[0],S[1]-H],tW=[W[0],W[1]-H];
  const fSW=[W,S,tS,tW], fSE=[S,E,tE,tS];
  gfill(fSW,wall,0.94,0.72);                                         // SW wall (lighter), top→bottom gradient
  gfill(fSE,wall,0.76,0.56);                                         // SE wall (darker)
  // ambient occlusion: the roof throws shade onto the top of the walls (kills the box read)
  const ao=(f)=>{const a=facePt(f,0,0),b=facePt(f,1,0),a2=facePt(f,0,0.20),b2=facePt(f,1,0.20);
    const g=ctx.createLinearGradient(0,Math.min(a[1],b[1]),0,Math.max(a2[1],b2[1]));
    g.addColorStop(0,'rgba(30,20,10,0.28)');g.addColorStop(1,'rgba(30,20,10,0)');
    poly([a,b,b2,a2],g,null);};
  ao(fSW);ao(fSE);
  // ground-contact AO: darker footing line where wall meets earth
  ctx.strokeStyle='rgba(30,22,12,0.30)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(W[0],W[1]-1);ctx.lineTo(S[0],S[1]-1);ctx.lineTo(E[0],E[1]-1);ctx.stroke();
  if(opt.timber){courses(fSW,1,shade(wall,0.5));                     // Tudor beams
    ctx.strokeStyle=shade(wall,0.5);ctx.lineWidth=1.4;
    for(const u of [0.28,0.72]){const a=facePt(fSW,u,0),b=facePt(fSW,u,0.9);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}}
  else courses(fSW,3,'rgba(60,44,30,0.10)');                        // faint plaster lines
  // windows (warm-lit) + a door on the SW front
  const hsh=CUR_SEED%9973;                                           // per-BUILDING life, stable while panning
  const lit='rgba(240,206,120,0.9)', dark='rgba(48,38,26,0.9)';
  const glow=(f,u,v)=>{if(fw<9)return;const q=facePt(f,u,v);ctx.save();ctx.globalAlpha=0.20;

  ctx.strokeStyle='rgba(255,250,238,0.35)';ctx.lineWidth=1.4;        // sunlit corner arris — pops the silhouette

function field(cx,cy,fw,fh,soil,crop,marker){

function openTransport(){
  const others=Object.keys(S.cities||{}).filter(id=>id!==S.activeCity);
  if(!others.length){toast('You need a second castle first');return;}
  const items=others.map(id=>{const c=S.cities[id];
    return {em:'🐎',label:'Ship to '+(c.name||id),meta:'('+c.x+','+c.y+')',fn:()=>{closeModal();transportTo(id);}};});
  modal('🐎 Ship Resources',items);}
function transportTo(destId){
  const dest=S.cities[destId];if(!dest)return;
  const rk=prompt('Which resource? (food/wood/stone/iron/gold)','gold');
  if(!rk||!(rk in (S.res||{}))){toast('Pick food, wood, stone, iron or gold');return;}
  const have=Math.round(S.res[rk]||0);
  const inp=prompt('Ship how much '+rk+'? (you have '+fmt(have)+')',String(Math.floor(have/2)));
  if(!inp)return;const amt=Math.max(1,Math.min(have,Math.floor(parseInt(inp)||0)));if(!amt)return;
  // duration: distance × cargo. Millions of gold = a long, slow caravan.
  const homeC=activeCityObj();const dist=Math.hypot((dest.x-homeC.x),(dest.y-homeC.y));
  const dur=Math.max(60,Math.round((dist*14/300)*60 + amt/5000))*1000;
  S.res[rk]-=amt;
  if(!S.transports)S.transports=[];
  S.transports.push({id:'x'+Date.now(),to:destId,rk,amt,arrive:Date.now()+dur});
  save();renderRes();
  toast('🐎 Caravan away: '+fmt(amt)+' '+rk+' → '+(dest.name||destId)+' · '+fmtTime(dur/1000));
  addLog('system','Caravan: '+fmt(amt)+' '+rk+' to '+(dest.name||destId)+' ('+fmtTime(dur/1000)+')');}
function tickTransports(){if(!S.transports||!S.transports.length)return;const now=Date.now();let changed=false;
  for(const t of S.transports){if(t.done)continue;if(now>=t.arrive){t.done=true;changed=true;
    const dc=S.cities&&S.cities[t.to];if(dc){dc.res[t.rk]=(dc.res[t.rk]||0)+t.amt;
      // if the destination is the active city, reflect immediately
      if(t.to===S.activeCity)S.res[t.rk]=dc.res[t.rk];
      addLog('done','Caravan arrived at '+(dc.name||t.to)+': +'+fmt(t.amt)+' '+t.rk);}}}
  if(changed){S.transports=S.transports.filter(t=>!t.done);save();renderRes();}}

async function srv(action,payload){
  if(!HAS_AUTH)return {ok:false,offline:true};
  const auth=S5_SESSION?{s5SessionId:S5_SESSION}:{s5Code:S5_CODE};
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(API_BASE+'/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,...auth,...payload}),signal:ctl.signal});
    clearTimeout(to);
    return await r.json();}catch(e){return {ok:false,error:e&&e.name==='AbortError'?'timeout':'net'};}}

    if(r.stoneholdState&&r.stoneholdState.res){S=Object.assign(fresh(),r.stoneholdState);migrateCities(S);save();

      DBG.log('sync','no server state -> fresh blank start (cleared local)'); toast('🏰 Fresh realm — claim your land'); }
    if(r.giftTier){for(const k in S.res)S.res[k]+=100000;S.spinsUsed=0;

      toast('👑 '+r.giftTier+' gift pack! +100k each, bonus spins, 24h production');addLog('done',r.giftTier+' member gift pack claimed');}

  }else{ const why=(r&&r.error)||'unknown';
    setSrvBadge(why==='timeout'?'OFFLINE · server slow':why==='net'?'OFFLINE · no server':'OFFLINE · '+why);

function tierMult(){const t=(localStorage.getItem('hm_tier')||new URLSearchParams(location.search).get('tier')||'').toUpperCase();
  document.getElementById('tier').textContent='TIER: '+(t||'FREE');
  // S5 tiers scale perks (fairness/convenience only): +1 spin per tier, richer/cheaper shop, small production edge
  if(t==='DEV'||t==='S5'||t==='S5_AGENT') return {name:'S5',mult:5,queues:4,spins:4,shop:3,monthly:50};
  if(t==='SENIOR_AGENT'||t==='SENIOR') return {name:'SENIOR',mult:2,queues:3,spins:3,shop:2,monthly:25};
  if(t==='AGENT') return {name:'AGENT',mult:1.5,queues:2,spins:2,shop:1.5,monthly:10};
  return {name:'FREE',mult:1,queues:1,spins:1,shop:1,monthly:0};}
function queueMax(){return tierMult().queues;}

/* ===================== ECONOMY ===================== */
function rates(){const m=tierMult().mult;const r={food:0,wood:0,stone:0,iron:0,gold:0};
  r.food+=200;r.wood+=160;
  for(const k in S.nodes){const nd=S.nodes[k],d=NODE[nd.type];if(d)r[d.gives]+=d.rate*(nd.lv||1);}
  let pop=0;
  for(const k in S.city){const b=S.city[k];if(b.type==='market')r.gold+=60*(b.lv||1);
    const cd=CITY[b.type];if(cd&&cd.pop)pop+=cd.pop*(b.lv||1);}
  r.gold+=Math.round(pop*(S.tax||0)/100*0.6);                          // the taxman
  const pm=prodBuffMult()*(1+techBonus('prod')); if(pm!==1)for(const k in r)r[k]=Math.round(r[k]*pm); // buffs + Agriculture research
  if((S.tax||0)>50){const pen=Math.max(0.3,1-((S.tax-50)/100)*1.4);    // grumbling peasants work less
    r.food=Math.round(r.food*pen);r.wood=Math.round(r.wood*pen);
    r.stone=Math.round(r.stone*pen);r.iron=Math.round(r.iron*pen);}
  for(const q in r)r[q]*=m; return r;}
function cap(){let c=100000;for(const k in S.city){const b=S.city[k];if(b.type==='warehouse')c+=50000*(b.lv||1);}return c;}
function applyElapsed(){const now=Date.now();const h=(now-S.t)/3.6e6;if(h>0){const r=rates();
  for(const k in r)S.res[k]=Math.min(cap(),Math.round((S.res[k]||0)+r[k]*h));}S.t=now;}
function afford(c){for(const k in c)if((S.res[k]||0)<c[k])return false;return true;}
function pay(c){if(!afford(c))return false;for(const k in c)S.res[k]-=c[k];return true;}
function costStr(c){return Object.entries(c).map(([k,v])=>v+' '+k).join(' · ');}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;const h=Math.floor(m/60);
  if(h)return h+'h '+(m%60)+'m';if(m)return m+'m '+ss+'s';return ss+'s';}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+n;}

function enqueue(job){ // job:{kind,slot,type,dur,label}
  if(S.queue.length>=queueMax()){toast('Build queue full'+(queueMax()<2?' — members get a 2nd slot':''));return false;}
  job.end=Date.now()+job.dur*1000; S.queue.push(job); save(); renderDock(); toast(job.label+' started · '+fmtTime(job.dur)); return true;}
function processQueue(){let ch=false;const now=Date.now();
  S.queue=S.queue.filter(j=>{ if(now>=j.end){ complete(j); ch=true; return false;} return true;});
  if(ch){save();renderDock();renderRes();}}
function complete(j){
  if(j.kind==='city') S.city[j.slot]={type:j.type,lv:1};
  else if(j.kind==='node') S.nodes[j.slot]={type:j.type,lv:1};
  else if(j.kind==='up-city'){const b=S.city[j.slot];if(b)b.lv=Math.min(MAXLV,(b.lv||1)+1);}
  else if(j.kind==='up-node'){const b=S.nodes[j.slot];if(b)b.lv=Math.min(MAXLV,(b.lv||1)+1);}
  else if(j.kind==='wall') S.wall=Math.min(4,S.wall+1);
  else if(j.kind&&j.kind.slice(0,5)==='tech-'){const tk=j.kind.slice(5);if(!S.research)S.research={};S.research[tk]=(S.research[tk]||0)+1;addLog('done',(TECH[tk]?TECH[tk].name:tk)+' Lv '+S.research[tk]+' researched');}
  else if(j.kind==='th')  S.thLevel=Math.min(3,S.thLevel+1);
  else if(j.kind==='gh'){S.thLevel=1;toast('🏛️ The Grand Hall stands! Your stronghold is founded.');}
  else if(j.kind==='train') S.army.sword+=j.n;
  else if(j.kind==='train-scout') S.scouts+=j.n;
  else if(j.kind&&j.kind.slice(0,6)==='train-'&&UNITS[j.kind.slice(6)]) S.army[j.kind.slice(6)]+=j.n;
  DBG.log('done',j.kind+' '+(j.type||'')+' @'+(j.slot||''));
  toast(j.label+' complete!');addLog('done',j.label+' complete');
}

let view='town';
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2),VW=0,VH=0;
function fit(){VW=cv.clientWidth;VH=cv.clientHeight;cv.width=VW*DPR;cv.height=VH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true;}

/* iso grid config: 5x5, center = town hall, 24 build cells (16 unlocked, 8 corners locked) */
const N=5, CENTER=2;
function isoTW(){return Math.max(58,Math.min(112, VW*0.86*2/(N+1)))*zoom;}
function cellScreen(c,r){const TW=isoTW(),TH=TW/2;const ox=VW/2+cams.town.x, oy=VH*0.34+cams.town.y;
  return{x:ox+(c-r)*TW/2, y:oy+(c+r)*TH/2, TW, TH};}
function cornerLocked(c,r){return (c===0||c===N-1)&&(r===0||r===N-1);} // 4 corners... add 4 edge-mids for 8

function drawDiamond(cx,cy,TW,TH,fill,stroke,lw){ctx.save();ctx.beginPath();
  ctx.moveTo(cx,cy-TH/2);ctx.lineTo(cx+TW/2,cy);ctx.lineTo(cx,cy+TH/2);ctx.lineTo(cx-TW/2,cy);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.stroke();}ctx.restore();}

/* ---- Evony-style town walls (tier-scaled, drawn in two depth passes) ---- */
function wallSeg(A,B,h,stone,tier){
  const At=[A[0],A[1]-h],Bt=[B[0],B[1]-h];
  gfill([A,B,Bt,At],stone,0.96,0.72);
  courses([A,B,Bt,At],3,'rgba(50,38,26,0.16)');
  // parapet walk: a lighter capping strip along the top (walls have a top, not just an edge)
  const cap=h*0.14;
  poly([At,Bt,[Bt[0],Bt[1]+cap],[At[0],At[1]+cap]],shade(stone,1.10),null);
  ctx.strokeStyle=shade(stone,1.22);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(At[0],At[1]);ctx.lineTo(Bt[0],Bt[1]);ctx.stroke();
  // battered footing: heavy shadow where the wall meets the ground
  ctx.strokeStyle='rgba(28,20,12,0.32)';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(A[0],A[1]-1);ctx.lineTo(B[0],B[1]-1);ctx.stroke();
  // buttress rhythm: shallow vertical shadow ribs break the long flat ribbon
  const len=Math.hypot(B[0]-A[0],B[1]-A[1]);const rib=Math.max(2,Math.round(len/60));
  ctx.strokeStyle='rgba(40,30,18,0.14)';ctx.lineWidth=3;
  for(let i=1;i<rib;i++){const t=i/rib;
    ctx.beginPath();ctx.moveTo(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t-1);
    ctx.lineTo(At[0]+(Bt[0]-At[0])*t,At[1]+(Bt[1]-At[1])*t+cap);ctx.stroke();}
  if(tier>=2){ctx.fillStyle=shade(stone,1.03);const n=Math.max(4,Math.round(len/15));
    for(let i=0;i<=n;i+=2){const t=i/n;const p=[At[0]+(Bt[0]-At[0])*t,At[1]+(Bt[1]-At[1])*t];ctx.fillRect(p[0]-2.5,p[1]-7,5,7);}}}
function townWalls(when){const tier=S.wall|0;
  if(tier===0){                                                        // Stage 0: bare stone slab boundary
    const h0=9*zoom, sl=[186,182,170];
    const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
          fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
    const slab=(A,B)=>{const At=[A.x,A.y-h0],Bt=[B.x,B.y-h0];
      gfill([[A.x,A.y],[B.x,B.y],Bt,At],sl,1.0,0.80);
      poly([At,Bt,[Bt[0],Bt[1]+h0*0.22],[At[0],At[1]+h0*0.22]],shade(sl,1.12),null);
      ctx.strokeStyle='rgba(28,20,12,0.28)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(A.x,A.y-1);ctx.lineTo(B.x,B.y-1);ctx.stroke();};
    if(when==='back'){slab(lf,bk);slab(bk,rt);}else{slab(lf,fr);slab(fr,rt);}
    return;}
  const h=(16+tier*7)*zoom;
  const stone= tier<=1? [150,120,86] : [170,166,154];
  const tRoof= tier<=1? [110,80,50] : [120,90,64];
  const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
        fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
  const ts=isoTW()*0.5;
  const twr=(P,flag)=>tower(P.x,P.y,ts*0.42,ts*0.21,h+ts*0.18,ts*0.5,stone,tRoof,{crenel:tier>=2,flag:flag});
  if(when==='back'){
    wallSeg([lf.x,lf.y],[bk.x,bk.y],h,stone,tier);
    wallSeg([bk.x,bk.y],[rt.x,rt.y],h,stone,tier);
    twr(bk,'#c0413a'); twr(rt);
  }else{
    wallSeg([lf.x,lf.y],[fr.x,fr.y],h,stone,tier);
    wallSeg([fr.x,fr.y],[rt.x,rt.y],h,stone,tier);
    twr(lf); twr(fr,'#f0c23a');
    ctx.fillStyle='#1c140c';ctx.beginPath();ctx.ellipse(fr.x,fr.y-h*0.2,ts*0.13,ts*0.19,0,0,7);ctx.fill(); // gate arch
  }}

/* Your Stonehold as a walled compound — same wall tier + TH level as the town view,
   so FIELDS and MAP show the *actual* castle progression, not a generic keep. */
function drawStonehold(cx,cy,w){
  if(!S.thLevel){ softShadow(cx,cy+w*0.13,w*0.5,w*0.25); foundation(cx,cy-w*0.08,w*0.9); return; }
  const tier=S.wall|0, fw=w*0.52, fh=fw*0.5, h=w*(0.05+0.035*Math.max(1,tier));
  const pN=[cx,cy-fh],pE=[cx+fw,cy],pS=[cx,cy+fh],pW=[cx-fw,cy];
  const up=(p)=>[p[0],p[1]-h];
  const stone= tier===0? [186,182,170] : tier<=1? [150,120,86] : [170,166,154];
  const tRoof= tier<=1? [110,80,50] : [120,90,64];
  softShadow(cx,cy+fh*0.15,fw*1.05,fh*1.05);
  gfill([pN,pE,pS,pW],[187,178,158],1.0,0.88,null);                   // cobble courtyard

function renderTown(){

  {const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
        fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
   const pav=[[bk.x,bk.y],[rt.x,rt.y],[fr.x,fr.y],[lf.x,lf.y]];
   gfill(pav,[187,178,158],1.0,0.9,null);           // warm gray-tan paving + grain via gfill
   grain(pav,0.6);                                   // extra grime so cobble reads dirtier than grass
   ctx.save();ctx.beginPath();ctx.moveTo(pav[0][0],pav[0][1]);
   for(let i=1;i<4;i++)ctx.lineTo(pav[i][0],pav[i][1]);ctx.closePath();ctx.clip();
   ctx.globalAlpha=0.10;ctx.strokeStyle='#4a3c28';ctx.lineWidth=1;   // faint cobble seams (iso lattice)
   const st=isoTW()*0.25, cxm=(bk.x+fr.x)/2, W2=Math.abs(rt.x-lf.x);
   for(let k=-Math.ceil(W2/st);k<=Math.ceil(W2/st);k++){const off=k*st;
     ctx.beginPath();ctx.moveTo(cxm+off-W2,bk.y-W2*0.5);ctx.lineTo(cxm+off+W2,bk.y+W2*0.5);ctx.stroke();  // NE-parallel
     ctx.beginPath();ctx.moveTo(cxm+off+W2,bk.y-W2*0.5);ctx.lineTo(cxm+off-W2,bk.y+W2*0.5);ctx.stroke();} // NW-parallel
   ctx.restore();}
  townWalls('back');
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(cornerLocked(c,r))continue;
    cells.push({c,r,key:slotKey(c,r),depth:c+r});
  }
  cells.sort((a,b)=>a.depth-b.depth);

  }

      if(sel&&sel.view==='town'&&sel.key==='TH') drawHi(p.x,p.y,TWv*1.1,THv*1.1);

        hot(p.x,p.y,TWv*0.4,()=>{sel={view:'town',key:'TH'};DBG.log('tap','townhall');upgradeTH();}); }

    if(b){ draw._lv=b.lv||1; draw._seed=hashKey(cell.key); draw(CITY[b.type].id, p.x, p.y+THv*0.3, TWv*0.9);

function seedCamps(){camps=[];if(!rivers)seedRivers();const rnd=mul(4242);const G=6,SP=340;

/* MAP */
const cams={town:{x:0,y:0},outside:{x:0,y:0},map:{x:0,y:0}};
function CAM(){return cams[view]||cams.town;}
let zoom=1, sel=null, npcs=null, PLAYERS=[], playersFetched=0;
function seedNPCs(){npcs=[];if(!rivers)seedRivers();const rnd=mul(1337);const G=6,SP=340;
  for(let gy=-G;gy<=G;gy++)for(let gx=-G;gx<=G;gx++){
    if(gx===0&&gy===0)continue; if(rnd()<0.72)continue;
    const jx=(rnd()-0.5)*120, jy=(rnd()-0.5)*120;
    const tier=1+Math.floor(rnd()*4);
    const px=gx*SP+jx, py=gy*SP+jy; if(nearRiver(px,py,60))continue;
    npcs.push({id:'n'+npcs.length,x:px,y:py,tier,kind:rnd()<0.5?'Barbarian':'Derelict',lvl:1+Math.floor(rnd()*10)});}}
let mapdecor=null, rivers=null;
function seedRivers(){rivers=[];const rnd=mul(777);
  for(let r=0;r<4;r++){const pts=[];const a=rnd()*Math.PI*2;
    let x=(rnd()-0.5)*9000, y=(rnd()-0.5)*9000;
    const dx=Math.cos(a), dy=Math.sin(a), ph=rnd()*7, amp=60+rnd()*70;
    for(let i=-90;i<90;i++){const t=i*96;
      pts.push([x+dx*t-dy*Math.sin(t*0.012+ph)*amp, y+dy*t+dx*Math.sin(t*0.012+ph)*amp]);}
    rivers.push(pts);}}
function nearRiver(x,y,d){if(!rivers)seedRivers();const d2=d*d;
  for(const pts of rivers)for(const q of pts){const ddx=q[0]-x,ddy=q[1]-y;if(ddx*ddx+ddy*ddy<d2)return true;}
  return false;}
function seedDecor(){mapdecor=[];seedRivers();const rnd=mul(90210);const G=7,SP=340;
  for(let gy=-G;gy<=G;gy++)for(let gx=-G;gx<=G;gx++){
    const n=rnd()<0.15?0:(1+(rnd()<0.55?1:0));                       // 0–2 features per cell → Evony-dense
    for(let i=0;i<n;i++){const jx=(rnd()-0.5)*300, jy=(rnd()-0.5)*300;
      const t=rnd();
      const kind=t<0.30?'grove':t<0.48?'pine':t<0.60?'pond':t<0.74?'rocks':t<0.84?'rock':'tuft';
      const px=gx*SP+jx+170, py=gy*SP+jy+170;
      if(kind!=='tuft'&&nearRiver(px,py,36))continue;                 // nothing solid spawns in the water
      mapdecor.push({x:px,y:py,kind,s:0.8+rnd()*0.6,v:Math.floor(rnd()*5)});}}}
function drawRivers(cam){if(!rivers)return;
  for(let R=0;R<rivers.length;R++){const pts=rivers[R];
    let vis=false;const P=[];
    for(const q of pts){const px=VW/2-cam.x+q[0]*zoom, py=VH/2-cam.y+q[1]*zoom;
      P.push([px,py]); if(px>-80&&px<VW+80&&py>-80&&py<VH+80)vis=true;}
    if(!vis)continue;
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    // draw in short strokes: width breathes, and some stretches sink underground (Evony map look)
    for(let i=1;i<P.length;i++){
      const ph=i*0.55+R*3.1;
      if(Math.sin(i*0.23+R*7)>0.93)continue;                          // the river vanishes into marsh here
      const w=(7+3*Math.sin(ph))*zoom;
      ctx.beginPath();ctx.moveTo(P[i-1][0],P[i-1][1]);ctx.lineTo(P[i][0],P[i][1]);
      ctx.strokeStyle='#3f5f47';ctx.lineWidth=w+3.5*zoom;ctx.globalAlpha=0.5;ctx.stroke();  // muddy banks
      ctx.globalAlpha=0.95;
      ctx.strokeStyle='#517d9e';ctx.lineWidth=w;ctx.stroke();
      ctx.strokeStyle='#6e9fc0';ctx.lineWidth=w*0.5;ctx.stroke();
      if(Math.sin(ph*1.7)>0.6){ctx.strokeStyle='rgba(210,230,240,0.5)';ctx.lineWidth=1.2;ctx.stroke();} // glints
    }
    ctx.restore();}}
function grove(x,y,s,v){const off=[[0,0],[15,7],[-13,9],[7,-9],[-7,-15]];
  const n=3+(v%3); const ord=off.slice(0,n).sort((a,b)=>a[1]-b[1]);
  for(const o of ord)pine(x+o[0]*s,y+o[1]*s,s*0.9);}
function rocks(x,y,s){rock(x,y,s);rock(x+16*s,y+6*s,s*0.55);rock(x-14*s,y+7*s,s*0.4);}
function tuft(x,y,s){ctx.strokeStyle='#5d7a35';ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*4*s,y);ctx.lineTo(x+i*5.5*s,y-6*s);ctx.stroke();}}
function pine(x,y,s){ctx.fillStyle='#6b4a2a';ctx.fillRect(x-2*s,y-6*s,4*s,7*s);
  for(let i=0;i<3;i++){const w=14*s-i*4*s,h=10*s;poly([[x,y-6*s-i*7*s-h],[x-w/2,y-6*s-i*7*s],[x+w/2,y-6*s-i*7*s]],i%2?'#3f6b2e':'#4c7d38','rgba(30,44,20,0.4)',1);}}
function pond(x,y,s){ctx.save();
  ctx.beginPath();ctx.ellipse(x,y+1.5,28*s,15*s,0,0,7);ctx.fillStyle='rgba(90,80,52,0.5)';ctx.fill(); // muddy bank
  ctx.beginPath();ctx.ellipse(x,y,26*s,14*s,0,0,7);ctx.fillStyle='#4f7fa8';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#6a9ec4';ctx.stroke();ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(x-6*s,y-3*s,10*s,4*s,0,0,7);ctx.fillStyle='#8fc0dd';ctx.fill();ctx.restore();}
function rock(x,y,s){poly([[x-14*s,y],[x-6*s,y-12*s],[x+4*s,y-14*s],[x+13*s,y-4*s],[x+8*s,y+4*s],[x-8*s,y+4*s]],'#9a968c','rgba(40,36,28,0.4)',1);
  poly([[x-6*s,y-12*s],[x+4*s,y-14*s],[x+13*s,y-4*s],[x,y-2*s]],'#b4b0a4',null);}
function renderMap(){hots=[];const cam=CAM();
  mapGround();
  if(!mapdecor)seedDecor();
  drawRivers(cam);
  for(const d of mapdecor){const dx=VW/2-cam.x+d.x*zoom, dy=VH/2-cam.y+d.y*zoom;
    if(dx<-70||dx>VW+70||dy<-70||dy>VH+70)continue;const s=d.s*zoom;
    if(d.kind==='pine')pine(dx,dy,s);
    else if(d.kind==='grove')grove(dx,dy,s,d.v);
    else if(d.kind==='pond')pond(dx,dy,s);
    else if(d.kind==='rocks')rocks(dx,dy,s);
    else if(d.kind==='rock')rock(dx,dy,s);

  if(!camps)seedCamps();
  for(const c of camps){const cxp=VW/2-cam.x+c.x*zoom, cyp=VH/2-cam.y+c.y*zoom;
    if(cxp<-60||cxp>VW+60||cyp<-60||cyp>VH+60)continue;
    drawCamp(cxp,cyp,c);
    if(campLeft(c)>0){ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;
      const lab=c.res[0].toUpperCase()+c.res.slice(1)+' camp';ctx.strokeText(lab,cxp,cyp+22);ctx.fillText(lab,cxp,cyp+22);
      hot(cxp,cyp,34,()=>campMenu(c));}}
  if(!npcs)seedNPCs();
  // player castles: convert absolute world coords to home-relative (home at 0,0)
  const HX=(S.home&&S.home.x)||512, HY=(S.home&&S.home.y)||512;
  const plist=(PLAYERS||[]).map(p=>({player:true,hid:p.hid,name:p.name,prot:p.protected,
    x:(p.x-HX)*14, y:(p.y-HY)*14, lvl:5}));
  const all=[{x:0,y:0,me:true,tier:S.wall}].concat(npcs).concat(plist);
  all.sort((a,b)=>(a.y)-(b.y));
  for(const n of all){const nx=VW/2-cam.x+n.x*zoom, ny=VH/2-cam.y+n.y*zoom;
    if(nx<-120||nx>VW+120||ny<-180||ny>VH+120)continue;
    const dead=!n.me&&!n.player&&!!S.razed[n.id];
    if(n.me) drawStonehold(nx,ny,150*zoom);
    else if(n.player) castle(nx,ny,110*zoom,5,false);
    else castle(nx,ny,(80+n.lvl*10)*zoom,n.lvl,dead);
    ctx.fillStyle=n.player?'#ffd070':'#fff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;
    const lab=n.me?'Your Stonehold':n.player?('⚔ '+n.name+(n.prot?' 🛡️':'')):(dead?n.kind+' ruins':n.kind+' '+n.lvl);
    ctx.strokeText(lab,nx,ny+6);ctx.fillText(lab,nx,ny+6);
    if(n.player)hot(nx,ny-24,48,()=>attackPlayer(n));
    else if(!n.me&&!dead)hot(nx,ny-26,42,()=>scout(n));
    if(n.me)hot(nx,ny-20,52,()=>{setView('town');toast('🏰 Home');DBG.log('nav','map->town via castle');});}
  drawMarches(cam);
  worldBorder(cam);
  coordBox(cam);
  setHint('Drag to explore · tap the ◎ X·Y chip to navigate');
  if(ONLINE && Date.now()-playersFetched>30000){playersFetched=Date.now();
    srv('stonehold_nearby',{}).then(r=>{if(r&&r.ok&&Array.isArray(r.players)){PLAYERS=r.players;}});}
}
function coordBox(cam){const HX=(S.home&&S.home.x)||512,HY=(S.home&&S.home.y)||512;const cl=(v,h)=>Math.max(0,Math.min(999,h+Math.round(v/14)));
  const X=cl(cam.x,HX),Y=cl(cam.y,HY);const w=132,h=30,x=VW-w-10,y=92;

  ctx.fillStyle='#3a2c18';ctx.font='800 14px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('◎ X:'+X+'  Y:'+Y,x+10,y+h/2+1);ctx.restore();
  hot(x+w/2,y+h/2,44,mapNavMenu);}                                    // tap the chip → navigate
function mapNavMenu(){const c=cams.map;
  modal('🧭 Navigate the Realm',[

      const X=Math.max(0,Math.min(999,+m2[1])), Y=Math.max(0,Math.min(999,+m2[2]));

  ]);}
function worldBorder(cam){                                            // the edge of the realm
  const L=VW/2-cam.x+WORLD.min*zoom, R=VW/2-cam.x+WORLD.max*zoom;
  const T=VH/2-cam.y+WORLD.min*zoom, B=VH/2-cam.y+WORLD.max*zoom;
  ctx.save();ctx.fillStyle='#3d3020';
  if(L>0)ctx.fillRect(0,0,Math.min(L,VW),VH);
  if(R<VW)ctx.fillRect(Math.max(R,0),0,VW-Math.max(R,0),VH);
  if(T>0)ctx.fillRect(0,0,VW,Math.min(T,VH));
  if(B<VH)ctx.fillRect(0,Math.max(B,0),VW,VH-Math.max(B,0));
  ctx.strokeStyle='#8a5f22';ctx.lineWidth=5;ctx.strokeRect(L,T,R-L,B-T);ctx.restore();}
/* THE ARMY — multiple soldier types. Power, speed, and cost differ; an army marches
   at the pace of its SLOWEST unit (Evony law). More types incoming — same universe. */
const UNITS={
  sword:{name:'Swordsman',em:'🗡️',cost:{food:40,iron:12},t:9,pow:1.0,speed:1.0},
  archer:{name:'Archer',em:'🏹',cost:{food:32,wood:16},t:8,pow:1.15,speed:1.0},
  horse:{name:'Horseman',em:'🐎',cost:{food:120,iron:40,gold:6},t:22,pow:2.3,speed:2.4},
};
function troopTotal(a){a=a||S.army;let n=0;for(const k in UNITS)n+=a[k]||0;return n;}
function cityLvSum(t){let n=0;for(const k in S.city){const b=S.city[k];if(b.type===t)n+=b.lv||1;}return n;}
function popCap(){return 50+cityLvSum('cottage')*20+(S.popBonus||0);} // cottages house the people (+dev bonus)
function popUsed(){let n=troopTotal()+S.scouts;
  for(const j of S.queue)if(j.kind&&j.kind.slice(0,5)==='train')n+=j.n||0;
  for(const m of S.marches){if(m.comp)n+=troopTotal(m.comp);n+=m.scouts||0;}
  return n;}
function idlePop(){return Math.max(0,popCap()-popUsed());}            // recruits come from idle civilians
function rallyLv(){return cityLvSum('rally');}
function marchSlots(){return 1+rallyLv();}                            // Rally Spot = simultaneous marches
function marchSizeCap(){return 100*Math.max(1,rallyLv());}            // ...and max army per march
function activeMarches(){return S.marches.filter(m=>!m.home).length;}
function forgeBoost(){return 1+0.05*cityLvSum('forge')+techBonus('atk');}   // Forge level + Military Science research
// WALL DEFENSE — Evony-style defensive works built into your walls. Each adds a
// defense value that reduces incoming attacker power; more = a true uber-base.
const DEFS={
  trap:       {name:'Trap',        em:'🨤', cost:{wood:60,stone:20},        def:8,  desc:'Cheap pits that bleed attackers'},
  abatis:     {name:'Abatis',      em:'🪵', cost:{wood:120,iron:20},        def:16, desc:'Sharpened logs slow the charge'},
  archerTower:{name:"Archer Tower",em:'🏹', cost:{wood:150,stone:120,iron:60},def:40, desc:'Rains arrows on besiegers'},
  rollingLog: {name:'Rolling Log', em:'🪵', cost:{wood:200,stone:80},       def:30, desc:'Crushes massed infantry'},
};
// FORGE RESEARCH — Evony-style tech tree. Each tech has levels 1-10; each level
// costs more + takes longer and stacks a % bonus. Forge level caps how high you go.
const TECH={
  militaryScience:{name:'Military Science',em:'⚔️',effect:'atk', per:0.03, desc:'+3% army attack / level'},
  ironWorking:    {name:'Iron Working',    em:'🛡️',effect:'def', per:0.03, desc:'+3% wall defense / level'},
  logistics:      {name:'Logistics',       em:'🐎',effect:'speed', per:0.04, desc:'+4% march speed / level'},
  agriculture:    {name:'Agriculture',     em:'🌾',effect:'prod', per:0.05, desc:'+5% production / level'},
  masonry:        {name:'Masonry',         em:'🧱',effect:'build', per:0.04, desc:'+4% faster building / level'},
};
function techLv(k){return (S.research&&S.research[k])||0;}
function techBonus(effect){let b=0;for(const k in TECH)if(TECH[k].effect===effect)b+=techLv(k)*TECH[k].per;return b;}
function researchCost(k,lv){const m=lv+1;
  return {food:Math.round(400*m*m*m), iron:Math.round(240*m*m*m), gold:Math.round(80*m*m*m)};}
function researchTime(k,lv){return Math.min(86400,600*(lv+1)*(lv+1)*(lv+1));}   // late tiers reach many hours
function forgeMaxTech(){return Math.max(0,cityLvSum('forge'));}   // forge level = tech cap
function wallDefTotal(){let d=0;const wd=S.wallDef||{};for(const k in DEFS)d+=(wd[k]||0)*DEFS[k].def;
  d+=(S.wall||0)*25;   // the wall itself contributes
  return Math.round(d*(1+techBonus('def')));}   // Iron Working research amplifies defense
function defenseMult(){return 1+wallDefTotal()/500;}   // how much a defender resists (for future PvP)
function powerOf(a){let p=0;for(const k in UNITS)p+=(a[k]||0)*UNITS[k].pow;return p;}
function slowestSpeed(a){let sp=99;for(const k in UNITS)if((a[k]||0)>0)sp=Math.min(sp,UNITS[k].speed);return sp===99?1:sp;}
function slice(n){ // take n troops from the army, proportionally across types
  const total=troopTotal();n=Math.min(n,total);const out={};let taken=0;
  for(const k in UNITS){const q=Math.floor(n*(S.army[k]||0)/total);out[k]=q;taken+=q;}
  for(const k of ['sword','archer','horse']){if(taken>=n)break;
    if((S.army[k]||0)>(out[k]||0)){out[k]=(out[k]||0)+1;taken++;}}
  return out;}
function compStr(a){const bits=[];for(const k in UNITS)if(a[k])bits.push(a[k]+UNITS[k].em);return bits.join(' ')||'0';}

/* Marches: everything on the map takes TIME. Distance × army size = duration; provisions cost food.
   Troops leave your count and return after the round trip. Absolute timestamps → works offline. */
function distMiles(x,y){return Math.hypot(x,y)/140;}
function marchDur(x,y,comp,kind){const d=Math.hypot(x,y);
  if(kind==='scout')return Math.max(25,Math.round(d/900*60));         // lone rider, fast
  const n=typeof comp==='number'?comp:troopTotal(comp);
  const sp=typeof comp==='number'?1:slowestSpeed(comp);
  return Math.max(40,Math.round((d/300)*(1+n/60)*60/sp));}            // slower with mass, faster if all-cavalry
function marchFood(x,y,units){return Math.ceil(distMiles(x,y)*Math.max(1,units)*2);}
function activeMarchTo(tid){return S.marches.find(m=>m.tid===tid&&!m.home);}
let DISPATCH_CTX={};   // {tKind,tLvl,amount,res} set by the menu just before dispatch()
async function dispatch(kind,tid,tx,ty,comp,scouts){
  comp=comp||{};
  const ctx=DISPATCH_CTX; DISPATCH_CTX={};
  // Attacking while under protection breaks it — warn first (truce costs money).
  if((kind==='raid'||kind==='clearcamp')&&isProtected()){
    const paid=(S.truceUntil||0)>Date.now();
    const msg=paid
      ? 'Attacking ends your paid Truce early — you will be exposed to attacks. Continue?'
      : 'Attacking ends your newbie protection early — you will be exposed. Continue?';
    if(!confirm('⚠️ '+msg)){ if(ctx.foodPaid)S.res.food+=ctx.foodPaid; renderRes(); return; }
    S.shieldUntil=0; S.truceUntil=0; save();
    addLog('system','Protection dropped — you struck first.');
    if(ONLINE)srv('stonehold_truce',{days:0}).catch(()=>{});   // clear server protection
  }
  if(ONLINE){
    // SERVER decides: it re-slices from its OWN army, deducts food+units, schedules,
    // and computes the battle at arrival. We already optimistically deducted food in
    // the menu for snappy UX — refund it and let the server be the source of truth.
    if(ctx.foodPaid)S.res.food+=ctx.foodPaid;
    const r=await srv('stonehold_march',{kind,tid,tx,ty,tKind:ctx.tKind,tLvl:ctx.tLvl,amount:ctx.amount,res:ctx.res});
    if(r&&r.ok){ if(r.army)S.army=r.army; if(r.scouts!=null)S.scouts=r.scouts; if(r.res)S.res=r.res; if(r.marches)S.marches=r.marches;
      (r.reports||[]).forEach(rp=>addLog(rp.k,rp.x)); save();renderRes();
      const msg=(kind==='scout'?'🔍 Scout':kind==='raid'?'⚔️ '+compStr(comp):'⛏️ Haulers')+' dispatched (server)';
      toast(msg); addLog('system',msg);
    } else { const e=r&&r.error||'failed'; toast('March refused: '+e.replace(/_/g,' ')); DBG.log('march','server-reject '+e); renderRes(); }
    return;
  }
  // OFFLINE single-player fallback (localStorage authority)
  const dur=marchDur(tx,ty,scouts?1:comp,kind)*1000, now=Date.now();
  S.marches.push({id:'m'+now+Math.random().toString(36).slice(2,5),kind,tid,tx,ty,tKind:ctx.tKind,tLvl:ctx.tLvl,
    comp,scouts:scouts||0,depart:now,arrive:now+dur,ret:now+dur*2,resolved:false,home:false});
  for(const k in comp)S.army[k]=(S.army[k]||0)-(comp[k]||0);
  S.scouts-=scouts||0; save();
  DBG.log('march',kind+' -> '+tid+' eta '+Math.round(dur/1000)+'s');
  const msg=(kind==='scout'?'🔍 Scout':kind==='raid'?'⚔️ '+compStr(comp):'⛏️ Haulers')+' dispatched · ETA '+fmtTime(dur/1000);
  toast(msg); addLog('system',msg);}
/* Battle math — Evony-brutal. Garrison must be out-massed; defeat costs the whole army.
   Camps are the weakest (bandits), Barbarians mid, Derelicts are true NPC castles.
   NOTE FOR SERVER: battles + march lines are OWNER-ONLY. Never broadcast another
   player's marches; other players see only outcomes (razed tiles). */
function garrison(t){ if(t.res) return 60+t.lvl*40;                   // camp bandits  (Lv1 ≈ 100)
  return t.kind==='Derelict'? t.lvl*300 : t.lvl*120; }                // castles: Derelict ≫ Barbarian
function battle(comp,G){                                              // returns {win, frac lost}
  const power=powerOf(comp)*forgeBoost()*(0.85+Math.random()*0.30);   // the gamble (Forge counts)
  if(power<=G) return {win:false, f:1};                               // rout: the army is lost
  const f=Math.min(0.9,(G/power)*0.45*(0.7+Math.random()*0.6));
  return {win:true, f};}
function applyLosses(comp,f){let lost=0;
  for(const k in comp){const q=Math.min(comp[k],Math.ceil(comp[k]*f));comp[k]-=q;lost+=q;}
  return lost;}
function resolveMarch(m){const now=Date.now();
  if(!m.resolved&&now>=m.arrive){m.resolved=true;
    if(m.kind==='scout'){const n=npcs&&npcs.find(q=>q.id===m.tid);
      const rpt=(n&&!S.razed[n.id])?
        '🔍 '+n.kind+' Lv '+n.lvl+': garrison ~'+garrison(n)+' strong · loot ~'+(n.lvl*(n.kind==='Derelict'?600:250))+' · one victory razes it'
        :'🔍 Report: only rubble remains.';
      toast(rpt); addLog('scout',rpt);}
    else if(m.kind==='raid'){const n=npcs&&npcs.find(q=>q.id===m.tid);
      if(n&&!S.razed[n.id]){const G=garrison(n), r=battle(m.comp,G);
        if(r.win){const lost=applyLosses(m.comp,r.f), loot=n.lvl*(n.kind==='Derelict'?600:250);
          S.res.gold+=loot;S.res.food+=loot;S.razed[n.id]=1;
          const msg='⚔️ VICTORY over '+n.kind+' '+n.lvl+'! +'+loot+' gold +'+loot+' food · '+lost+' fell · razed to flat land';
          toast(msg);addLog('battle',msg);DBG.log('battle',m.tid+' WIN -'+lost);}
        else{applyLosses(m.comp,1);
          const msg='💀 DEFEAT at '+n.kind+' '+n.lvl+'. The garrison of '+G+' slaughtered the army. No one returns.';
          toast(msg);addLog('battle',msg);DBG.log('battle',m.tid+' LOSS');}}
      else{toast('⚔️ The army found only ruins.');addLog('battle','⚔️ The army found only ruins.');}}
    else if(m.kind==='clearcamp'){const c=camps&&camps.find(q=>q.id===m.tid);
      if(c&&!S.campClear[c.id]){const G=garrison(c), r=battle(m.comp,G);
        if(r.win){S.campClear[c.id]=1;const lost=applyLosses(m.comp,r.f);
          const msg='⚔️ Camp cleared! '+lost+' fell. Haulers may now work it.';
          toast(msg);addLog('battle',msg);}
        else{applyLosses(m.comp,1);
          const msg='💀 The bandits ('+G+') wiped out your force.';toast(msg);addLog('battle',msg);}}
      else if(c)toast('The camp was already clear.');}
    else if(m.kind==='gather'){const c=camps&&camps.find(q=>q.id===m.tid);
      if(c){const left=campLeft(c),take=Math.min(500*c.lvl,left);
        if(take>0){S.mapRes[c.id]=left-take;S.res[c.res]=Math.min(cap(),(S.res[c.res]||0)+take);
          const msg='⛏️ +'+take+' '+c.res+((left-take)<=0?' — camp exhausted, the land lies flat':'');
          toast(msg);addLog('done',msg);}
        else toast('⛏️ The camp was already bare.');}}
    save();renderRes();}
  if(m.resolved&&!m.home&&now>=m.ret){m.home=true;
    let back=0; if(m.comp)for(const k in m.comp){S.army[k]=(S.army[k]||0)+(m.comp[k]||0);back+=m.comp[k]||0;}
    S.scouts+=m.scouts;
    const msg='🏠 March returned'+(back?' · '+compStr(m.comp)+' home':m.scouts?' · scout home':'');
    toast(msg);addLog('done',msg);save();}}
function tickMarches(){if(!S.marches||!S.marches.length)return;
  for(const m of S.marches)resolveMarch(m);
  S.marches=S.marches.filter(m=>!m.home);}
function drawMarches(cam){if(!S.marches)return;const now=Date.now();
  for(const m of S.marches){
    const hx=VW/2-cam.x, hy=VH/2-cam.y, tx=VW/2-cam.x+m.tx*zoom, ty=VH/2-cam.y+m.ty*zoom;
    ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(60,44,20,0.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
    let px,py;
    if(now<m.arrive){const t=Math.min(1,(now-m.depart)/(m.arrive-m.depart));px=hx+(tx-hx)*t;py=hy+(ty-hy)*t;}
    else{const t=Math.min(1,(now-m.arrive)/(m.ret-m.arrive));px=tx+(hx-tx)*t;py=ty+(hy-ty)*t;}
    ctx.beginPath();ctx.ellipse(px,py+6,7,3,0,0,7);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
    ctx.font='14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.kind==='scout'?'🔍':m.kind==='raid'?'⚔️':'⛏️',px,py);ctx.restore();}}
function npcHp(n){return S.npcHp[n.id]!==undefined?S.npcHp[n.id]:2+Math.ceil(n.lvl/2);}
function attackPlayer(n){
  if(n.prot){toast('🛡️ '+n.name+' is under protection — cannot be attacked');return;}
  const TT=troopTotal();
  if(TT<1){toast('Train an army first');return;}
  if(isProtected()){toast('You must drop your own protection to attack (raid an NPC first, or wait it out)');return;}
  const mi=(Math.hypot(n.x,n.y)/14).toFixed(1);
  modal('⚔️ Attack '+n.name+' · '+mi+' mi',[

cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;const c=CAM();
  if(view==='map'){c.x=drag.cx-dx;c.y=drag.cy-dy;clampMapCam(c);}else{c.x=drag.cx+dx;c.y=drag.cy+dy;}});

  let best=null,bd=1e12;

    zoom=Math.max(0.6,Math.min(2.2,pinch.z*d/pinch.d));}});

function foundation(cx,cy,w){                                        // staked-out Grand Hall site
  const fw=w*0.42, fh=fw*0.5;
  gfill([[cx,cy-fh],[cx+fw,cy],[cx,cy+fh],[cx-fw,cy]],[196,188,168],1.05,0.95,null); // pale cobble, blends in
  const pulse=0.45+0.35*Math.sin(performance.now()/450);              // can't-help-but-tap glow
  ctx.save();ctx.strokeStyle='rgba(240,198,90,'+pulse.toFixed(2)+')';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,cy-fh);ctx.lineTo(cx+fw,cy);ctx.lineTo(cx,cy+fh);ctx.lineTo(cx-fw,cy);
  ctx.closePath();ctx.stroke();ctx.restore();
  ctx.strokeStyle='rgba(110,90,60,0.6)';ctx.lineWidth=1.6;            // survey stakes + rope
  const st=[[cx,cy-fh*0.7],[cx+fw*0.7,cy],[cx,cy+fh*0.7],[cx-fw*0.7,cy]];

  x.beginPath();x.arc(120,120,22,0,7);
  const hg=x.createRadialGradient(114,112,4,120,120,22);hg.addColorStop(0,'#f2cd72');hg.addColorStop(1,'#b9822b');
  x.fillStyle=hg;x.fill();
  poly2=(pp)=>{x.beginPath();x.moveTo(pp[0][0],pp[0][1]);for(let i=1;i<pp.length;i++)x.lineTo(pp[i][0],pp[i][1]);x.closePath();};
  poly2([[120,6],[131,24],[109,24]]);x.fillStyle='#c0413a';x.fill();   // pointer
  x.strokeStyle='#5a1f1a';x.lineWidth=2;x.stroke();}
let poly2;
function spin(){if(spinning)return;
  if(spinsLeft()<=0){toast('No spins left today — members get more 👑');return;}
  spinning=true;S.spinsUsed=(S.spinsUsed||0)+1;const mult=tierMult().shop;let v=0.4+Math.random()*0.3;
  const iv=setInterval(()=>{wheelRot+=v;v*=0.965;drawWheel();if(v<0.004){clearInterval(iv);spinning=false;
    const roll=Math.random();
    if(roll<0.18){for(const k in S.res)S.res[k]+=Math.round(50000*mult);toast('🎉 JACKPOT! +'+fmt(Math.round(50000*mult))+' all');addLog('done','Wheel JACKPOT — resources all round');}
    else if(roll<0.40){S.res.gold+=Math.round(8000*mult);toast('💰 +'+fmt(Math.round(8000*mult))+' gold');}
    else if(roll<0.58){grantBuff('prod2',2*3600e3);toast('⚡ Buff: 2× production for 2h!');}
    else if(roll<0.72){grantBuff('train2',2*3600e3);toast('⚔️ Buff: 2× training speed for 2h!');}
    else if(roll<0.84){S.res.food+=Math.round(12000*mult);S.res.wood+=Math.round(12000*mult);toast('🌾 +food & wood');}
    else toast('Better luck next spin 💀');
    save();renderRes();document.getElementById('spinBtn').textContent='🎡 SPIN ('+spinsLeft()+' left)';}},16);}

/* Buffs: convenience only, never applied to attack OUTCOMES (marches ignore prod/train buffs).
   Absolute expiry → survive reload + offline. */
function grantBuff(id,durMs){if(!S.buffs)S.buffs={};S.buffs[id]=Date.now()+durMs;save();addLog('system','Buff active: '+(BUFFS[id]?BUFFS[id].name:id));}
const BUFFS={prod2:{name:'2× Production',em:'⚡'},train2:{name:'2× Training',em:'⚔️'},prod4:{name:'2× Production',em:'⚡'}};
function buffActive(id){return S.buffs&&S.buffs[id]&&S.buffs[id]>Date.now();}
function prodBuffMult(){return buffActive('prod2')||buffActive('prod4')?2:1;}
function trainBuffMult(){return buffActive('train2')?0.5:1;}

function applyWorld(w){if(!w)return;SRVWORLD=w;
  S.razed=S.razed||{}; S.campClear=S.campClear||{}; S.mapRes=S.mapRes||{};
  for(const id in (w.razed||{}))S.razed[id]=1;
  for(const id in (w.clear||{}))S.campClear[id]=1;
  for(const id in (w.camp||{}))S.mapRes[id]=Number(w.camp[id]);}

/* ===================== CONSOLE LOG ===================== */
function addLog(kind,txt){ if(!S.log)S.log=[];
  S.log.unshift({k:kind,x:txt,ts:Date.now()});
  if(S.log.length>60)S.log.length=60;
  renderLog();}
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);
  return m<1?'now':m<60?m+'m':Math.floor(m/60)+'h';}
function renderLog(){const L=document.getElementById('logList'),H=document.getElementById('logLatest');
  if(!L||!S.log)return;
  H.innerHTML='📜 <span>'+(S.log[0]?('['+S.log[0].k+'] '+S.log[0].x):'The realm awaits your first decree.')+'</span>';
  L.innerHTML=S.log.map(e=>'<div class="lg '+e.k+'"><span class="t">'+ago(e.ts)+'</span>['+e.k+'] '+e.x+'</div>').join('');}
document.getElementById('logbar').onclick=()=>{document.getElementById('logbar').classList.toggle('open');renderLog();setTimeout(fit,200);};

/* ===================== TABS ===================== */
document.querySelectorAll('.tab[data-v]').forEach(t=>t.onclick=()=>setView(t.dataset.v));
function setView(v){view=v;DBG.log('view',v);document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelector(`.tab[data-v="${v}"]`)?.classList.add('on');
  document.getElementById('shop').style.display=v==='shop'?'block':'none';
  document.getElementById('wallBtn').style.display=v==='town'?'block':'none';
  if(v==='shop')renderShop();setHint('');}
document.getElementById('wallBtn').onclick=upgradeWall;
document.getElementById('dbgBtn').onclick=()=>DBG.download();
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(2.2,zoom*1.15);};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(0.6,zoom*0.87);};
document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{const hrs=+b.dataset.skip,r=rates();
  for(const k in r)S.res[k]=Math.min(cap(),Math.round(S.res[k]+r[k]*hrs));
  // also advance queue by hrs
  for(const j of S.queue)j.end-=hrs*3600*1000; processQueue();
  if(S.marches)for(const m of S.marches){m.depart-=hrs*36e5;m.arrive-=hrs*36e5;m.ret-=hrs*36e5;}
  if(S.transports)for(const t of S.transports){t.arrive-=hrs*36e5;} tickTransports();
  tickMarches();
  save();renderRes();toast('+'+hrs+'h skipped (builds + marches)');});
document.getElementById('refreshBtn').onclick=()=>{applyElapsed();renderRes();toast('Refreshed');};

/* ===================== DEV MODE ===================== */
function fillFullCity(){const types=Object.keys(CITY);let i=0;S.city={};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(cornerLocked(c,r))continue;if(c===CENTER&&r===CENTER)continue;
    S.city[c+'_'+r]={type:types[i++%types.length]};}
  const nt=Object.keys(NODE);S.nodes={};for(let k=0;k<6;k++)S.nodes[''+k]={type:nt[k%nt.length]};
  S.wall=4;S.thLevel=3;S.queue=[];}
function emptyCity(){const f=fresh();S.res={food:5000,wood:4000,stone:3000,iron:1500,gold:800};S.city={};S.nodes={};S.queue=[];S.wall=1;S.thLevel=1;S.army={sword:60,archer:40,horse:20};S.scouts=2;S.marches=[];S.log=[];}
const GALLERY=['cottage','barracks','market','warehouse','beacon','keep','th1','th2','th3','farm','sawmill','quarry','mine','cast1','cast2','cast3','cast4','barb','derelict'];
function renderGallery(){ctx.clearRect(0,0,VW,VH);
  const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#6f8f40');g.addColorStop(1,'#5c7a36');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='800 15px system-ui';ctx.textAlign='center';ctx.textBaseline='top';
  ctx.strokeText('ART GALLERY · every building — tap 🛠️ to exit',VW/2,10);ctx.fillText('ART GALLERY · every building — tap 🛠️ to exit',VW/2,10);
  const cols=4,rows=Math.ceil(GALLERY.length/cols),top=40,cw=VW/cols,ch=(VH-top-6)/rows;
  for(let i=0;i<GALLERY.length;i++){const cx=(i%cols)*cw+cw/2, cyc=top+Math.floor(i/cols)*ch, cy=cyc+ch*0.62;
    const W=Math.min(cw,ch)*0.82, tw=W*0.42, thh=tw*0.5;
    poly([[cx,cy-thh],[cx+tw,cy],[cx,cy+thh],[cx-tw,cy]],'rgba(255,255,255,0.10)','rgba(0,0,0,0.16)',1);
    draw(GALLERY[i],cx,cy,W*0.78);
    ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.font='700 11px system-ui';ctx.textBaseline='alphabetic';
    ctx.strokeText(GALLERY[i],cx,cyc+ch-4);ctx.fillText(GALLERY[i],cx,cyc+ch-4);}}
async function openOverwatch(){
  closeModal();toast('🛰️ Scanning the realm…');
  const r=await srv('stonehold_overwatch',{});
  if(!r||!r.ok){toast('Overwatch unavailable'+(r&&r.error?': '+r.error:''));return;}
  const flagged=r.rows.filter(x=>x.flags.length), clean=r.rows.filter(x=>!x.flags.length);
  const rowItem=(x)=>({em:x.flags.length?'⚠️':(x.isDev?'🛠️':'🏰'),
    label:x.name+' · '+x.tier+' · ('+x.home+')',
    meta:(x.flags.length?('⚠️ '+x.flags.join(' · ')+' · '):'')+
      '🌾'+fmt(x.res.food)+' 🪵'+fmt(x.res.wood)+' ⛰️'+fmt(x.res.stone)+' ⛓️'+fmt(x.res.iron)+' 🪙'+fmt(x.res.gold)+
      ' · army '+(x.army.s+x.army.a+x.army.h)+' · TH'+x.th,
    fn:closeModal});
  const items=[{em:'📊',label:r.count+' lords · '+r.flagged+' flagged',meta:'tap any to dismiss',fn:closeModal}]
    .concat(flagged.map(rowItem)).concat(clean.slice(0,40).map(rowItem));
  modal('🛰️ Realm Overwatch',items);}
document.getElementById('devBtn').onclick=()=>{
  if(!SRV_DEV){return;}   // hard gate — the menu itself refuses without server-confirmed dev
  modal('🛠️ Dev Mode',[
    {em:'🏚️',label:'Empty City',meta:'test the build loop',fn:()=>{closeModal();galleryOn=false;emptyCity();save();setView('town');toast('Empty city — build away');renderRes();}},
    ...(SRV_DEV?[
    {em:'🛰️',label:'Overwatch — all players',meta:'resources + anomaly flags',fn:openOverwatch},
    {em:'👥',label:'+500 population cap',meta:'dev: house phantom civilians',fn:()=>{S.popBonus=(S.popBonus||0)+500;save();closeModal();toast('👥 +500 population cap (dev)');renderRes();}},
    {em:'🪖',label:'Muster test army',meta:'dev: +200🗡️ +100🏹 +50🐎 +3 scouts',fn:()=>{S.army.sword+=200;S.army.archer+=100;S.army.horse+=50;S.scouts+=3;S.popBonus=(S.popBonus||0)+500;save();closeModal();toast('🪖 Test army mustered');renderRes();}},
    ]:[]),
    {em:'🧨',label:'Reset Save',meta:'wipe save + fresh start',fn:()=>{localStorage.removeItem(SAVE);DBG.log('dev','reset-save');location.reload();}},
    {em:'🏰',label:'Full City',meta:'all buildings + walls',fn:()=>{closeModal();galleryOn=false;fillFullCity();save();setView('town');toast('Full city');renderRes();}},
    {em:'🖼️',label:galleryOn?'Exit Gallery':'Art Gallery',meta:'review every building',fn:()=>{closeModal();galleryOn=!galleryOn;toast(galleryOn?'Gallery — tap 🛠️ to exit':'Back to game');}},
  ]);
};

/* ===================== LOOP ===================== */
lastSave=Date.now();
let galleryOn=false;
function loop(){try{
  if(galleryOn){renderGallery();requestAnimationFrame(loop);return;}
  if(view!=='shop'){ctx.clearRect(0,0,VW,VH);
  if(view==='town')renderTown();else if(view==='outside')renderOutside();else if(view==='map')renderMap();}
  _renderFails=0;}
  catch(err){
    _renderFails++;
    if(!_renderErrLogged){DBG.log('RENDER-ERR',(err&&err.message)+' | '+(err&&err.stack||'').split('\n')[1]);_renderErrLogged=true;}
    // Self-heal: if the active view keeps throwing, repair state and show a readable
    // message on the canvas instead of a silent black screen.
    try{
      if(_renderFails===3){ if(!S||!S.res){S=fresh();} if(typeof migrateCities==='function')migrateCities(S);
        if(S.wall==null||S.wall<0)S.wall=0; if(S.thLevel==null)S.thLevel=0; }
      if(_renderFails>1&&ctx){ctx.clearRect(0,0,VW,VH);
        ctx.fillStyle='#2c2114';ctx.font='600 14px system-ui';ctx.textAlign='center';
        ctx.fillText('Loading your realm…',VW/2,VH/2-10);
        ctx.font='11px system-ui';ctx.fillStyle='#8a5f22';
        ctx.fillText('If this persists, tap TOWN or FIELDS above',VW/2,VH/2+14);}
    }catch(e2){}
  }
  requestAnimationFrame(loop);}
function tick(){applyElapsed();processQueue();tickMarches();tickTransports();renderRes();if(Date.now()-lastSave>15000){save();lastSave=Date.now();}}
setInterval(tick,1000);
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function tutHint(){
  if(S.thLevel)return null;
  if(S.queue.find(j=>j.kind==='gh'))return '🏗️ The Grand Hall rises…';
  if(!nodeCount('farm'))return '📜 Tap a plot and build a Farm — your first field of each kind is FREE';
  if(!nodeCount('sawmill'))return '📜 Now a Sawmill (free) — the Hall needs timber';
  if(!nodeCount('quarry'))return '📜 A Quarry too (free) — stone for the foundations';
  if(!afford(GH_COST))return '⏳ Let the fields work: '+costStr(GH_COST)+' for the Grand Hall';
  return '🏛️ You have enough! Go to TOWN and raise the Grand Hall';}

/* Tab-return hardening: Chrome can resize/starve the canvas while backgrounded.
   On every return: re-fit the canvas and catch up timers/marches. */
document.addEventListener('visibilitychange',()=>{if(!document.hidden){
  fit();applyElapsed();processQueue();tickMarches();tickTransports();renderRes();DBG.log('sys','tab-return refit');}});
window.addEventListener('focus',()=>fit());
window.addEventListener('pageshow',()=>fit());

/* ===================== BOOT ===================== */
fit();applyElapsed();
// catch up any queue finished while away
if(!S.log||!S.log.length){
  addLog('system','If you want to whisper to a lord, the realm must first come online. Reports for scouting, battles and valleys are shown here — only you can see this channel.');
  addLog('world','The realm of Server SS37 stirs. New lords raise their halls across the land…');}
processQueue();renderRes();renderLog();setView(S.thLevel===0?'outside':'town');save();
bootOnline();
setTimeout(()=>{if(S.thLevel===0&&!S.tutSeen){S.tutSeen=1;save();
  modal('📜 Welcome, Lord of Nothing',[
   {em:'🌾',label:'Break ground on your first fields',meta:'first of each kind is free',fn:closeModal},
   {em:'🏛️',label:'Gather '+costStr(GH_COST),meta:'to raise the Grand Hall',fn:closeModal},
   {em:'⚔️',label:'Then: barracks, scouts, marches',meta:'the realm awaits',fn:closeModal}]);}},700);
</script>
