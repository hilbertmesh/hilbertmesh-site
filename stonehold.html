/* World is 1000×1000 coords (Evony-size). px = (coord-512)*14. Camera clamps to the border. */
const WORLD_MAXC=1499;   // "one big-ass map": 1500×1500 coords, months of settling room
const WORLD={min:(0-512)*14, max:(WORLD_MAXC-512)*14};
function clampMapCam(c){c.x=Math.max(WORLD.min*zoom,Math.min(WORLD.max*zoom,c.x));
  c.y=Math.max(WORLD.min*zoom,Math.min(WORLD.max*zoom,c.y));}
/* ── ZOOM THAT STAYS PUT ──────────────────────────────────────────────────
   cam is stored in world-px × zoom units, so changing zoom WITHOUT rescaling
   cam slides the centered point by cam×(Δ1/zoom) — miles, if you're panned far
   from home. setZoom() rescales the active camera so the point under the
   screen center stays under the screen center. This was the zoom-fling bug. */
function setZoom(nz){nz=Math.max(0.6,Math.min(2.2,nz));if(nz===zoom)return;
  const f=nz/zoom, c=CAM(); c.x*=f; c.y*=f; zoom=nz;
  if(view==='map')clampMapCam(c); else clampTownCam(c);}

/* ===================== INPUT ===================== */
/* Drag is bound to ONE pointer id. A second finger, a stale pointer that never
   fired pointerup, or an out-of-order event can no longer anchor a huge delta
   and fling the camera miles across the map (the "double scroll" bug). */
let drag=null, pinch=null, PAN_COOL=0;
cv.addEventListener('pointerdown',e=>{
  if(drag&&drag.pid!==e.pointerId){drag=null;return;}   // second finger → cancel pan (pinch takes over)
  const c=CAM();drag={pid:e.pointerId,x:e.clientX,y:e.clientY,cx:c.x,cy:c.y,moved:false};});
cv.addEventListener('pointermove',e=>{if(!drag||drag.pid!==e.pointerId||pinch||Date.now()<PAN_COOL)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;
  // sanity: a single frame can't legitimately jump half the world — swallow glitch deltas
  if(Math.abs(dx)>VW*1.5||Math.abs(dy)>VH*1.5){drag=null;return;}
  const c=CAM();
  if(view==='map'){c.x=drag.cx-dx;c.y=drag.cy-dy;clampMapCam(c);}
  else{c.x=drag.cx+dx;c.y=drag.cy+dy;clampTownCam(c);}});
cv.addEventListener('pointerup',e=>{
  if(drag&&drag.pid!==e.pointerId)return;               // not our pointer — ignore
  if(drag&&!drag.moved){e.preventDefault();const r=cv.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
  let best=null,bd=1e12;
  for(let i=0;i<hots.length;i++){const h=hots[i],d2=(px-h.x)**2+(py-h.y)**2;
    if(d2<=h.r*h.r&&d2<bd){bd=d2;best=h;}}
  if(best)best.fn();}drag=null;});
cv.addEventListener('pointercancel',()=>{drag=null;});
cv.addEventListener('pointerleave',e=>{if(drag&&drag.pid===e.pointerId)drag=null;});
// pinch-zoom (two fingers) + wheel zoom
const active=new Map();
cv.addEventListener('pointerdown',e=>{active.set(e.pointerId,e);if(active.size===2){const p=[...active.values()];pinch={d:Math.hypot(p[0].clientX-p[1].clientX,p[0].clientY-p[1].clientY),z:zoom};drag=null;}});
cv.addEventListener('pointermove',e=>{if(active.has(e.pointerId))active.set(e.pointerId,e);
  if(pinch&&active.size===2){const p=[...active.values()];const d=Math.hypot(p[0].clientX-p[1].clientX,p[0].clientY-p[1].clientY);
    zoom=Math.max(0.6,Math.min(2.2,pinch.z*d/pinch.d));}});
cv.addEventListener('pointerup',e=>{active.delete(e.pointerId);if(active.size<2&&pinch){pinch=null;PAN_COOL=Date.now()+220;}});
cv.addEventListener('pointercancel',e=>{active.delete(e.pointerId);if(active.size<2&&pinch){pinch=null;PAN_COOL=Date.now()+220;}});
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.1:0.9));},{passive:false});

   Cost curve: classic ×1.42/lv to 10, then ×1.6/lv beyond — MILLIONS by the 20s.
   Time curve (upTime): ×1.38/lv to 10, then ×1.32/lv — final building levels take weeks. */
function upCost(base,lv){const c={};
  const m=Math.pow(1.42,Math.min(lv,10))*Math.pow(1.6,Math.max(0,lv-10));

function upTime(baseT,lv){return Math.round(baseT*Math.pow(1.38,Math.min(lv,10))*Math.pow(1.32,Math.max(0,lv-10)));}

function foundation(cx,cy,w){                                        // staked-out Grand Hall site
  const fw=w*0.42, fh=fw*0.5;
  gfill([[cx,cy-fh],[cx+fw,cy],[cx,cy+fh],[cx-fw,cy]],[196,188,168],1.05,0.95,null); // pale cobble, blends in
  const pulse=0.45+0.35*Math.sin(performance.now()/450);              // can't-help-but-tap glow
  ctx.save();ctx.strokeStyle='rgba(240,198,90,'+pulse.toFixed(2)+')';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(cx,cy-fh);ctx.lineTo(cx+fw,cy);ctx.lineTo(cx,cy+fh);ctx.lineTo(cx-fw,cy);
  ctx.closePath();ctx.stroke();ctx.restore();
  ctx.strokeStyle='rgba(110,90,60,0.6)';ctx.lineWidth=1.6;            // survey stakes + rope
  const st=[[cx,cy-fh*0.7],[cx+fw*0.7,cy],[cx,cy+fh*0.7],[cx-fw*0.7,cy]];
  for(const q of st){ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[0],q[1]-8);ctx.stroke();}
  ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(st[0][0],st[0][1]-6);
  for(let i=1;i<4;i++)ctx.lineTo(st[i][0],st[i][1]-6);ctx.closePath();ctx.stroke();ctx.setLineDash([]);
  ctx.font='bold 15px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='rgba(90,60,20,'+(0.5+pulse*0.5).toFixed(2)+')';ctx.fillText('🏛️ +',cx,cy-2);
  ctx.font='bold 12px Georgia';ctx.fillStyle='#3a2914';
  ctx.fillText('Grand Hall site',cx,cy+fh+13);}

let wheelRot=0,spinning=false;
function drawWheel(){const c=document.getElementById('wheel');if(!c)return;const x=c.getContext('2d');
  const cols=['#c0413a','#d9a531','#3f8a3a','#3a6bd9','#a23a3a','#d98a2f','#7a3fa0','#5a8a3a'];
  x.clearRect(0,0,240,240);
  x.save();x.translate(120,124);x.beginPath();x.arc(0,0,112,0,7);      // drop shadow (2007 obligatory)
  x.fillStyle='rgba(0,0,0,0.35)';x.fill();x.restore();
  x.save();x.translate(120,120);x.rotate(wheelRot);
  for(let i=0;i<8;i++){                                                // segments w/ radial depth + hard rims
    const g=x.createRadialGradient(0,0,20,0,0,108);
    g.addColorStop(0,cols[i]);g.addColorStop(1,'#00000055');
    x.beginPath();x.moveTo(0,0);x.arc(0,0,104,i*Math.PI/4,(i+1)*Math.PI/4);
    x.fillStyle=cols[i];x.fill();x.fillStyle=g;x.fill();
    x.strokeStyle='rgba(30,18,6,0.7)';x.lineWidth=2;x.stroke();}
  // prize icons riding each segment (what you can actually win)
  const WHEEL_ITEMS=['🎉','💰','⚡','⚔️','🌾','💰','⚡','💎'];
  for(let i=0;i<8;i++){const a=i*Math.PI/4+Math.PI/8;
    x.save();x.rotate(a);x.translate(72,0);x.rotate(-a-wheelRot);
    x.font='19px system-ui';x.textAlign='center';x.textBaseline='middle';
    x.fillText(WHEEL_ITEMS[i],0,0);x.restore();}
  x.restore();
  // beveled gold rim + rivet studs
  x.beginPath();x.arc(120,120,109,0,7);x.lineWidth=10;x.strokeStyle='#8a5f22';x.stroke();
  x.beginPath();x.arc(120,120,107,0,7);x.lineWidth=6;
  const rg=x.createLinearGradient(0,10,0,230);rg.addColorStop(0,'#f2cd72');rg.addColorStop(1,'#a5751f');
  x.strokeStyle=rg;x.stroke();
  x.save();x.translate(120,120);x.rotate(wheelRot);
  for(let i=0;i<8;i++){const a=i*Math.PI/4+Math.PI/8;                  // studs ride the rim
    const sx=Math.cos(a)*107,sy=Math.sin(a)*107;
    x.beginPath();x.arc(sx,sy,3.4,0,7);x.fillStyle='#6e4c14';x.fill();

const QUESTS={

  train: {em:'🗡️',name:'Muster the Levy',desc:'Order 50 troops trained',   need:50},

function questDayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function questState(){const dk=questDayKey();
  if(!S.quests||S.quests.day!==dk)S.quests={day:dk,counts:{},claimed:{}};
  return S.quests;}
function questBump(k,n){try{const q=questState();
  if(q.claimed[k])return;                       // already banked today
  const before=q.counts[k]||0;
  q.counts[k]=before+(n||1);
  if(before<QUESTS[k].need&&q.counts[k]>=QUESTS[k].need)
    toast('🎯 Quest ready: '+QUESTS[k].name+' — claim it!');
}catch(e){}}
function questReward(){const th=Math.max(1,S.thLevel||1);   // scales with the Hall — better every tier
  return {food:500+800*th,wood:500+800*th,stone:300+500*th,iron:150+300*th,gold:100+200*th};}

function sendChat(raw){

  // default target: All/System tabs post to Global; the PM tab whispers.
  let ch=(CHAT_CH==='all'||CHAT_CH==='system')?'global':CHAT_CH;
  const sendPM=(to,body)=>{ srv('stonehold_mail_deliver',{to,subject:'PM',body})
    .then(r=>{ if(r&&r.delivered){ const pmMsg={ch:'pm',name:'You → '+to,text:body,t:Date.now(),out:true};
        CHAT_LOG.pm.push(pmMsg);if(CHAT_LOG.pm.length>60)CHAT_LOG.pm.shift();paintChat();}
      else chatPush('system',null,'PM saved (lord not found)',true); }); };
  const m=text.match(/^\/(g|l|c|t|p)\b\s*(.*)$/i);
  if(m){const cmd=m[1].toLowerCase();
    if(cmd==='g')ch='global'; else if(cmd==='l')ch='local'; else if(cmd==='c')ch='clan';
    else if(cmd==='t')ch='trade';
    else if(cmd==='p'){ // /p name message  → private whisper (💌 tab)
      const pm=m[2].match(/^(\S+)\s+(.+)$/); if(pm)sendPM(pm[1],pm[2]);
      else chatPush('system',null,'Usage: /p LordName your message',true);
      return; }
    text=m[2];   // stay on the current tab (All shows everything anyway)
  }
  if(!text)return;
  if(ch==='pm'){ // typed straight into the 💌 tab
    const pm=text.match(/^(\S+)\s+(.+)$/);
    if(pm)sendPM(pm[1],pm[2]);
    else chatPush('system',null,'PM format: LordName your message (or /p LordName msg from any tab)',true);
    return; }
  if(!ONLINE){chatPush('system',null,'You are offline — connect to chat with the realm.',true);return;}
  if(ch==='clan'){ // clan chat (local echo for now; server clan channel scaffolded)
    chatPush('clan',(S.lord||'You'),text); return; }
  if(ch==='trade'){ chatPush('trade',(S.lord||'You'),text); return; }
  // global/local → server. Show it instantly (optimistic), then reconcile on next poll.
  chatPush(ch,(S.lord||'You'),text);
  srv('stonehold_chat_post',{channel:ch==='local'?'local':'world',text}).then(r=>{
    if(r&&r.ok){pollChat();} else chatPush('system',null,'Message failed to send.',true);});
}

lastSave=Date.now();
let galleryOn=false;
function loop(){_loopBeat=Date.now();try{
  if(galleryOn){renderGallery();requestAnimationFrame(loop);return;}
  if(view!=='shop'){ctx.clearRect(0,0,VW,VH);
  if(view==='town')renderTown();else if(view==='outside')renderOutside();else if(view==='map')renderMap();}
  _renderFails=0;}
  catch(err){
    _renderFails++;
    if(!_renderErrLogged){DBG.log('RENDER-ERR',(err&&err.message)+' | '+(err&&err.stack||'').split('\n')[1]);_renderErrLogged=true;}
    // Self-heal: if the active view keeps throwing, repair state and show a readable
    // message on the canvas instead of a silent black screen.
    try{
      if(_renderFails===3){ if(!S||!S.res){S=fresh();} if(typeof migrateCities==='function')migrateCities(S);
        if(S.wall==null||S.wall<0)S.wall=0; if(S.thLevel==null)S.thLevel=0; }
      if(_renderFails>1&&ctx){ctx.clearRect(0,0,VW,VH);
        ctx.fillStyle='#2c2114';ctx.font='600 14px system-ui';ctx.textAlign='center';
        ctx.fillText('Loading your realm…',VW/2,VH/2-10);
        ctx.font='11px system-ui';ctx.fillStyle='#8a5f22';
        ctx.fillText('If this persists, tap TOWN or FIELDS above',VW/2,VH/2+14);}
    }catch(e2){}
  }
  requestAnimationFrame(loop);}

function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* Procedural cover: sunset over the realm, the citadel on its hill, and a
   dignified armored queen bearing the banner — painted in code, no assets. */
function drawSplashCover(){
  /* EMBLEM MODE: dark gold-on-black, storm light, the great citadel, banners
     and the crowned lion shield — matching the Stonehold seal. */
  const scv=document.getElementById('splashCv'); if(!scv)return;
  const w=scv.clientWidth||innerWidth, h=scv.clientHeight||innerHeight;
  scv.width=w; scv.height=h; const c=scv.getContext('2d');
  const GOLD='#d4a94e', GOLD_HI='#f2cd72', GOLD_DK='#8a6a28';
  // ── sky: near-black storm with a golden break ──
  const sky=c.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#08060a');sky.addColorStop(0.35,'#1a140e');sky.addColorStop(0.62,'#3a2a14');sky.addColorStop(0.80,'#181009');sky.addColorStop(1,'#050403');
  c.fillStyle=sky;c.fillRect(0,0,w,h);
  // storm clouds (layered dark blobs)
  const rr=(n)=>((Math.sin(n*127.1)*43758.5453)%1+1)%1;
  c.fillStyle='rgba(14,10,8,0.85)';
  for(let i=0;i<26;i++){const x=rr(i)*w, y=rr(i+40)*h*0.34, R=w*(0.06+rr(i+80)*0.13);
    c.beginPath();c.ellipse(x,y,R,R*0.42,0,0,7);c.fill();}
  c.fillStyle='rgba(30,22,14,0.7)';
  for(let i=0;i<18;i++){const x=rr(i+7)*w, y=h*0.10+rr(i+21)*h*0.26, R=w*(0.05+rr(i+63)*0.10);
    c.beginPath();c.ellipse(x,y,R,R*0.38,0,0,7);c.fill();}
  // god-rays breaking from the upper-left
  c.save();c.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){const a=0.55+i*0.16;
    const g=c.createLinearGradient(w*0.12,h*0.06,w*0.12+Math.cos(a)*w*0.9,h*0.06+Math.sin(a)*w*0.9);
    g.addColorStop(0,'rgba(212,169,78,0.16)');g.addColorStop(0.6,'rgba(212,169,78,0.03)');g.addColorStop(1,'rgba(212,169,78,0)');
    c.fillStyle=g;c.beginPath();
    c.moveTo(w*0.12,h*0.06);
    c.lineTo(w*0.12+Math.cos(a-0.05)*w*1.2,h*0.06+Math.sin(a-0.05)*w*1.2);
    c.lineTo(w*0.12+Math.cos(a+0.05)*w*1.2,h*0.06+Math.sin(a+0.05)*w*1.2);
    c.closePath();c.fill();}
  const glow=c.createRadialGradient(w*0.14,h*0.08,2,w*0.14,h*0.08,w*0.30);
  glow.addColorStop(0,'rgba(242,205,114,0.5)');glow.addColorStop(1,'rgba(242,205,114,0)');
  c.fillStyle=glow;c.fillRect(0,0,w,h*0.5);
  c.restore();
  // ── jagged mountain ranges (two depths, gold rim on the lit side) ──
  const range=(base,amp,col,seedo)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,h*base);
    for(let x=0;x<=w;x+=w/26){const t=x/w;
      c.lineTo(x,h*(base-amp*(0.4+0.6*Math.abs(Math.sin(t*9+seedo)))*(0.6+0.4*Math.sin(t*3.4+seedo*2))));}
    c.lineTo(w,h);c.lineTo(0,h);c.closePath();c.fill();};
  range(0.46,0.10,'#141017',1.7); range(0.50,0.07,'#0e0a0e',4.2);
  // ── THE CITADEL: massive dark keep cluster, gold-lit windows, banners ──
  const bx=w*0.50, by=h*0.52, K=Math.min(w,h)*0.30;
  const T=(x,ww,hh)=>{ // one tower: dark body + crenels + gold rim-light on the left edge

    c.strokeStyle='rgba(212,169,78,0.55)';c.lineWidth=1.6;
    c.beginPath();c.moveTo(x-ww/2,by-hh);c.lineTo(x-ww/2,by);c.stroke();
    // lit arrow-slit windows
    c.fillStyle='rgba(242,180,74,0.9)';
    for(let i=0;i<3;i++){if(rr(x+i)<0.6)c.fillRect(x-ww*0.08,by-hh*0.75+i*hh*0.24,ww*0.10,ww*0.16);}};
  // curtain wall
  c.fillStyle='#0c0a0c';c.fillRect(bx-K*0.95,by-K*0.34,K*1.9,K*0.34);
  for(let i=0;i<12;i++)c.fillRect(bx-K*0.95+i*K*0.165,by-K*0.40,K*0.09,K*0.07);
  c.strokeStyle='rgba(212,169,78,0.4)';c.lineWidth=1.4;
  c.beginPath();c.moveTo(bx-K*0.95,by-K*0.34);c.lineTo(bx+K*0.95,by-K*0.34);c.stroke();
  // gate: gold-lit arch + portcullis bars
  c.fillStyle='rgba(242,180,74,0.85)';
  c.beginPath();c.ellipse(bx,by-K*0.02,K*0.09,K*0.16,0,Math.PI,0);c.fill();
  c.fillStyle='#0c0a0c';for(let i=-2;i<=2;i++)c.fillRect(bx+i*K*0.032-K*0.008,by-K*0.17,K*0.016,K*0.17);
  T(bx-K*0.78,K*0.20,K*0.62); T(bx+K*0.78,K*0.20,K*0.62);          // outer towers
  T(bx-K*0.42,K*0.24,K*0.86); T(bx+K*0.42,K*0.24,K*0.86);          // inner towers
  T(bx,K*0.34,K*1.15);                                              // the great keep
  // spire + banner on the keep
  c.fillStyle='#0c0a0c';c.beginPath();c.moveTo(bx-K*0.20,by-K*1.15);c.lineTo(bx,by-K*1.42);c.lineTo(bx+K*0.20,by-K*1.15);c.closePath();c.fill();
  c.strokeStyle='rgba(212,169,78,0.6)';c.lineWidth=1.4;
  c.beginPath();c.moveTo(bx-K*0.20,by-K*1.15);c.lineTo(bx,by-K*1.42);c.stroke();
  c.strokeStyle='#0c0a0c';c.lineWidth=2.5;c.beginPath();c.moveTo(bx,by-K*1.42);c.lineTo(bx,by-K*1.60);c.stroke();
  c.fillStyle='#6a1e18';c.beginPath();c.moveTo(bx,by-K*1.60);c.lineTo(bx+K*0.17,by-K*1.54);c.lineTo(bx,by-K*1.47);c.closePath();c.fill();
  // torch fires on the wall ends
  for(const tx of [bx-K*0.95,bx+K*0.95]){
    const fg=c.createRadialGradient(tx,by-K*0.42,1,tx,by-K*0.42,K*0.10);
    fg.addColorStop(0,'rgba(255,150,50,0.9)');fg.addColorStop(1,'rgba(255,150,50,0)');
    c.fillStyle=fg;c.beginPath();c.arc(tx,by-K*0.42,K*0.10,0,7);c.fill();}
  // ── FOREGROUND: dark battlement rampart across the bottom ──
  const ry=h*0.80;
  c.fillStyle='#0a0808';c.fillRect(0,ry,w,h-ry);
  c.fillStyle='#0e0b0a';for(let i=0;i<Math.ceil(w/(w*0.075));i++)c.fillRect(i*w*0.075+w*0.012,ry-h*0.030,w*0.05,h*0.032);
  c.strokeStyle='rgba(212,169,78,0.35)';c.lineWidth=1.5;
  c.beginPath();c.moveTo(0,ry);c.lineTo(w,ry);c.stroke();
  // stone joints
  c.strokeStyle='rgba(60,48,30,0.5)';c.lineWidth=1;
  for(let yy=ry+h*0.03;yy<h;yy+=h*0.035){c.beginPath();c.moveTo(0,yy);c.lineTo(w,yy);c.stroke();}
  // hanging banners left & right, lion-marked
  const banner=(x)=>{c.fillStyle='#1a0c0a';c.fillRect(x-w*0.045,ry-h*0.005,w*0.09,h*0.13);
    c.beginPath();c.moveTo(x-w*0.045,ry+h*0.125);c.lineTo(x,ry+h*0.155);c.lineTo(x+w*0.045,ry+h*0.125);c.closePath();c.fill();
    c.strokeStyle='rgba(212,169,78,0.6)';c.lineWidth=1.4;c.strokeRect(x-w*0.045,ry-h*0.005,w*0.09,h*0.13);
    c.fillStyle='rgba(212,169,78,0.75)';c.beginPath();c.arc(x,ry+h*0.055,w*0.02,0,7);c.fill();
    c.fillStyle='#1a0c0a';c.beginPath();c.arc(x,ry+h*0.055,w*0.012,0,7);c.fill();};
  banner(w*0.12); banner(w*0.88);
  // ── THE SHIELD: crowned, gold-rimmed, crossed swords behind ──
  const sx=w*0.5, sy=ry+ (h-ry)*0.42, S2=Math.min(w,h)*0.085;
  c.save();
  c.strokeStyle='#9a9690';c.lineWidth=S2*0.10;                      // crossed swords
  c.beginPath();c.moveTo(sx-S2*1.5,sy-S2*1.1);c.lineTo(sx+S2*1.5,sy+S2*1.1);c.stroke();
  c.beginPath();c.moveTo(sx+S2*1.5,sy-S2*1.1);c.lineTo(sx-S2*1.5,sy+S2*1.1);c.stroke();
  c.fillStyle=GOLD;                                                 // sword hilts
  for(const [hx,hy] of [[-1.5,-1.1],[1.5,-1.1]]){
    c.fillRect(sx+hx*S2-S2*0.22,sy+hy*S2-S2*0.05,S2*0.44,S2*0.10);}
  const sh=(f)=>{c.beginPath();                                      // shield path
    c.moveTo(sx-S2*f,sy-S2*0.9*f);c.lineTo(sx+S2*f,sy-S2*0.9*f);
    c.lineTo(sx+S2*f,sy+S2*0.25*f);c.quadraticCurveTo(sx+S2*f,sy+S2*0.95*f,sx,sy+S2*1.25*f);
    c.quadraticCurveTo(sx-S2*f,sy+S2*0.95*f,sx-S2*f,sy+S2*0.25*f);c.closePath();};
  sh(1.08);c.fillStyle=GOLD_DK;c.fill();                             // gold rim
  sh(0.95);c.fillStyle='#120e0c';c.fill();                           // dark field
  sh(0.95);c.strokeStyle='rgba(212,169,78,0.35)';c.lineWidth=1;c.stroke();
  // crown above the shield
  c.fillStyle=GOLD;
  c.beginPath();c.moveTo(sx-S2*0.55,sy-S2*1.02);
  c.lineTo(sx-S2*0.55,sy-S2*1.35);c.lineTo(sx-S2*0.28,sy-S2*1.12);
  c.lineTo(sx,sy-S2*1.45);c.lineTo(sx+S2*0.28,sy-S2*1.12);
  c.lineTo(sx+S2*0.55,sy-S2*1.35);c.lineTo(sx+S2*0.55,sy-S2*1.02);c.closePath();c.fill();
  // rampant lion (stylized silhouette in gold)
  c.fillStyle=GOLD;
  c.save();c.translate(sx,sy+S2*0.12);c.scale(S2/40,S2/40);
  c.beginPath();
  c.moveTo(-6,26);c.lineTo(-14,24);c.lineTo(-10,16);c.lineTo(-14,6);      // rear leg + haunch
  c.quadraticCurveTo(-18,-4,-10,-10);                                      // back
  c.lineTo(-16,-16);c.lineTo(-8,-14);                                      // rear raised paw
  c.quadraticCurveTo(-4,-22,4,-22);                                        // shoulder to head
  c.lineTo(2,-30);c.lineTo(8,-25);c.lineTo(14,-27);c.lineTo(11,-20);       // mane spikes + muzzle
  c.quadraticCurveTo(16,-16,12,-10);
  c.lineTo(20,-8);c.lineTo(12,-4);                                         // front raised paw
  c.lineTo(16,4);c.lineTo(8,4);                                            // second paw
  c.quadraticCurveTo(10,14,4,20);c.lineTo(6,26);c.lineTo(-2,24);c.closePath();c.fill();
  c.beginPath();c.moveTo(-14,22);c.quadraticCurveTo(-26,18,-24,6);         // the tail
  c.quadraticCurveTo(-23,0,-18,-2);c.quadraticCurveTo(-21,6,-20,12);
  c.quadraticCurveTo(-19,20,-12,24);c.closePath();c.fill();
  c.restore();
  c.restore();
  // ── heavy vignette: the emblem's black ring ──
  const vg=c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.22,w/2,h/2,Math.max(w,h)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(0.75,'rgba(4,2,1,0.45)');vg.addColorStop(1,'rgba(0,0,0,0.92)');
  c.fillStyle=vg;c.fillRect(0,0,w,h);
}

/* ===================== COURT MUSIC (generative, zero assets) ==============
   A quiet medieval air: low drone + pentatonic lute plucks, wandering
   deterministically. WebAudio only — nothing to download, nothing to license. */
let AC=null,MG=null,MUS_T=null;
function musVol(){const v=parseInt(localStorage.getItem('hm_vol')||'40');return Math.max(0,Math.min(100,isNaN(v)?40:v))/100;}
function startMusic(){
  try{
    if(MUS_T)return;
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    MG=AC.createGain();MG.gain.value=0.22*musVol();MG.connect(AC.destination);
    for(const f of [98,147]){const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;g.gain.value=0.05;o.connect(g);g.connect(MG);o.start();}
    const SCALE=[220,261.6,293.7,329.6,392,440,523.3];   // A-minor pentatonic-ish court mode
    let step=0,pos=3;
    MUS_T=setInterval(()=>{
      if(!AC||document.hidden)return;
      step++;
      if(step%2)return;                                   // plucks on the half-beat
      pos+=[-2,-1,-1,0,1,1,2][hashKey('mus'+step)%7]; pos=Math.max(0,Math.min(SCALE.length-1,pos));
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='triangle';o.frequency.value=SCALE[pos]*((hashKey('oct'+step)%4===0)?2:1);
      const t=AC.currentTime;
      g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.16,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
      o.connect(g);g.connect(MG);o.start(t);o.stop(t+1.2);
    },340);
  }catch(e){DBG.log('sys','music failed: '+e.message);}
}
function stopMusic(){if(MUS_T){clearInterval(MUS_T);MUS_T=null;}
  if(MG){try{MG.gain.value=0;}catch(e){}}}
function setMusicVol(v){localStorage.setItem('hm_vol',String(v));if(MG)MG.gain.value=0.22*musVol();}

  addLog('world','The realm of Server SS37 stirs. New lords raise their halls across the land…');}
processQueue();renderRes();renderLog();setView(S.thLevel===0?'outside':'town');save();
bootOnline();
setTimeout(()=>{if(S.thLevel===0&&!S.tutSeen){S.tutSeen=1;save();
  modal('📜 Welcome, Lord of Nothing',[
   {em:'🌾',label:'Break ground on your first fields',meta:'first of each kind is free',fn:closeModal},
