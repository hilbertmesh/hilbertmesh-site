<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>STONEHOLD</title>
<style>
  :root{--gold:#e7b24a;--gold-dk:#b9822b;--bg:#241a10;--ink:#f4e6c8;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;user-select:none;-webkit-user-select:none;}
  #game{position:fixed;inset:0;display:flex;flex-direction:column;}
  #tabs{display:flex;flex:0 0 auto;height:56px;background:#160f08;;padding-right:44px;}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:800;
    font-size:15px;background:linear-gradient(180deg,#f0e3bd,#ddc794);color:#4a3620;border-right:1px solid #b9822b55;
    font-family:Georgia,'Times New Roman',serif;text-shadow:0 1px 0 #fff8;border-bottom:3px solid #b9822b;}
  .tab.alt{background:linear-gradient(180deg,#eaddb4,#d5bf8c);}
  .tab.on{background:linear-gradient(180deg,#f6cf62,#d99b28);box-shadow:inset 0 -3px 0 #8a5f22,inset 0 2px 0 #ffe9ae;border-bottom-color:#8a5f22;}
  .tab.server{flex:0 0 84px;background:#160f08;color:var(--gold);flex-direction:column;gap:0;font-size:11px;}
  .tab.server b{font-size:15px;}
  #res{display:flex;flex:0 0 auto;height:60px;background:linear-gradient(180deg,#f2e4bf,#e0cb9b);border-bottom:3px solid #b9822b;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .rc{flex:1;display:flex;align-items:center;gap:6px;padding:0 5px;border-right:1px solid #b9822b40;}
  .rc canvas{width:26px;height:26px;flex:0 0 26px;}
  .rc .v{font-weight:800;font-size:16px;line-height:1;color:#3a2914;text-shadow:0 1px 0 #fff8;}
  .rc .r{font-size:11px;color:#3f7a26;line-height:1;margin-top:2px;font-weight:700;}
  #stageWrap{position:relative;flex:1 1 auto;overflow:hidden;background:#0c0906;}
  #stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  #hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:14px;color:#fff;
    text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none;font-weight:600;padding:0 12px;}
  #topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px;}
  .tb{background:linear-gradient(180deg,#fdf3d5 0%,#f2ddae 46%,#e3c98f 54%,#d5b878 100%);border:2px solid #b9822b;color:#5a3c14;
    border-radius:8px;padding:6px 9px;font-weight:800;font-size:13px;
    box-shadow:0 2px 0 #8a5f22,0 3px 4px #0004,inset 0 1px 0 #fffb,inset 0 -3px 5px #b9822b44;
    text-shadow:0 1px 0 #fff8;}
  .tb:active{transform:translateY(1px);box-shadow:0 1px 0 #8a5f22,inset 0 1px 0 #fffb;}
  #logbar{flex:0 0 auto;background:linear-gradient(180deg,#fdf6e0,#f2e6c6);border-top:3px solid #b9822b;
    font-size:12.5px;max-height:26px;overflow:hidden;transition:max-height .18s;}
  #logbar.open{max-height:320px;}
  #logLatest{padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#8a2f1f;font-weight:700;}
  #logList{display:none;overflow-y:auto;max-height:140px;padding:2px 10px 6px;}
  #logbar.open #logList{display:none;}
  #logbar.open #logLatest{border-bottom:1px solid #b9822b55;}
  #logChev{float:right;color:#8a5f22;font-weight:900;}
  #chatstub{display:none;padding:4px 10px 7px;color:#8a3a2a;font-size:11.5px;border-top:1px dashed #b9822b66;}
  #logbar.open #chatstub{display:block;}
  #chatWrap{display:none;}
  #logbar.open #chatWrap{display:block;}
  .chtab{padding:4px 9px;font-size:11px;font-weight:800;color:#5a3c14;background:#e3c98f;border:1px solid #b9822b;border-radius:6px 6px 0 0;cursor:pointer;}
  /* ── ENTRANCE SPLASH: covers the page-load flash with a proper title card ── */
  #splash{position:fixed;inset:0;z-index:9000;background:#050403;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #splashCv{position:absolute;inset:0;width:100%;height:100%;}
  #splashUI{position:relative;z-index:1;text-align:center;padding:20px;}
  #splashTitle{font-size:46px;font-weight:900;letter-spacing:6px;color:#e8bd5a;
    text-shadow:0 1px 0 #f8e7ae,0 3px 0 #7a5a1e,0 5px 2px #3a2a0c,0 8px 22px rgba(0,0,0,0.95);
    font-family:Georgia,'Times New Roman',serif;}
  #splashSub{margin-top:8px;font-size:16px;color:#cdbb92;font-style:italic;text-shadow:0 2px 8px rgba(0,0,0,0.95);}
  #splashSite{margin-top:4px;font-size:13px;font-weight:800;letter-spacing:2px;color:#a8873e;text-shadow:0 2px 6px rgba(0,0,0,0.9);font-family:Georgia,serif;}
  #splashEnter{margin-top:26px;padding:13px 44px;font-size:18px;font-weight:900;letter-spacing:2px;color:#3a2708;
    background:linear-gradient(180deg,#f2cd72,#c99a3a);border:2px solid #8a5f22;border-radius:10px;cursor:pointer;
    box-shadow:0 4px 0 #6b4a1a,0 8px 20px rgba(0,0,0,0.6);}
  #splashEnter:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a1a;}
  .chtab.on{background:#fffdf5;border-bottom-color:#fffdf5;}
  .chtab.pm{background:#f3d3e0;border-color:#d24d84;color:#8a2050;}
  .chtab.pm.on{background:#fff0f6;}
  .chatline{padding:2px 0;line-height:1.35;color:#1c140c;}   /* chat text must be DARK on the parchment */
  .chatline .who{font-weight:800;color:#8a5f22;}
  .chatline .bdg{font-size:9px;font-weight:900;border-radius:4px;padding:0 4px;margin-right:3px;vertical-align:1px;}
  .chatline .bdg.dev{background:#c0413a;color:#fff;}
  .chatline .bdg.founder{background:linear-gradient(180deg,#f2cd72,#b9822b);color:#3a2708;border:1px solid #8a5f22;}
  .chatline.sys{color:#3a6bd9;font-style:italic;}
  #chatstub .ch{background:#fff;border:1px solid #b9822b;border-radius:4px;padding:0 7px;margin-right:6px;color:#4a3620;font-weight:800;}
  .lg{padding:2px 0;line-height:1.35;}
  .lg .t{color:#8a7a55;font-size:10.5px;margin-right:5px;}
  .lg.system{color:#b3382a;} .lg.battle{color:#7a1f1f;font-weight:700;}
  .lg.scout{color:#1f4d7a;} .lg.done{color:#3f6d28;} .lg.world{color:#4a3620;}
  .lg.whisper{color:#7a3fa0;font-style:italic;}   /* private messages — purple, of course */
  #wallBtn{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:linear-gradient(180deg,#f4e7c2,#dfc893);
    border:2px solid #b9822b;color:#5a3c14;border-radius:8px;padding:7px 16px;font-weight:800;display:none;
    box-shadow:0 2px 0 #8a5f22,inset 0 1px 0 #fff8;font-family:Georgia,serif;}
  #tier{position:absolute;top:8px;left:8px;background:linear-gradient(180deg,#f4e7c2,#dfc893);border:2px solid #b9822b;color:#5a3c14;
    border-radius:8px;padding:4px 9px;font-size:11px;font-weight:800;box-shadow:0 2px 0 #8a5f22;}
  #stageWrap{border-left:7px solid;border-right:7px solid;
    border-image:linear-gradient(180deg,#e2bd6d,#b9822b 30%,#8a5f22 90%) 1;}
  #shop{position:absolute;inset:0;display:none;overflow:auto;padding:16px;background:linear-gradient(180deg,#3a2c18,#241a10);}
  #shop h2{color:var(--gold);text-align:center;margin:2px;} #shop .sub{text-align:center;color:#d8b98a;font-size:13px;margin-bottom:12px;}
  #wheel{width:240px;height:240px;border-radius:50%;border:7px solid var(--gold-dk);display:block;margin:0 auto;}
  .shopSec{margin:16px 8px 6px;font-weight:800;color:#e7b24a;border-bottom:1px solid #b9822b55;padding-bottom:4px;}
  #spinBtn{display:block;margin:12px auto;background:#d24d84;color:#fff;border:none;border-radius:10px;padding:12px 40px;font-weight:800;font-size:17px;}
  .card{background:#f3e6c8;color:#3a2610;border-radius:12px;padding:14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;}
  #dock{flex:0 0 auto;height:78px;background:linear-gradient(180deg,#e9dcbd,#d6c49c);display:flex;gap:8px;padding:8px;overflow-x:auto;}
  .slot{flex:0 0 150px;border:2px dashed #a98f5f;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#8a7245;font-weight:700;font-size:13px;}
  .slot.act{background:#fff8e6;border-style:solid;color:#3a2610;flex-direction:column;gap:2px;}
  .slot.act .t{font-size:11px;color:#b06a2a;font-weight:800;} .slot.act .bar{width:88%;height:6px;background:#d8c49a;border-radius:3px;overflow:hidden;margin-top:3px;}
  .slot.act .bar>i{display:block;height:100%;background:#3a8a3a;}
  #scrim{position:absolute;inset:0;background:#000a;display:none;z-index:40;}
  #modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,380px);max-height:80%;overflow:auto;
    background:linear-gradient(180deg,#f6ecd0,#e4d0a6);color:#3a2610;border-radius:12px;padding:16px;display:none;z-index:41;
    box-shadow:0 12px 40px #000a;border:3px solid #b9822b;outline:2px solid #e7c87e;outline-offset:-7px;}
  #modal h3{margin:0 0 10px;font-family:Georgia,'Times New Roman',serif;text-align:center;
    border-bottom:2px solid #b9822b;padding-bottom:7px;color:#4a2f10;text-shadow:0 1px 0 #fff8;} .opt{display:flex;align-items:center;gap:10px;padding:11px;background:#fff8e6;
    border:1px solid #cdb488;border-radius:10px;margin-bottom:8px;font-weight:700;}
  .opt .em{font-size:22px;width:26px;text-align:center;} .opt .meta{margin-left:auto;font-size:12px;color:#8a6a2a;text-align:right;}
  .opt.dis{opacity:.5;} #mClose{width:100%;padding:11px;border:none;border-radius:10px;background:#3a2c18;color:var(--gold);font-weight:800;margin-top:4px;}
  #toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 18px;
    border-radius:20px;font-weight:700;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:82%;text-align:center;}
  [data-skip],#devBtn,#dbgBtn{outline:2px solid #c0413a;outline-offset:-2px;background:linear-gradient(180deg,#e8c7a0,#d09a6a)!important;}
</style>

<div id="splash">

<!-- BACK TO HILBERT MESH (tan parchment, matches Stonehold GUI) -->
<button id="backToSite" title="Back to Hilbert Mesh" style="position:fixed;top:6px;right:6px;z-index:99999;
width:34px;height:34px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(180deg,#fdf3d5,#e3c98f);color:#5a3c14;
border:2px solid #b9822b;border-radius:8px;padding:0;
font-family:Georgia,serif;font-weight:800;font-size:16px;line-height:1;
box-shadow:0 2px 0 #8a5f22,0 2px 4px #0005,inset 0 1px 0 #fffb;
text-shadow:0 1px 0 #fff8;cursor:pointer;opacity:.9;
transition:opacity .18s,box-shadow .18s;">⨉</button>
<button id="resetSave" title="Reset your save (safe)" style="display:none;position:fixed;top:6px;right:46px;z-index:99999;
width:34px;height:34px;display:none;align-items:center;justify-content:center;
background:linear-gradient(180deg,#fdf3d5,#e3c98f);color:#8a3a2a;

<script>(function(){var rb=document.getElementById('resetSave');if(!rb)return;
rb.onclick=function(){ if(!confirm('Reset your save? This wipes your LOCAL game and starts fresh. If you are online, your server progress reloads instead. No cheating — this just clears a stuck save.'))return;
  try{localStorage.removeItem('stonehold_v2');}catch(e){}
  location.reload();};})();</script>
<script>(function(){var b=document.getElementById('backToSite');if(!b)return;
b.addEventListener('touchstart',function(){b.style.opacity='1';},{passive:true});
b.addEventListener('mouseenter',function(){b.style.opacity='1';b.style.boxShadow='0 2px 0 #8a5f22,0 4px 8px #0006,inset 0 1px 0 #fffb';});
b.addEventListener('mouseleave',function(){b.style.opacity='.92';b.style.boxShadow='0 2px 0 #8a5f22,0 3px 5px #0005,inset 0 1px 0 #fffb';});
b.addEventListener('click',function(){b.style.opacity='.5';
setTimeout(function(){window.location.href='index.html';},350);});})();</script>

<script>
/* ===================== STONEHOLD — Town v2 (canvas iso engine) ===================== */
/* ---- debug console: captures errors + actions, exports to .txt ---- */
const DBG={buf:[],max:800,
  log(type,msg){this.buf.push({t:new Date().toISOString().slice(11,23),type,msg:String(msg)});if(this.buf.length>this.max)this.buf.shift();},
  download(){try{
    const lines=this.buf.map(e=>`[${e.t}] ${e.type}: ${e.msg}`).join('\n');
    const head='STONEHOLD DEBUG LOG\n'+new Date().toString()+'\nUA: '+navigator.userAgent+
      '\nviewport: '+innerWidth+'x'+innerHeight+' dpr='+(devicePixelRatio||1)+
      '\nview: '+(typeof view!=='undefined'?view:'?')+'  render: code-art (no image files)'+
      '\n\n=== RENDER DIAGNOSTICS ===\n'+
      'zoom: '+(typeof zoom!=='undefined'?zoom.toFixed(2):'?')+
      '\nwallTier: '+(typeof S!=='undefined'?S.wall:'?')+'   thLevel: '+(typeof S!=='undefined'?S.thLevel:'?')+
      '\ncityBuildings: '+(typeof S!=='undefined'?Object.keys(S.city||{}).length:'?')+'   resourceNodes: '+(typeof S!=='undefined'?Object.keys(S.nodes||{}).length:'?')+
      '\nqueue: '+(typeof S!=='undefined'?(S.queue||[]).length:'?')+'   hotspots(lastFrame): '+(typeof hots!=='undefined'?hots.length:'?')+
      '\nmapDecor: '+(typeof mapdecor!=='undefined'&&mapdecor?mapdecor.length:'0')+'   npcs: '+(typeof npcs!=='undefined'&&npcs?npcs.length:'0')+
      '\ncanvas: '+(typeof VW!=='undefined'?VW+'x'+VH:'?')+' @dpr'+(typeof DPR!=='undefined'?DPR:'?')+
      '\n\n=== STATE ===\n'+JSON.stringify(typeof S!=='undefined'?S:{},null,1)+'\n\n=== EVENT LOG ('+this.buf.length+') ===\n'+lines;
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([head],{type:'text/plain'}));
    a.download='stonehold-debug-'+Date.now()+'.txt';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
    if(typeof toast==='function')toast('Debug log downloaded 🐛');
  }catch(err){alert('Debug export failed: '+err);}}
};
addEventListener('error',e=>DBG.log('JS-ERROR',(e.message||'')+' @'+((e.filename||'').split('/').pop())+':'+(e.lineno||'')+':'+(e.colno||'')));
addEventListener('unhandledrejection',e=>DBG.log('PROMISE-REJECT',(e.reason&&e.reason.message)||e.reason));
(function(){const _e=console.error;console.error=function(){DBG.log('console.error',[].join.call(arguments,' '));_e.apply(console,arguments);};})();

/* ================= CODE-DRAWN ART (no image files) ================= */
/* Evony Age-1/2 look: warm soft-lit palette, gabled houses (not tents),   */
/* warm outlines (never pure black), terrain backdrops, level badges.      */
let ATLAS_OK=true;                                   // guards throughout expect this
var _renderFails=0, _renderErrLogged=false, lastSave=Date.now();
var _loopBeat=Date.now();   // loop-state vars (declared before loop starts)
requestAnimationFrame(()=>loop());                    // kick the render loop (atlas used to)

const OUT='rgba(60,44,30,0.34)';                      // warm dark outline (never black)
function shade(c,f){return 'rgb('+(c[0]*f|0)+','+(c[1]*f|0)+','+(c[2]*f|0)+')';}
function poly(pts,fill,stroke,lw){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke!==null){ctx.strokeStyle=stroke||OUT;ctx.lineWidth=lw||1;ctx.stroke();}}
function softShadow(cx,cy,fw,fh){ctx.save();ctx.globalAlpha=.16;ctx.beginPath();
  ctx.ellipse(cx,cy,fw*1.02,fh*1.02,0,0,7);ctx.fillStyle='#000';ctx.fill();ctx.restore();}

/* ---- texture helpers (the sculpt toolkit) ---- */
/* GRAIN: seeded (no shimmer) speck pattern, anchored per-face so it pans with buildings.
   Kills the flat solid-color vector look — the #1 Evony de-blocker. */
const GRAIN=(function(){const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');let s=1234567;const rnd=()=>((s=(s*16807)%2147483647)/2147483647);
  const img=g.createImageData(64,64);
  for(let i=0;i<img.data.length;i+=4){const v=rnd();
    const l=v<0.5?0:255;img.data[i]=img.data[i+1]=img.data[i+2]=l;
    img.data[i+3]=(rnd()*26)|0;}                     // specks ≤10% alpha, light+dark mix
  g.putImageData(img,0,0);return c;})();
let GRAIN_PAT=null;
function grain(pts,a){                               // clip to face, stipple, anchored to face bbox
  if(!GRAIN_PAT){try{GRAIN_PAT=ctx.createPattern(GRAIN,'repeat');}catch(e){return;}}
  if(!GRAIN_PAT)return;
  let mx=1e9,my=1e9,Mx=-1e9,My=-1e9;
  for(const p of pts){if(p[0]<mx)mx=p[0];if(p[1]<my)my=p[1];if(p[0]>Mx)Mx=p[0];if(p[1]>My)My=p[1];}
  if((Mx-mx)*(My-my)<60)return;                      // tiny faces: texture is invisible, skip the work
  ctx.save();ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();ctx.clip();
  ctx.globalAlpha=(a===undefined?0.55:a);

/* backdrop grounds (code-drawn, improve each pass; painterly image can slot in later) */
function bgCover(type,top){top=top||0;
  const full=[[0,top],[VW,top],[VW,VH],[0,VH]];
  if(type==='dirt'){const g=ctx.createLinearGradient(0,top,0,VH);g.addColorStop(0,'#b79a63');g.addColorStop(1,'#9c7f4c');
    ctx.fillStyle=g;ctx.fillRect(0,top,VW,VH-top);grain(full,0.85);return;}
  // warm grass field (town) — two-tone soft gradient + faint iso lattice
  const g=ctx.createLinearGradient(0,top,0,VH);
  g.addColorStop(0,'#8aa550');g.addColorStop(1,'#6f8f40');ctx.fillStyle=g;ctx.fillRect(0,top,VW,VH-top);
  ctx.save();ctx.globalAlpha=0.06;ctx.strokeStyle='#3d5222';ctx.lineWidth=1;
  const S=46;for(let x=-VH;x<VW;x+=S){ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x+VH,VH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,VH);ctx.lineTo(x+VH,top);ctx.stroke();}ctx.restore();
  grain(full,0.75);
}
function mapGround(){const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#7f9a52');g.addColorStop(1,'#6a8443');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.globalAlpha=0.05;ctx.strokeStyle='#3d5222';ctx.lineWidth=1;const S=54;
  for(let x=-VH;x<VW;x+=S){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+VH,VH);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,VH);ctx.lineTo(x+VH,0);ctx.stroke();}ctx.restore();
  grain([[0,0],[VW,0],[VW,VH],[0,VH]],0.75);}

function migrateCities(s){

  // Wrap the single legacy base into cities['home'].
  const home={};for(const k of CITY_KEYS)home[k]=s[k];
  if(!home.jobs)home.jobs={};   // per-castle hotel staff (new in beta)
  home.name='Home Stonehold'; home.x=(s.home&&s.home.x)||512; home.y=(s.home&&s.home.y)||512;
  s.cities={home}; s.activeCity='home';
}

function transportTo(destId){
  const dest=S.cities[destId];if(!dest)return;
  const rk=prompt('Which resource? (food/wood/stone/iron/gold)','gold');
  if(!rk||!(rk in (S.res||{}))){toast('Pick food, wood, stone, iron or gold');return;}
  const have=Math.round(S.res[rk]||0);
  const inp=prompt('Ship how much '+rk+'? (you have '+fmt(have)+')',String(Math.floor(have/2)));
  if(!inp)return;const amt=Math.max(1,Math.min(have,Math.floor(parseInt(inp)||0)));if(!amt)return;
  // ── CARAVAN GUARDS: the road is not safe. Bandits hit ~20% of unguarded
  // wagons; every sword or bow riding shotgun cuts the odds. Guards return home
  // when the wagons arrive. ──
  const gAvail=(S.army.sword||0)+(S.army.archer||0);
  let guards=0;
  if(gAvail>0){const gi=prompt('Caravan guards? (0–'+gAvail+' · each guard lowers raid risk)','0');
    guards=Math.max(0,Math.min(gAvail,Math.floor(parseInt(gi||'0')||0)));}
  const risk=Math.max(0.03,0.20-guards*0.0015);
  // pull guards from the garrison (swords first, then archers) for the trip
  let gs=Math.min(guards,S.army.sword||0);S.army.sword-=gs;
  let ga=Math.min(guards-gs,S.army.archer||0);S.army.archer-=ga;
  // duration: distance × cargo. Millions of gold = a long, slow horse-and-carriage line.
  const homeC=activeCityObj();const dist=Math.hypot((dest.x-homeC.x),(dest.y-homeC.y));
  const dur=Math.max(60,Math.round((dist*14/300)*60 + amt/5000))*1000;
  S.res[rk]-=amt;
  if(!S.transports)S.transports=[];
  S.transports.push({id:'x'+Date.now(),to:destId,rk,amt,guards,gs,ga,arrive:Date.now()+dur});
  save();renderRes();
  toast('🐎 Caravan away: '+fmt(amt)+' '+rk+' → '+(dest.name||destId)+' · '+fmtTime(dur/1000)+' · raid risk '+(risk*100).toFixed(0)+'%');
  addLog('system','Caravan: '+fmt(amt)+' '+rk+' to '+(dest.name||destId)+' · '+guards+' guards ('+fmtTime(dur/1000)+')');}
function tickTransports(){if(!S.transports||!S.transports.length)return;const now=Date.now();let changed=false;
  for(const t of S.transports){if(t.done)continue;if(now>=t.arrive){t.done=true;changed=true;
    // deterministic bandit roll (hash of the caravan id — reloading can't re-roll fate)
    const roll=(hashKey(t.id+'r')%1000)/1000;
    const risk=Math.max(0.03,0.20-(t.guards||0)*0.0015);
    let arriving=t.amt, gsBack=t.gs||0, gaBack=t.ga||0;
    if(roll<risk){ // RAIDED on the road — guards fight for the wagons
      const saved=Math.min(0.8,(t.guards||0)/400);            // enough steel saves most of it
      const lost=Math.round(t.amt*0.45*(1-saved));
      arriving=t.amt-lost;
      gsBack=Math.round(gsBack*0.8); gaBack=Math.round(gaBack*0.8);   // guard losses
      addLog('battle','🏴 Caravan RAIDED on the road! Lost '+fmt(lost)+' '+t.rk+((t.guards||0)>0?' — the guards saved the rest':' — hire guards next time'));
    }
    S.army.sword=(S.army.sword||0)+gsBack; S.army.archer=(S.army.archer||0)+gaBack;   // survivors ride home
    const dc=S.cities&&S.cities[t.to];if(dc){dc.res[t.rk]=(dc.res[t.rk]||0)+arriving;
      // if the destination is the active city, reflect immediately
      if(t.to===S.activeCity)S.res[t.rk]=dc.res[t.rk];
      addLog('done','Caravan arrived at '+(dc.name||t.to)+': +'+fmt(arriving)+' '+t.rk);}}}
  if(changed){S.transports=S.transports.filter(t=>!t.done);save();renderRes();}}

function rates(){const m=tierMult().mult;const r={food:0,wood:0,stone:0,iron:0,gold:0};
  r.food+=200;r.wood+=160;
  for(const k in S.nodes){const nd=S.nodes[k],d=NODE[nd.type];if(d)r[d.gives]+=d.rate*(nd.lv||1);}
  let pop=0;
  for(const k in S.city){const b=S.city[k];const cd=CITY[b.type];
    if(cd&&cd.gold)r.gold+=cd.gold*(b.lv||1);
    if(b.type==='market')r.gold+=60*(b.lv||1);
    if(b.type==='cottage')pop+=cottagePop(b.lv||1);
    if(b.type==='tartarian')pop+=tartarianPop(b.lv||1);}
  // Tartarian jobs: chefs & loggermen sweat, gem traders sell
  const J=S.jobs||{};
  r.food*= 1+Math.min(0.5,(J.chefs||0)/100*0.02);
  r.wood *=1+Math.min(0.5,(J.loggermen||0)/100*0.02);
  r.stone*=1+Math.min(0.5,(J.loggermen||0)/100*0.02);
  r.gold+=Math.floor((J.gemtraders||0)/100)*40;
  r.gold+=Math.round(pop*(S.tax||0)/100*0.6);                          // the taxman
  const pm=prodBuffMult()*(1+techBonus('prod')); if(pm!==1)for(const k in r)r[k]=Math.round(r[k]*pm); // buffs + Agriculture research
  if((S.tax||0)>50){const pen=Math.max(0.3,1-((S.tax-50)/100)*1.4);    // grumbling peasants work less
    r.food=Math.round(r.food*pen);r.wood=Math.round(r.wood*pen);
    r.stone=Math.round(r.stone*pen);r.iron=Math.round(r.iron*pen);}
  for(const q in r)r[q]*=m; return r;}
function cap(){let c=100000+(S.thLevel||0)*15000;                     // the Hall's cellars grow too
  for(const k in S.city){const b=S.city[k];if(b.type==='warehouse')c+=whStore(b.lv||1);}return c;}
function applyElapsed(){const now=Date.now();const h=(now-S.t)/3.6e6;if(h>0){const r=rates();
  for(const k in r)S.res[k]=Math.min(cap(),Math.round((S.res[k]||0)+r[k]*h));}S.t=now;}
function afford(c){for(const k in c)if((S.res[k]||0)<c[k])return false;return true;}
function pay(c){if(!afford(c))return false;for(const k in c)S.res[k]-=c[k];return true;}
function costStr(c){return Object.entries(c).map(([k,v])=>v+' '+k).join(' · ');}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),ss=s%60;const h=Math.floor(m/60);
  if(h)return h+'h '+(m%60)+'m';if(m)return m+'m '+ss+'s';return ss+'s';}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':''+n;}

/* ===================== BUILD QUEUE ===================== */
function enqueue(job){ // job:{kind,slot,type,dur,label}
  if(S.queue.length>=queueMax()){toast('Build queue full'+(queueMax()<2?' — members get a 2nd slot':''));return false;}
  // Member build-speed perk (convenience only): shave time off construction.
  const bs=tierMult().buildSpeed||0; if(bs>0&&job.dur)job.dur=Math.max(5,Math.round(job.dur*(1-bs)));
  // Tartarian Architects: every 100 assigned = -1% build time (cap -25%)
  const BUILD_KINDS={city:1,node:1,'up-city':1,'up-node':1,wall:1,th:1,tart:1};
  if(BUILD_KINDS[job.kind]&&job.dur){const arch=Math.min(0.25,Math.floor((effJobs().architects||0)/100)*0.01);
    if(arch>0)job.dur=Math.max(5,Math.round(job.dur*(1-arch)));}
  job.end=Date.now()+job.dur*1000; S.queue.push(job); save(); renderDock(); toast(job.label+' started · '+fmtTime(job.dur)); return true;}
function processQueue(){let ch=false;const now=Date.now();
  S.queue=S.queue.filter(j=>{ if(now>=j.end){ complete(j); ch=true; return false;} return true;});
  if(ch){save();renderDock();renderRes();}}
function complete(j){
  if(j.kind==='city') S.city[j.slot]={type:j.type,lv:1};
  else if(j.kind==='node') S.nodes[j.slot]={type:j.type,lv:1};
  else if(j.kind==='up-city'){const b=S.city[j.slot];if(b)b.lv=Math.min(MAXLV,(b.lv||1)+1);questBump('build',1);}
  else if(j.kind==='up-node'){const b=S.nodes[j.slot];if(b)b.lv=Math.min(MAXLV,(b.lv||1)+1);questBump('build',1);}
  else if(j.kind==='wall'){S.wall=Math.min(WALL_MAX,S.wall+1);questBump('build',1);}
  else if(j.kind&&j.kind.slice(0,5)==='tech-'){const tk=j.kind.slice(5);if(!S.research)S.research={};S.research[tk]=(S.research[tk]||0)+1;addLog('done',(TECH[tk]?TECH[tk].name:tk)+' Lv '+S.research[tk]+' researched');}
  else if(j.kind==='th'){S.thLevel=Math.min(TH_MAX,S.thLevel+1);questBump('build',1);}
  else if(j.kind==='tart'){const ks=tartNeighbors(String(j.slot))||[];
    for(const k2 of ks)S.city[k2]=(k2===String(j.slot))?{type:'tartarian',lv:1}:{type:'tgrounds',lv:1};
    if(!S.jobs)S.jobs={};questBump('build',1);
    addLog('done','🏛️ THE TARTARIAN GRAND HOTEL RISES — nine roofs became one wonder');}
  else if(j.kind==='gh'){S.thLevel=1;toast('🏛️ The Grand Hall stands! Your stronghold is founded.');}
  else if(j.kind==='train') S.army.sword+=j.n;
  else if(j.kind==='train-scout') S.scouts+=j.n;
  else if(j.kind&&j.kind.slice(0,6)==='train-'&&UNITS[j.kind.slice(6)]) S.army[j.kind.slice(6)]+=j.n;
  DBG.log('done',j.kind+' '+(j.type||'')+' @'+(j.slot||''));
  toast(j.label+' complete!');addLog('done',j.label+' complete');
}

/* ===================== CANVAS / ISO ===================== */
let view='town';
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let DPR=Math.min(devicePixelRatio||1,2),VW=0,VH=0;
function fit(){VW=cv.clientWidth;VH=cv.clientHeight;cv.width=VW*DPR;cv.height=VH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);ctx.imageSmoothingEnabled=true;}
addEventListener('resize',fit);
let hots=[];function hot(x,y,r,fn){hots.push({x,y,r,fn});}

/* iso grid config: 5x5, center = town hall, 24 build cells (16 unlocked, 8 corners locked) */
const N=5, CENTER=2;
function isoTW(){return Math.max(58,Math.min(112, VW*0.86*2/(N+1)))*zoom;}
function cellScreen(c,r){const TW=isoTW(),TH=TW/2;const ox=VW/2+cams.town.x, oy=VH*0.34+cams.town.y;
  return{x:ox+(c-r)*TW/2, y:oy+(c+r)*TH/2, TW, TH};}
/* ── TOWN CAMERA ROTATION (RuneScape-style, 4 angles) ─────────────────────
   Pure view remap around the town center: state keys never change, only where
   each tile is DRAWN. Walls & paving are square (rotation-invariant); the
   districts outside stay put on the grass. */
let ROT=parseInt(localStorage.getItem('hm_rot')||'0')||0;
function rotCR(c,r){const dx=c-CENTER,dy=r-CENTER;
  return ROT===1?[CENTER-dy,CENTER+dx]:ROT===2?[CENTER-dx,CENTER-dy]:ROT===3?[CENTER+dy,CENTER-dx]:[c,r];}
function rotCell(c,r){const q=rotCR(c,r);return cellScreen(q[0],q[1]);}
function rotDepth(c,r){const q=rotCR(c,r);return q[0]+q[1];}
function rotateTown(){ROT=(ROT+1)%4;localStorage.setItem('hm_rot',String(ROT));
  if(view==='town'){ctx.clearRect(0,0,VW,VH);renderTown();}
  toast('🧭 View: '+['SOUTH','WEST','NORTH','EAST'][ROT]+' face');}
function cornerLocked(c,r){return (c===0||c===N-1)&&(r===0||r===N-1);} // 4 corners... add 4 edge-mids for 8
/* ── TOWN DISTRICTS ────────────────────────────────────────────────────────
   Grand Hall 12+ opens ORGANIZED quarters on the grass outside the walls —
   proper sections, not scattered plots. Any building can stand in them.
   · ARTISAN ROW  (below the gate): 6 plots, TH12 → TH17
   · GARRISON YARD (east flank):    6 plots, TH18 → TH21 (2 per tier)
   · TARTARIAN GROUNDS (far field): the FINAL unlock at TH22 — a dedicated
     3×3 block that accepts only cottages; complete all nine (any tier!) and
     the center raises the Grand Hotel. Newbies see none of this. */
function outskirtCount(){return S.thLevel>=12?Math.min(12,S.thLevel>=18?6+(S.thLevel-17)*2:S.thLevel-11):0;}
const OUTSKIRT_POS=[ // Artisan Row: clean 2×3 below the front gate
  [0.5,6.0],[1.75,6.0],[3.0,6.0],[0.5,7.25],[1.75,7.25],[3.0,7.25],
  // Garrison Yard: clean 3×2 off the east wall
  [6.4,0.6],[7.65,0.6],[6.4,1.85],[7.65,1.85],[6.4,3.1],[7.65,3.1]];
function outskirtScreen(i){const P=OUTSKIRT_POS[i];return cellScreen(P[0],P[1]);}
function tartOpen(){return S.thLevel>=22;}   // the last district — endgame ground
const TART_POS=[];for(let tr=0;tr<3;tr++)for(let tc=0;tc<3;tc++)TART_POS.push([6.4+tc*1.25,5.6+tr*1.25]);
function tartScreen(i){const P=TART_POS[i];return cellScreen(P[0],P[1]);}
function slotKey(c,r){return c+'_'+r;}

function drawDiamond(cx,cy,TW,TH,fill,stroke,lw){ctx.save();ctx.beginPath();
  ctx.moveTo(cx,cy-TH/2);ctx.lineTo(cx+TW/2,cy);ctx.lineTo(cx,cy+TH/2);ctx.lineTo(cx-TW/2,cy);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1.5;ctx.stroke();}ctx.restore();}

/* ---- Evony-style town walls (tier-scaled, drawn in two depth passes) ---- */
function wallSeg(A,B,h,stone,tier){
  const At=[A[0],A[1]-h],Bt=[B[0],B[1]-h];
  gfill([A,B,Bt,At],stone,0.96,0.72);
  courses([A,B,Bt,At],3,'rgba(50,38,26,0.16)');
  // parapet walk: a lighter capping strip along the top (walls have a top, not just an edge)
  const cap=h*0.14;
  poly([At,Bt,[Bt[0],Bt[1]+cap],[At[0],At[1]+cap]],shade(stone,1.10),null);
  ctx.strokeStyle=shade(stone,1.22);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(At[0],At[1]);ctx.lineTo(Bt[0],Bt[1]);ctx.stroke();
  // battered footing: heavy shadow where the wall meets the ground
  ctx.strokeStyle='rgba(28,20,12,0.32)';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(A[0],A[1]-1);ctx.lineTo(B[0],B[1]-1);ctx.stroke();
  // buttress rhythm: shallow vertical shadow ribs break the long flat ribbon
  const len=Math.hypot(B[0]-A[0],B[1]-A[1]);const rib=Math.max(2,Math.round(len/60));
  ctx.strokeStyle='rgba(40,30,18,0.14)';ctx.lineWidth=3;
  for(let i=1;i<rib;i++){const t=i/rib;
    ctx.beginPath();ctx.moveTo(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t-1);
    ctx.lineTo(At[0]+(Bt[0]-At[0])*t,At[1]+(Bt[1]-At[1])*t+cap);ctx.stroke();}
  if(tier>=2){ctx.fillStyle=shade(stone,1.03);const n=Math.max(4,Math.round(len/15));
    for(let i=0;i<=n;i+=2){const t=i/n;const p=[At[0]+(Bt[0]-At[0])*t,At[1]+(Bt[1]-At[1])*t];ctx.fillRect(p[0]-2.5,p[1]-7,5,7);}}}
function townWalls(when){const vt=wallStage(S.wall);
  if(vt===0){                                                        // Stage 0: bare stone slab boundary
    const h0=9*zoom, sl=[186,182,170];
    const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
          fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
    const slab=(A,B)=>{const At=[A.x,A.y-h0],Bt=[B.x,B.y-h0];
      gfill([[A.x,A.y],[B.x,B.y],Bt,At],sl,1.0,0.80);
      poly([At,Bt,[Bt[0],Bt[1]+h0*0.22],[At[0],At[1]+h0*0.22]],shade(sl,1.12),null);
      ctx.strokeStyle='rgba(28,20,12,0.28)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(A.x,A.y-1);ctx.lineTo(B.x,B.y-1);ctx.stroke();};
    if(when==='back'){slab(lf,bk);slab(bk,rt);}else{slab(lf,fr);slab(fr,rt);}
    return;}
  // Stages 1-8: palisade → fieldstone → cut stone → white citadel walls
  const h=(14+vt*6)*zoom;
  const stone= vt<=1? [150,120,86] : vt<=4? [170,166,154] : vt<=6? [186,182,170] : [202,198,188];
  const tRoof= vt<=1? [110,80,50] : vt<=5? [120,90,64] : [86,104,152];   // slate crowns at stage 6+
  const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
        fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
  const ts=isoTW()*0.5, tall=vt>=7?1.5:vt>=5?1.25:1.0;
  const twr=(P,flag)=>tower(P.x,P.y,ts*0.42,ts*0.21,(h+ts*0.18)*tall,ts*0.5,stone,tRoof,{crenel:vt>=2,flag:flag});
  const stdFlag=vt>=7?'#f0c23a':'#c0413a';
  if(when==='back'){
    wallSeg([lf.x,lf.y],[bk.x,bk.y],h,stone,vt);
    wallSeg([bk.x,bk.y],[rt.x,rt.y],h,stone,vt);
    twr(bk,stdFlag); twr(rt,vt>=8?stdFlag:undefined);
  }else{
    wallSeg([lf.x,lf.y],[fr.x,fr.y],h,stone,vt);
    wallSeg([fr.x,fr.y],[rt.x,rt.y],h,stone,vt);
    twr(lf,vt>=8?stdFlag:undefined); twr(fr,'#f0c23a');
    ctx.fillStyle='#1c140c';ctx.beginPath();ctx.ellipse(fr.x,fr.y-h*0.2,ts*0.13,ts*0.19,0,0,7);ctx.fill(); // gate arch
    if(vt>=6){ // gilded gate ring — the citadel's front door earns gold
      ctx.strokeStyle='#e7b24a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(fr.x,fr.y-h*0.2,ts*0.13,ts*0.19,0,0,7);ctx.stroke();}
  }}

/* Your Stonehold as a walled compound — same wall tier + TH level as the town view,
   so FIELDS and MAP show the *actual* castle progression, not a generic keep. */
function drawStonehold(cx,cy,w){
  if(!S.thLevel){ softShadow(cx,cy+w*0.13,w*0.5,w*0.25); foundation(cx,cy-w*0.08,w*0.9); return; }
  const vt=wallStage(S.wall), fw=w*0.52, fh=fw*0.5, h=w*(0.05+0.020*Math.max(1,vt));
  const pN=[cx,cy-fh],pE=[cx+fw,cy],pS=[cx,cy+fh],pW=[cx-fw,cy];
  const up=(p)=>[p[0],p[1]-h];
  const stone= vt===0? [186,182,170] : vt<=1? [150,120,86] : vt<=4? [170,166,154] : vt<=6? [186,182,170] : [202,198,188];
  const tRoof= vt<=1? [110,80,50] : vt<=5? [120,90,64] : [86,104,152];
  softShadow(cx,cy+fh*0.15,fw*1.05,fh*1.05);
  gfill([pN,pE,pS,pW],[187,178,158],1.0,0.88,null);                   // cobble courtyard
  const seg=(A,B)=>{gfill([A,B,up(B),up(A)],stone,0.96,0.72);courses([A,B,up(B),up(A)],2,'rgba(50,38,26,0.16)');
    if(vt>=2){ctx.fillStyle=shade(stone,1.03);const n=6;for(let i=0;i<=n;i+=2){const t=i/n;
      const p=[up(A)[0]+(up(B)[0]-up(A)[0])*t,up(A)[1]+(up(B)[1]-up(A)[1])*t];ctx.fillRect(p[0]-1.6,p[1]-4.5,3.2,4.5);}}};
  const ts=w*0.16, tall=vt>=7?1.4:vt>=5?1.2:1.0;
  const twr=(P,flag)=>{if(vt===0)return;tower(P[0],P[1],ts*0.42,ts*0.21,(h+ts*0.30)*tall,ts*0.5,stone,tRoof,{crenel:vt>=2,flag});};
  seg(pW,pN); seg(pN,pE); twr(pN);                                    // back walls (+ towers from Stage 1)
  draw(ID.th[thStage(S.thLevel)]||'th1', cx, cy+fh*0.44, w*0.55);     // the actual town hall, true center
  seg(pW,pS); seg(pS,pE); twr(pW); twr(pE); twr(pS,vt>=7?'#f0c23a':'#c0413a');  // front walls + towers
  ctx.fillStyle='#1c140c';ctx.beginPath();                            // gate on the front corner
  ctx.ellipse(pS[0],pS[1]-h*0.25,w*0.035,h*0.42,0,0,7);ctx.fill();
}

function renderTown(){
  hots=[];
  bgCover('grass');   // warm grass beyond the paving, every wall tier
  // Evony town interior = cobble paving inside the wall ring (grass stays outside)
  {const bk=cellScreen(-0.65,-0.65), rt=cellScreen(N-1+0.65,-0.65),
        fr=cellScreen(N-1+0.65,N-1+0.65), lf=cellScreen(-0.65,N-1+0.65);
   const pav=[[bk.x,bk.y],[rt.x,rt.y],[fr.x,fr.y],[lf.x,lf.y]];
   gfill(pav,[187,178,158],1.0,0.9,null);           // warm gray-tan paving + grain via gfill
   grain(pav,0.6);                                   // extra grime so cobble reads dirtier than grass
   ctx.save();ctx.beginPath();ctx.moveTo(pav[0][0],pav[0][1]);
   for(let i=1;i<4;i++)ctx.lineTo(pav[i][0],pav[i][1]);ctx.closePath();ctx.clip();
   ctx.globalAlpha=0.10;ctx.strokeStyle='#4a3c28';ctx.lineWidth=1;   // faint cobble seams (iso lattice)
   const st=isoTW()*0.25, cxm=(bk.x+fr.x)/2, W2=Math.abs(rt.x-lf.x);
   for(let k=-Math.ceil(W2/st);k<=Math.ceil(W2/st);k++){const off=k*st;
     ctx.beginPath();ctx.moveTo(cxm+off-W2,bk.y-W2*0.5);ctx.lineTo(cxm+off+W2,bk.y+W2*0.5);ctx.stroke();  // NE-parallel
     ctx.beginPath();ctx.moveTo(cxm+off+W2,bk.y-W2*0.5);ctx.lineTo(cxm+off-W2,bk.y+W2*0.5);ctx.stroke();} // NW-parallel
   ctx.restore();}
  // ── DISTRICTS (TH12+): organized quarters that ROTATE with the camera ──
  const OC=outskirtCount();
  const distLabel=(txt,x,y)=>{ctx.font='800 '+Math.max(9,isoTW()*0.11)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(30,22,10,0.75)';ctx.lineWidth=3;ctx.strokeText(txt,x,y);ctx.fillStyle='#f2e6c4';ctx.fillText(txt,x,y);};
  const plate=(posArr,from,to)=>{ // one soft ground plate under a district (rotation-aware)
    let mx=1e9,my=1e9,Mx=-1e9,My=-1e9;
    for(let i=from;i<to;i++){const p=rotCell(posArr[i][0],posArr[i][1]);
      mx=Math.min(mx,p.x);Mx=Math.max(Mx,p.x);my=Math.min(my,p.y);My=Math.max(My,p.y);}
    const cxp=(mx+Mx)/2,cyp=(my+My)/2,rw=(Mx-mx)/2+isoTW()*0.7,rh=(My-my)/2+isoTW()*0.42;
    ctx.fillStyle='rgba(120,140,80,0.35)';ctx.strokeStyle='rgba(80,64,32,0.45)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(cxp,cyp-rh);ctx.lineTo(cxp+rw,cyp);ctx.lineTo(cxp,cyp+rh);ctx.lineTo(cxp-rw,cyp);ctx.closePath();ctx.fill();ctx.stroke();
    return {x:cxp,y:cyp-rh-isoTW()*0.10};};
  // average rotated depth decides whether a district sits BEHIND the town
  const distDepth=(posArr,from,to)=>{let d=0;for(let i=from;i<to;i++)d+=rotDepth(posArr[i][0],posArr[i][1]);return d/(to-from);};
  const DIST_BEHIND=[];   // painted before the back walls
  const DIST_FRONT=[];    // painted after the front walls
  const distPass=(fn,posArr,from,to)=>{(distDepth(posArr,from,to)<0?DIST_BEHIND:DIST_FRONT).push(fn);};
  if(OC>0)distPass(()=>{const L=plate(OUTSKIRT_POS,0,Math.min(6,OC));distLabel('⚒ ARTISAN ROW',L.x,L.y);drawOutskirtPlots(0,Math.min(6,OC));},OUTSKIRT_POS,0,Math.min(6,OC));
  if(OC>6)distPass(()=>{const L=plate(OUTSKIRT_POS,6,OC);distLabel('🛡 GARRISON YARD',L.x,L.y);drawOutskirtPlots(6,OC);},OUTSKIRT_POS,6,OC);
  if(tartOpen())distPass(()=>{const L=plate(TART_POS,0,9);distLabel('🏛 TARTARIAN GROUNDS',L.x,L.y);drawTartPlots();},TART_POS,0,9);
  for(const f of DIST_BEHIND)f();   // behind-the-castle districts go under the walls
  RT_FRONT=DIST_FRONT;   // executed after the FRONT walls
  townWalls('back');
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(cornerLocked(c,r))continue;
    cells.push({c,r,key:slotKey(c,r),depth:rotDepth(c,r)});   // depth follows the CAMERA, not the grid
  }
  cells.sort((a,b)=>a.depth-b.depth);
  const TWv=isoTW(),THv=TWv/2;
  // pass 1: embedded floor diamonds — faint on empty plots, invisible under buildings (no opaque plate)
  for(const cell of cells){
    if(cell.c===CENTER&&cell.r===CENTER)continue;
    if(S.city[cell.key])continue;
    const p=rotCell(cell.c,cell.r);
    drawDiamond(p.x,p.y,TWv*0.96,THv*0.96,'rgba(225,218,200,0.18)','rgba(0,0,0,0.18)',1);
  }
  // pass 2: contents back-to-front IN CAMERA ORDER (rotation-aware painter's algo)
  for(const cell of cells){
    const p=rotCell(cell.c,cell.r);
    const isSel=sel&&sel.view==='town'&&sel.key===cell.key;
    if(isSel) drawHi(p.x,p.y,TWv*0.98,THv*0.98);
    if(cell.c===CENTER&&cell.r===CENTER){
      if(sel&&sel.view==='town'&&sel.key==='TH') drawHi(p.x,p.y,TWv*1.1,THv*1.1);
      if(!S.thLevel){ foundation(p.x,p.y,TWv*1.05);
        const gq=S.queue.find(j=>j.kind==='gh'); if(gq)drawTimer(p.x,p.y-THv*0.6,gq);
        hot(p.x,p.y,TWv*0.4,()=>{sel={view:'town',key:'TH'};DBG.log('tap','gh-foundation');buildGrandHall();}); }
      else{ draw._lv=S.thLevel; draw(ID.th[thStage(S.thLevel)]||'th1', p.x, p.y+THv*0.52, TWv*1.3);   // stage art, true tier badge
        hot(p.x,p.y,TWv*0.4,()=>{sel={view:'town',key:'TH'};DBG.log('tap','townhall');upgradeTH();}); }
      continue;
    }
    const b=S.city[cell.key];
    const q=S.queue.find(j=>j.kind==='city'&&j.slot===cell.key);
    if(b){
      if(b.type==='barracks'&&trainBuffMult()<1)drawBuffGlow(p.x,p.y+THv*0.3,TWv,THv,'#e0342f',false);
      draw._lv=b.lv||1; draw._seed=hashKey(cell.key); draw(CITY[b.type].id, p.x, p.y+THv*0.3, TWv*0.9);
      const uq=S.queue.find(j=>j.kind==='up-city'&&j.slot===cell.key); if(uq)drawTimer(p.x,p.y-THv*0.5,uq);
      hot(p.x,p.y,TWv*0.42,()=>{sel={view:'town',key:cell.key};DBG.log('tap','city '+cell.key+'='+b.type);upgradeMenu('city',cell.key);}); }
    else if(q){ drawTimer(p.x,p.y,q); hot(p.x,p.y,TWv*0.42,()=>{sel={view:'town',key:cell.key};toast('Building… '+fmtTime((q.end-Date.now())/1000));}); }
    else { plus(p.x,p.y); hot(p.x,p.y,TWv*0.42,()=>{sel={view:'town',key:cell.key};DBG.log('tap','city-empty '+cell.key);buildCityMenu(cell.key);}); }
  }
  townWalls('front');
  for(const f of RT_FRONT)f();   // near-side districts draw over the walls' feet
  drawCompass();
  setHint(tutHint()||'Drag to pan · 🧭 rotate · tap a plot to build');
}
let RT_FRONT=[];
/* One district plot (shared by the quarters and the Grounds), at its ROTATED spot. */
function drawDistrictPlot(key,p,tart){
  const b=S.city[key]; const q=S.queue.find(j=>(j.kind==='city'||j.kind==='up-city'||j.kind==='tart')&&j.slot===key);

function drawOutskirtPlots(from,to){
  const idx=[];for(let i=from;i<to;i++)idx.push(i);   // depth-sorted within the quarter
  idx.sort((a,b)=>rotDepth(OUTSKIRT_POS[a][0],OUTSKIRT_POS[a][1])-rotDepth(OUTSKIRT_POS[b][0],OUTSKIRT_POS[b][1]));
  for(const i of idx)drawDistrictPlot('o'+i,rotCell(OUTSKIRT_POS[i][0],OUTSKIRT_POS[i][1]),false);}
function drawTartPlots(){
  const idx=[0,1,2,3,4,5,6,7,8];
  idx.sort((a,b)=>rotDepth(TART_POS[a][0],TART_POS[a][1])-rotDepth(TART_POS[b][0],TART_POS[b][1]));
  const hotel=idx.indexOf(4); if(hotel>=0){idx.splice(hotel,1);idx.push(4);}   // the hotel looms LAST
  for(const i of idx)drawDistrictPlot('t'+i,rotCell(TART_POS[i][0],TART_POS[i][1]),true);}
/* Compass rose: makes the current facing UNMISTAKABLE. */
function drawCompass(){
  const cx=VW-34,cy=44,R=17;
  ctx.save();ctx.globalAlpha=0.92;
  ctx.fillStyle='rgba(40,28,12,0.75)';ctx.strokeStyle='#b9822b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();ctx.stroke();
  const a=-Math.PI/2 + ROT*Math.PI/2;   // needle swings with the view
  ctx.strokeStyle='#f2cd72';ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx-Math.cos(a)*R*0.45,cy-Math.sin(a)*R*0.45);
  ctx.lineTo(cx+Math.cos(a)*R*0.62,cy+Math.sin(a)*R*0.62);ctx.stroke();
  ctx.fillStyle='#c0413a';ctx.beginPath();ctx.arc(cx+Math.cos(a)*R*0.62,cy+Math.sin(a)*R*0.62,2.6,0,7);ctx.fill();
  ctx.fillStyle='#f2e6c4';ctx.font='800 9px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(['S','W','N','E'][ROT],cx,cy+R+9);
  ctx.restore();}
function drawHi(cx,cy,TW,TH){const p=0.4+0.45*Math.sin(performance.now()/280);ctx.save();
  ctx.lineWidth=3;ctx.strokeStyle='rgba(255,208,90,'+p.toFixed(2)+')';ctx.shadowColor='#ffcf5a';ctx.shadowBlur=14;
  ctx.beginPath();ctx.moveTo(cx,cy-TH/2);ctx.lineTo(cx+TW/2,cy);ctx.lineTo(cx,cy+TH/2);ctx.lineTo(cx-TW/2,cy);ctx.closePath();ctx.stroke();ctx.restore();}
// Buff glow: colored pulsing ring under a buffed building/node so the effect is OBVIOUS.
// col: hex color string. rare=true adds a slow rotating sparkle ring for premium/rare buffs.
function drawBuffGlow(cx,cy,TW,TH,col,rare){
  // Subtle, warm — a soft aura, not a sci-fi light show.
  const t=performance.now();const p=0.30+0.18*Math.sin(t/600);
  ctx.save();
  const g=ctx.createRadialGradient(cx,cy,TH*0.15,cx,cy,TW*0.55);
  g.addColorStop(0,col+'99');g.addColorStop(1,col+'00');
  ctx.fillStyle=g;ctx.globalAlpha=p;
  ctx.beginPath();ctx.ellipse(cx,cy,TW*0.55,TH*0.55,0,0,7);ctx.fill();
  if(rare){ctx.globalAlpha=0.6;const n=3;for(let i=0;i<n;i++){const a=t/1400+i*(6.283/n);
      const px=cx+Math.cos(a)*TW*0.42,py=cy+Math.sin(a)*TH*0.42*0.6;
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(px,py,1.6,0,7);ctx.fill();}}
  ctx.restore();}
function plus(x,y){ctx.save();ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=4;ctx.font='800 26px system-ui';
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeText('+',x,y);ctx.fillText('+',x,y);ctx.restore();}
function drawTimer(x,y,q){const left=(q.end-Date.now())/1000;ctx.save();ctx.fillStyle='#000c';

/* NPC castle — 25 visual tiers in 5 bands. Discipline: towers sit ONLY on the
   four wall corners + one central keep. No floating mid-wall turrets (the old
   "hallucinated tower" was an offset inner tower — gone). Bands:
   1-4 timber camp · 5-9 fieldstone · 10-14 stone hold · 15-19 grand fortress ·
   20-25 the iconic tall-tower thick-wall citadel. dead=true draws a razed ruin. */
function castle(cx,cy,w,lvl,dead){
  if(dead){
    ctx.save();ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(cx,cy,w*0.34,w*0.17,0,0,7);ctx.fillStyle='#7d7452';ctx.fill();ctx.restore();
    poly([[cx-w*0.20,cy],[cx-w*0.12,cy-w*0.10],[cx-w*0.02,cy-w*0.06],[cx+w*0.02,cy+w*0.02],[cx-w*0.10,cy+w*0.05]],'#8f8a7a','rgba(50,44,30,0.5)',1);
    poly([[cx+w*0.05,cy-w*0.02],[cx+w*0.13,cy-w*0.12],[cx+w*0.20,cy-w*0.04],[cx+w*0.15,cy+w*0.04]],'#a09a88','rgba(50,44,30,0.5)',1);
    ctx.strokeStyle='rgba(40,32,20,0.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-w*0.06,cy+w*0.02);ctx.lineTo(cx+w*0.02,cy-w*0.16);ctx.stroke();
    return;}
  lvl=Math.max(1,Math.min(25,lvl|0));
  const band=lvl<=4?0:lvl<=9?1:lvl<=14?2:lvl<=19?3:4;
  const LEGEND=lvl>=23;   // 23-25: the CITADEL OF LEGEND — the sprite people grind months for
  const sc=(0.62+band*0.10+((lvl-1)%5)*0.012)*(LEGEND?1.18:1), fw=w*0.5*sc, fh=fw*0.5, h=w*(0.055+0.010*lvl);
  const pN=[cx,cy-fh],pE=[cx+fw,cy],pS=[cx,cy+fh],pW=[cx-fw,cy];
  const up=p=>[p[0],p[1]-h];
  const wood=band===0;
  const stone=wood?[150,120,86]:LEGEND?[214,210,200]:band>=4?[202,198,188]:band===3?[190,186,174]:[172,168,156];
  const tRoof=wood?[110,80,50]:LEGEND?[64,80,132]:band>=3?[86,104,152]:[118,88,62];   // grand tiers earn the blue slate
  if(LEGEND){ // radiant standing — visible across the map before the walls even resolve
    const g=ctx.createRadialGradient(cx,cy,fw*0.3,cx,cy,fw*1.5);
    g.addColorStop(0,'rgba(242,205,114,0.20)');g.addColorStop(1,'rgba(242,205,114,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(cx,cy,fw*1.5,fh*1.5,0,0,7);ctx.fill();}
  softShadow(cx,cy+fh*0.15,fw*1.08,fh*1.08);
  gfill([pN,pE,pS,pW],wood?[166,142,104]:[184,176,158],1.0,0.88,null);
  const seg=(A,B)=>{const q=[A,B,up(B),up(A)];gfill(q,stone,0.96,0.72);
    courses(q,band>=2?3:2,'rgba(50,38,26,0.16)');
    if(band>=1){ctx.strokeStyle='rgba(30,22,12,0.22)';ctx.lineWidth=Math.max(2,h*0.14); // battered base = thick-wall read
      ctx.beginPath();ctx.moveTo(A[0],A[1]-1);ctx.lineTo(B[0],B[1]-1);ctx.stroke();}
    if(band>=1){ctx.fillStyle=shade(stone,1.03);const n=6;for(let i=0;i<=n;i+=2){const t=i/n;
      const q2=[up(A)[0]+(up(B)[0]-up(A)[0])*t,up(A)[1]+(up(B)[1]-up(A)[1])*t];ctx.fillRect(q2[0]-1.6,q2[1]-4.5,3.2,4.5);}}
    if(LEGEND){ctx.strokeStyle='rgba(242,205,114,0.85)';ctx.lineWidth=1.6;  // gilt parapet line
      ctx.beginPath();ctx.moveTo(up(A)[0],up(A)[1]);ctx.lineTo(up(B)[0],up(B)[1]);ctx.stroke();}};
  const ts=w*0.13*sc, tall=band>=4?2.1:band===3?1.6:band===2?1.25:1.0;
  const flag=band>=4?'#f0c23a':band>=2?'#c0413a':undefined;
  const twr=(P,f)=>tower(P[0],P[1],ts*0.42,ts*0.21,(h+ts*0.32)*tall,ts*0.5,stone,tRoof,{crenel:band>=1,flag:f});
  // BACK walls + back corner tower
  seg(pW,pN);seg(pN,pE); if(band>=1)twr(pN);
  // ── LEGEND ONLY: an INNER curtain wall — a fortress within the fortress ──
  if(LEGEND){
    const f2=0.55, iN=[cx,cy-fh*f2],iE=[cx+fw*f2,cy],iS=[cx,cy+fh*f2],iW=[cx-fw*f2,cy];
    const h2=h*0.8, up2=p=>[p[0],p[1]-h2];
    const seg2=(A,B)=>{const q=[A,B,up2(B),up2(A)];gfill(q,shade(stone,1.05),0.96,0.74);
      ctx.strokeStyle='rgba(242,205,114,0.7)';ctx.lineWidth=1.3;
      ctx.beginPath();ctx.moveTo(up2(A)[0],up2(A)[1]);ctx.lineTo(up2(B)[0],up2(B)[1]);ctx.stroke();};
    const ts2=ts*0.7;
    const twr2=(P)=>tower(P[0],P[1],ts2*0.42,ts2*0.21,(h2+ts2*0.34)*1.9,ts2*0.5,shade(stone,1.05),tRoof,{crenel:1,flag:'#f0c23a'});
    seg2(iW,iN);seg2(iN,iE);twr2(iN);
    // twin flanking spires beside the great keep
    tower(cx-fw*0.28,cy+fh*0.02,ts*0.34,ts*0.17,(h+ts*0.30)*2.5,ts*0.42,stone,tRoof,{crenel:1,flag:'#f0c23a'});
    tower(cx+fw*0.28,cy+fh*0.02,ts*0.34,ts*0.17,(h+ts*0.30)*2.5,ts*0.42,stone,tRoof,{crenel:1,flag:'#f0c23a'});
    // CENTRAL GREAT KEEP — taller than anything else in the realm, gilt spire line
    const kw=w*(0.26+band*0.05)*1.15;
    tower(cx,cy+fh*0.08,kw*0.17,kw*0.085,(h+kw*0.42)*1.75,kw*0.2,stone,tRoof,{crenel:1,flag:'#f0c23a'});
    seg2(iW,iS);seg2(iS,iE);twr2(iW);twr2(iE);twr2(iS);
  } else {
    // CENTRAL KEEP — the only interior structure, dead center of the courtyard
    const kw=w*(0.26+band*0.05);
    tower(cx,cy+fh*0.08,kw*0.17,kw*0.085,(h+kw*0.42)*(band>=4?1.35:band===3?1.15:1),kw*0.2,stone,tRoof,{crenel:band>=1,flag});
  }
  // FRONT walls + side/front corner towers + gate
  seg(pW,pS);seg(pS,pE);
  if(band>=2){twr(pW);twr(pE);} twr(pS,flag);
  ctx.fillStyle='#1c140c';ctx.beginPath();ctx.ellipse(pS[0],pS[1]-h*0.25,w*0.03,h*0.40,0,0,7);ctx.fill();
  if(LEGEND){ // gilded gate arch — even the front door announces the tier
    ctx.strokeStyle='#f0c23a';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(pS[0],pS[1]-h*0.25,w*0.035,h*0.44,0,0,7);ctx.stroke();}
}
/* A real player's castle on the world map: their actual WALL tier drives the
   shell, their Grand Hall drives the keep. No walls = an open camp with just a
   hall — never a phantom fortress. */
function playerCastle(cx,cy,w,wall,th){
  wall=Math.max(0,Math.min(25,wall|0)); th=Math.max(0,Math.min(25,th|0));
  if(wall<1){ // wall-less lord: bare courtyard + their hall (if any)
    softShadow(cx,cy+w*0.10,w*0.42,w*0.20);
    const fw=w*0.30, fh=fw*0.5;
    gfill([[cx,cy-fh],[cx+fw,cy],[cx,cy+fh],[cx-fw,cy]],[186,178,158],1.0,0.9,null);
    if(th>0){const kw=w*0.30;tower(cx,cy+fh*0.1,kw*0.17,kw*0.085,kw*0.40,kw*0.2,[196,190,176],[92,108,150],{flag:'#c0413a'});}
    else foundation(cx,cy,w*0.55);
    return;}
  castle(cx,cy,w,Math.max(wall,Math.min(25,th)),false);
}

/* ── WORLD GENERATION v2 (beta) ──────────────────────────────────────────
   The realm is ONE shared 1000×1000 world. Everything is seeded in WORLD-
   ABSOLUTE coordinates from a deterministic hash of the grid cell, so:
     • every player sees the SAME NPCs/camps at the SAME coordinates
     • ids are world-stable ("n_gx_gy") → the shared razed/cleared deltas from
       other players land on the RIGHT castle instead of poisoning yours
       (this was the bug that turned every Derelict into unclickable ruins)
     • the whole map is populated, not just a test patch near spawn        */
function homeOff(){const HX=(S.home&&S.home.x)||512,HY=(S.home&&S.home.y)||512;
  return{x:(HX-512)*14,y:(HY-512)*14};}
function cellRnd(gx,gy,salt){return mul(hashKey(salt+'|'+gx+'|'+gy));}
const WGEN={G0:-21,G1:42,SP:340};   // asymmetric growth: old cells keep their ids, the realm grows east+south
/* MAP resource camps — deplete to flat land */
let camps=null;
function seedCamps(){camps=[];if(!rivers)seedRivers();const HO=homeOff();
  const SP=WGEN.SP;
  for(let gy=WGEN.G0;gy<=WGEN.G1;gy++)for(let gx=WGEN.G0;gx<=WGEN.G1;gx++){
    const rnd=cellRnd(gx,gy,'camp');
    if(rnd()<0.62)continue;
    const jx=(rnd()-0.5)*220+150, jy=(rnd()-0.5)*220-150;
    const t=rnd();const res=t<0.3?'wood':t<0.55?'stone':t<0.8?'food':'iron';
    // camps richen toward the wild edges of the realm
    const wx=gx*SP+jx, wy=gy*SP+jy;
    const edge=Math.min(1,Math.hypot(wx,wy)/9500);
    // Tier 1-25, SKEWED: r² makes the top tiers genuinely rare, not a Macy's of 25s
    const lvl=Math.max(1,Math.min(25,1+Math.floor(rnd()*rnd()*8+edge*edge*22)));
    const px=wx-HO.x, py=wy-HO.y;                 // home-relative for render/marches
    if(Math.hypot(px,py)<220)continue;            // never on top of your own castle
    if(nearRiver(px,py,50))continue;
    camps.push({id:'c_'+gx+'_'+gy,x:px,y:py,res,lvl,pool:lvl*3000});}}
function campLeft(c){return S.mapRes[c.id]!==undefined?S.mapRes[c.id]:c.pool;}
function drawCamp(x,y,c){
  const left=campLeft(c);
  if(left<=0){ // exhausted — flat land + rubble
    ctx.save();ctx.globalAlpha=.45;ctx.beginPath();ctx.ellipse(x,y,24,12,0,0,7);ctx.fillStyle='#8a7d57';ctx.fill();ctx.restore();
    poly([[x-8,y],[x-2,y-6],[x+6,y-4],[x+9,y+2],[x-2,y+4]],'#98917c','rgba(60,50,35,0.4)',1);
    return;}
  softShadow(x,y+5,22,11);
  CUR_SEED=hashKey(c.id);
  house(x,y,13,7,10,7,[168,142,102],[120,84,52]);
  const em=c.res==='wood'?'🪵':c.res==='stone'?'⛰️':c.res==='iron'?'⛏️':'🌾';
  ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(em,x+18,y-9);
  levelBadge(x-18,y+7,c.lvl);
}
function campMenu(c){const left=campLeft(c);
  if(left<=0){toast('This camp is exhausted — flat land now.');return;}
  if(activeMarchTo(c.id)){toast('A march is already on the road there');return;}
  const name=(c.res==='wood'?'Logging':c.res==='stone'?'Quarry':c.res==='iron'?'Mining':'Grain')+' Camp';
  const mi=distMiles(c.x,c.y).toFixed(1);
  if(!S.campClear[c.id]){                                             // bandits hold it — clear it by force first
    const TT2=troopTotal(), G=garrison(c), aF=marchFood(c.x,c.y,TT2), aT=marchDur(c.x,c.y,S.army,'raid');
    modal(name+' · Lv '+c.lvl+' · '+mi+' mi · ⚠️ bandit garrison ~'+G,[
      {em:'⚔️',label:'Attack with all ('+compStr(S.army)+')',meta:aF+'🌾 · '+fmtTime(aT)+' each way',
       dis:TT2<1||S.res.food<aF||activeMarches()>=marchSlots()||TT2>marchSizeCap(),
       lockMsg:activeMarches()>=marchSlots()?'March queue full — build a Rally Spot':TT2>marchSizeCap()?'Rally Spot too small (max '+marchSizeCap()+')':TT2<1?'Train soldiers first':'Not enough provisions',
       fn:()=>{S.res.food-=aF;DISPATCH_CTX={tKind:'camp',tLvl:c.lvl,amount:TT2,foodPaid:aF};dispatch('clearcamp',c.id,c.x,c.y,slice(TT2),0);closeModal();renderRes();}}]);
    return;}
  const take=Math.min(Math.round(500*c.lvl*(hasSyn('beacon')?1.25:1)),left), H=5;   // Twin Watch finds richer seams
  const gF=marchFood(c.x,c.y,H), gT=marchDur(c.x,c.y,H,'gather');
  modal(name+' · Lv '+c.lvl+' · '+mi+' mi · cleared ✅',[
    {em:'⛏️',label:'Send '+H+' haulers · fetch '+take+' '+c.res,meta:fmt(left)+' left · '+gF+'🌾 · '+fmtTime(gT)+' each way',
     dis:troopTotal()<H||S.res.food<gF||activeMarches()>=marchSlots(),
     lockMsg:activeMarches()>=marchSlots()?'March queue full — build a Rally Spot':troopTotal()<H?'Need '+H+' troops to haul':'Not enough provisions',
     fn:()=>{S.res.food-=gF;DISPATCH_CTX={tKind:'camp',tLvl:c.lvl,amount:H,res:c.res,foodPaid:gF};dispatch('gather',c.id,c.x,c.y,slice(H),0);closeModal();renderRes();}}]);}

/* MAP */
const cams={town:{x:0,y:0},outside:{x:0,y:0},map:{x:0,y:0}};
function CAM(){return cams[view]||cams.town;}
// Keep the castle reachable: limit how far town/fields can be panned. The castle
// sits near origin; allow generous exploring but never fling it off-screen.
function clampTownCam(c){const lim=Math.max(VW,VH)*0.9+200;
  c.x=Math.max(-lim,Math.min(lim,c.x));
  c.y=Math.max(-lim,Math.min(lim,c.y));}
let zoom=1, sel=null, npcs=null, PLAYERS=[], playersFetched=0;
function seedNPCs(){npcs=[];if(!rivers)seedRivers();const HO=homeOff();
  const SP=WGEN.SP;
  for(let gy=WGEN.G0;gy<=WGEN.G1;gy++)for(let gx=WGEN.G0;gx<=WGEN.G1;gx++){
    const rnd=cellRnd(gx,gy,'npc');
    if(rnd()<0.70)continue;
    const jx=(rnd()-0.5)*140, jy=(rnd()-0.5)*140;
    const wx=gx*SP+jx+170, wy=gy*SP+jy+170;
    // NPC level 1..25: the heart of the realm is gentle, the frontier is savage
    const ring=Math.min(1,Math.hypot(wx,wy)/9500);
    const lvl=Math.max(1,Math.min(25,1+Math.floor(rnd()*rnd()*9+ring*ring*21)));
    const px=wx-HO.x, py=wy-HO.y;
    if(Math.hypot(px,py)<260)continue;            // breathing room around your castle
    if(nearRiver(px,py,60))continue;
    npcs.push({id:'n_'+gx+'_'+gy,x:px,y:py,kind:rnd()<0.5?'Barbarian':'Derelict',lvl});}}
let mapdecor=null, rivers=null;
function seedRivers(){rivers=[];const rnd=mul(777);const HO=homeOff();
  for(let r=0;r<6;r++){const pts=[];const a=rnd()*Math.PI*2;
    // rivers are WORLD features: same water for every lord, converted to home-relative
    let x=(rnd()-0.5)*13000, y=(rnd()-0.5)*13000;
    const dx=Math.cos(a), dy=Math.sin(a), ph=rnd()*7, amp=60+rnd()*70;
    for(let i=-90;i<90;i++){const t=i*96;
      pts.push([x+dx*t-dy*Math.sin(t*0.012+ph)*amp-HO.x, y+dy*t+dx*Math.sin(t*0.012+ph)*amp-HO.y]);}
    rivers.push(pts);}}
function nearRiver(x,y,d){if(!rivers)seedRivers();const d2=d*d;
  for(const pts of rivers)for(const q of pts){const ddx=q[0]-x,ddy=q[1]-y;if(ddx*ddx+ddy*ddy<d2)return true;}
  return false;}
function seedDecor(){mapdecor=[];seedRivers();const HO=homeOff();
  const SP=WGEN.SP;
  for(let gy=WGEN.G0;gy<=WGEN.G1;gy++)for(let gx=WGEN.G0;gx<=WGEN.G1;gx++){
    const rnd=cellRnd(gx,gy,'decor');
    const n=rnd()<0.15?0:(1+(rnd()<0.55?1:0));                       // 0–2 features per cell → Evony-dense
    for(let i=0;i<n;i++){const jx=(rnd()-0.5)*300, jy=(rnd()-0.5)*300;
      const t=rnd();
      const kind=t<0.30?'grove':t<0.48?'pine':t<0.60?'pond':t<0.74?'rocks':t<0.84?'rock':'tuft';
      const px=gx*SP+jx+170-HO.x, py=gy*SP+jy+170-HO.y;
      if(kind!=='tuft'&&nearRiver(px,py,36))continue;                 // nothing solid spawns in the water
      mapdecor.push({x:px,y:py,kind,s:0.8+rnd()*0.6,v:Math.floor(rnd()*5)});}}}
function drawRivers(cam){if(!rivers)return;
  for(let R=0;R<rivers.length;R++){const pts=rivers[R];
    let vis=false;const P=[];
    for(const q of pts){const px=VW/2-cam.x+q[0]*zoom, py=VH/2-cam.y+q[1]*zoom;
      P.push([px,py]); if(px>-80&&px<VW+80&&py>-80&&py<VH+80)vis=true;}
    if(!vis)continue;
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    // draw in short strokes: width breathes, and some stretches sink underground (Evony map look)
    for(let i=1;i<P.length;i++){
      const ph=i*0.55+R*3.1;
      if(Math.sin(i*0.23+R*7)>0.93)continue;                          // the river vanishes into marsh here
      const w=(7+3*Math.sin(ph))*zoom;
      ctx.beginPath();ctx.moveTo(P[i-1][0],P[i-1][1]);ctx.lineTo(P[i][0],P[i][1]);
      ctx.strokeStyle='#3f5f47';ctx.lineWidth=w+3.5*zoom;ctx.globalAlpha=0.5;ctx.stroke();  // muddy banks
      ctx.globalAlpha=0.95;
      ctx.strokeStyle='#517d9e';ctx.lineWidth=w;ctx.stroke();
      ctx.strokeStyle='#6e9fc0';ctx.lineWidth=w*0.5;ctx.stroke();
      if(Math.sin(ph*1.7)>0.6){ctx.strokeStyle='rgba(210,230,240,0.5)';ctx.lineWidth=1.2;ctx.stroke();} // glints
    }
    ctx.restore();}}
function grove(x,y,s,v){const off=[[0,0],[15,7],[-13,9],[7,-9],[-7,-15]];
  const n=3+(v%3); const ord=off.slice(0,n).sort((a,b)=>a[1]-b[1]);
  for(const o of ord)pine(x+o[0]*s,y+o[1]*s,s*0.9);}
function rocks(x,y,s){rock(x,y,s);rock(x+16*s,y+6*s,s*0.55);rock(x-14*s,y+7*s,s*0.4);}
function tuft(x,y,s){ctx.strokeStyle='#5d7a35';ctx.lineWidth=1.5;
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(x+i*4*s,y);ctx.lineTo(x+i*5.5*s,y-6*s);ctx.stroke();}}
function pine(x,y,s){ctx.fillStyle='#6b4a2a';ctx.fillRect(x-2*s,y-6*s,4*s,7*s);
  for(let i=0;i<3;i++){const w=14*s-i*4*s,h=10*s;poly([[x,y-6*s-i*7*s-h],[x-w/2,y-6*s-i*7*s],[x+w/2,y-6*s-i*7*s]],i%2?'#3f6b2e':'#4c7d38','rgba(30,44,20,0.4)',1);}}
function pond(x,y,s){ctx.save();
  ctx.beginPath();ctx.ellipse(x,y+1.5,28*s,15*s,0,0,7);ctx.fillStyle='rgba(90,80,52,0.5)';ctx.fill(); // muddy bank
  ctx.beginPath();ctx.ellipse(x,y,26*s,14*s,0,0,7);ctx.fillStyle='#4f7fa8';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle='#6a9ec4';ctx.stroke();ctx.globalAlpha=.5;ctx.beginPath();ctx.ellipse(x-6*s,y-3*s,10*s,4*s,0,0,7);ctx.fillStyle='#8fc0dd';ctx.fill();ctx.restore();}
function rock(x,y,s){poly([[x-14*s,y],[x-6*s,y-12*s],[x+4*s,y-14*s],[x+13*s,y-4*s],[x+8*s,y+4*s],[x-8*s,y+4*s]],'#9a968c','rgba(40,36,28,0.4)',1);
  poly([[x-6*s,y-12*s],[x+4*s,y-14*s],[x+13*s,y-4*s],[x,y-2*s]],'#b4b0a4',null);}
function renderMap(){hots=[];const cam=CAM();
  mapGround();
  if(!mapdecor)seedDecor();
  drawRivers(cam);
  for(const d of mapdecor){const dx=VW/2-cam.x+d.x*zoom, dy=VH/2-cam.y+d.y*zoom;
    if(dx<-70||dx>VW+70||dy<-70||dy>VH+70)continue;const s=d.s*zoom;
    if(d.kind==='pine')pine(dx,dy,s);
    else if(d.kind==='grove')grove(dx,dy,s,d.v);
    else if(d.kind==='pond')pond(dx,dy,s);
    else if(d.kind==='rocks')rocks(dx,dy,s);
    else if(d.kind==='rock')rock(dx,dy,s);
    else tuft(dx,dy,s);}
  if(!camps)seedCamps();
  for(const c of camps){const cxp=VW/2-cam.x+c.x*zoom, cyp=VH/2-cam.y+c.y*zoom;
    if(cxp<-60||cxp>VW+60||cyp<-60||cyp>VH+60)continue;
    drawCamp(cxp,cyp,c);
    if(campLeft(c)>0){ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;
      const lab=c.res[0].toUpperCase()+c.res.slice(1)+' camp';ctx.strokeText(lab,cxp,cyp+22);ctx.fillText(lab,cxp,cyp+22);
      hot(cxp,cyp,34,()=>campMenu(c));}}
  if(!npcs)seedNPCs();
  // player castles: convert absolute world coords to home-relative (home at 0,0).
  // A castle's LOOK is its real wall tier from the server — a wall-less lord is
  // an open camp, not a phantom lvl-5 fortress (the old "ghost castle" bug).
  const HX=(S.home&&S.home.x)||512, HY=(S.home&&S.home.y)||512;
  const plist=(PLAYERS||[])
    .filter(p=>Math.hypot((p.x-HX),(p.y-HY))>0.5)   // drop stale self/duplicate spawn entries sitting on your home
    .map(p=>({player:true,hid:p.hid,name:p.name,prot:p.protected,
      x:(p.x-HX)*14, y:(p.y-HY)*14, wall:Math.max(0,Math.min(25,p.tier|0)), th:Math.max(0,p.th|0)}));
  const all=[{x:0,y:0,me:true,tier:S.wall}].concat(npcs).concat(plist);
  all.sort((a,b)=>(a.y)-(b.y));
  for(const n of all){const nx=VW/2-cam.x+n.x*zoom, ny=VH/2-cam.y+n.y*zoom;
    if(nx<-120||nx>VW+120||ny<-180||ny>VH+120)continue;
    const dead=!n.me&&!n.player&&!!S.razed[n.id];
    if(n.me) drawStonehold(nx,ny,150*zoom);
    else if(n.player) playerCastle(nx,ny,(96+Math.min(25,n.wall)*3)*zoom,n.wall,n.th);
    else castle(nx,ny,(78+Math.min(90,n.lvl*4))*zoom,n.lvl,dead);
    ctx.fillStyle=n.player?'#ffd070':'#fff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;
    const lab=n.me?'Your Stonehold':n.player?('⚔ '+n.name+(n.prot?' 🛡️':'')):(dead?n.kind+' ruins':n.kind+' '+n.lvl);
    ctx.strokeText(lab,nx,ny+6);ctx.fillText(lab,nx,ny+6);
    if(n.player)hot(nx,ny-18,52,()=>attackPlayer(n));
    else if(!n.me&&!dead)hot(nx,ny-18,50,()=>scout(n));
    if(n.me)hot(nx,ny-20,52,()=>{setView('town');toast('🏰 Home');DBG.log('nav','map->town via castle');});}
  drawMarches(cam);
  worldBorder(cam);
  coordBox(cam);
  setHint('Drag to explore · tap the ◎ X·Y chip to navigate');
  if(ONLINE && Date.now()-playersFetched>30000){playersFetched=Date.now();
    srv('stonehold_nearby',{}).then(r=>{if(r&&r.ok&&Array.isArray(r.players)){PLAYERS=r.players;}});}
}
function coordBox(cam){const HX=(S.home&&S.home.x)||512,HY=(S.home&&S.home.y)||512;const cl=(v,h)=>Math.max(0,Math.min(WORLD_MAXC,h+Math.round(v/(14*zoom))));
  const X=cl(cam.x,HX),Y=cl(cam.y,HY);const w=132,h=30,x=VW-w-10,y=92;
  ctx.save();ctx.fillStyle='#efe2c0';ctx.strokeStyle='#b9822b';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x,y,w,h,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#3a2c18';ctx.font='800 14px system-ui';ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText('◎ X:'+X+'  Y:'+Y,x+10,y+h/2+1);ctx.restore();
  hot(x+w/2,y+h/2,44,mapNavMenu);}                                    // tap the chip → navigate
function mapNavMenu(){const c=cams.map;
  modal('🧭 Navigate the Realm',[
    {em:'🏰',label:'Center on Your Stonehold',meta:'X:'+((S.home&&S.home.x)||512)+' Y:'+((S.home&&S.home.y)||512),fn:()=>{c.x=0;c.y=0;closeModal();toast('Home sweet stronghold');}},
    {em:'🎯',label:'Go to coordinates…',meta:'0–'+WORLD_MAXC,fn:()=>{closeModal();
      const inp=prompt('Enter coordinates as  X Y  (0–'+WORLD_MAXC+'):','512 512'); if(!inp)return;
      const m2=inp.match(/(\d+)\D+(\d+)/); if(!m2){toast('Format: 512 512');return;}
      const X=Math.max(0,Math.min(WORLD_MAXC,+m2[1])), Y=Math.max(0,Math.min(WORLD_MAXC,+m2[2]));
      const HX=(S.home&&S.home.x)||512, HY=(S.home&&S.home.y)||512;
      c.x=(X-HX)*14*zoom; c.y=(Y-HY)*14*zoom; clampMapCam(c);   // home-anchored + zoom-true
      DBG.log('goto',X+','+Y); toast('Marched to '+X+' · '+Y);}},
  ]);}
function worldBorder(cam){                                            // the edge of the realm
  const L=VW/2-cam.x+WORLD.min*zoom, R=VW/2-cam.x+WORLD.max*zoom;
  const T=VH/2-cam.y+WORLD.min*zoom, B=VH/2-cam.y+WORLD.max*zoom;
  ctx.save();ctx.fillStyle='#3d3020';
  if(L>0)ctx.fillRect(0,0,Math.min(L,VW),VH);
  if(R<VW)ctx.fillRect(Math.max(R,0),0,VW-Math.max(R,0),VH);
  if(T>0)ctx.fillRect(0,0,VW,Math.min(T,VH));
  if(B<VH)ctx.fillRect(0,Math.max(B,0),VW,VH-Math.max(B,0));
  ctx.strokeStyle='#8a5f22';ctx.lineWidth=5;ctx.strokeRect(L,T,R-L,B-T);ctx.restore();}
/* THE ARMY — multiple soldier types. Power, speed, and cost differ; an army marches
   at the pace of its SLOWEST unit (Evony law). More types incoming — same universe. */
/* Evony pace: real armies take DAYS. A force that can crack a mid-tier base is
   roughly a week of continuous training for a young castle. Barracks tiers
   (Drill Yards) and member perks shave the time — never buy raw power. */
const UNITS={
  sword:{name:'Swordsman',em:'🗡️',cost:{food:40,iron:12},t:48,pow:1.0,speed:1.0},
  archer:{name:'Archer',em:'🏹',cost:{food:32,wood:16},t:55,pow:1.15,speed:1.0},
  horse:{name:'Horseman',em:'🐎',cost:{food:120,iron:40,gold:6},t:150,pow:2.3,speed:2.4},
};
function troopTotal(a){a=a||S.army;let n=0;for(const k in UNITS)n+=a[k]||0;return n;}
function cityLvSum(t){let n=0;for(const k in S.city){const b=S.city[k];if(b.type===t)n+=b.lv||1;}return n;}
function tartarianPop(lv){return cottagePop(lv)*12;}                  // Lv25 ≈ 23,000 souls — a true grand hotel
function popCap(){let p=50+(S.popBonus||0);                           // cottages house the people (+dev bonus)
  for(const k in S.city){const b=S.city[k];
    if(b.type==='cottage')p+=cottagePop(b.lv||1);
    else if(b.type==='tartarian')p+=tartarianPop(b.lv||1);}
  return p;}
function popUsed(){let n=troopTotal()+S.scouts;
  for(const j of S.queue)if(j.kind&&j.kind.slice(0,5)==='train')n+=j.n||0;
  for(const m of S.marches){if(m.comp)n+=troopTotal(m.comp);n+=m.scouts||0;}
  const J=effJobs();for(const k in J)n+=J[k]||0;   // hotel staff live OFF the levy rolls
  return n;}
function idlePop(){return Math.max(0,popCap()-popUsed());}            // recruits come from idle civilians
function rallyLv(){return cityLvSum('rally');}
function marchSlots(){return 1+rallyLv();}                            // Rally Spot = simultaneous marches
function marchSizeCap(){return 100*Math.max(1,rallyLv());}            // ...and max army per march
function activeMarches(){return S.marches.filter(m=>!m.home).length;}
function forgeBoost(){return 1+0.05*cityLvSum('forge')+techBonus('atk');}   // Forge level + Military Science research
// WALL DEFENSE — Evony-style defensive works built into your walls. Each adds a
// defense value that reduces incoming attacker power; more = a true uber-base.
const DEFS={
  trap:       {name:'Trap',        em:'🨤', cost:{wood:60,stone:20},        def:8,  desc:'Cheap pits that bleed attackers'},
  abatis:     {name:'Abatis',      em:'🪵', cost:{wood:120,iron:20},        def:16, desc:'Sharpened logs slow the charge'},
  archerTower:{name:"Archer Tower",em:'🏹', cost:{wood:150,stone:120,iron:60},def:40, desc:'Rains arrows on besiegers'},
  rollingLog: {name:'Rolling Log', em:'🪵', cost:{wood:200,stone:80},       def:30, desc:'Crushes massed infantry'},
};
// FORGE RESEARCH — Evony-style tech tree. Each tech has levels 1-10; each level
// costs more + takes longer and stacks a % bonus. Forge level caps how high you go.
const TECH={
  militaryScience:{name:'Military Science',em:'⚔️',effect:'atk', per:0.03, desc:'+3% army attack / level'},
  ironWorking:    {name:'Iron Working',    em:'🛡️',effect:'def', per:0.03, desc:'+3% wall defense / level'},
  logistics:      {name:'Logistics',       em:'🐎',effect:'speed', per:0.04, desc:'+4% march speed / level'},
  agriculture:    {name:'Agriculture',     em:'🌾',effect:'prod', per:0.05, desc:'+5% production / level'},
  masonry:        {name:'Masonry',         em:'🧱',effect:'build', per:0.04, desc:'+4% faster building / level'},
  surveying:      {name:'Field Excavation', em:'⛏️',effect:'plots', per:1,    desc:'END-GAME: excavate +1 plot outside the walls / level (up to +10)'},
};
function techLv(k){return (S.research&&S.research[k])||0;}
function techBonus(effect){let b=0;for(const k in TECH)if(TECH[k].effect===effect)b+=techLv(k)*TECH[k].per;return b;}
function researchCost(k,lv){const m=lv+1;
  return {food:Math.round(400*m*m*m), iron:Math.round(240*m*m*m), gold:Math.round(80*m*m*m)};}
function researchTime(k,lv){const t=Math.min(86400*21,600*(lv+1)*(lv+1)*(lv+1));   // late tiers reach WEEKS (Lv25 caps at 21d)
  return Math.round(t*(hasSyn('embassy')?0.9:1));}   // Concordat: twin embassies confer
function forgeMaxTech(){return Math.max(0,cityLvSum('forge'));}   // forge level = tech cap
function wallDefTotal(){let d=0;const wd=S.wallDef||{};for(const k in DEFS)d+=(wd[k]||0)*DEFS[k].def;
  d+=wallDefOf(S.wall)||0;   // the wall itself contributes — dominant at high tiers
  return Math.round(d*(1+techBonus('def')));}   // Iron Working research amplifies defense
function defenseMult(){return 1+wallDefTotal()/500;}   // how much a defender resists (for future PvP)
function cityCountType(t){let n=0;for(const k in S.city)if(S.city[k].type===t)n++;return n;}
/* 3×3 Tartarian detection: nine cottages around a center — ANY tier (the
   millions + 14 days of the raise are the real gate). Works in TWO places:
   the Tartarian Grounds district ('t4' center of t0..t8) or a 3×3 block a
   planner carved inside the town grid. */
function tartNeighbors(key){
  if(String(key)==='t4')return ['t0','t1','t2','t3','t4','t5','t6','t7','t8'];
  const [c,r]=String(key).split('_').map(Number);
  if(!(c>0&&r>0&&c<N-1&&r<N-1))return null;
  const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)out.push((c+dc)+'_'+(r+dr));
  return out;}
function tartCenterOK(key){const ks=tartNeighbors(key);if(!ks)return false;
  for(const k2 of ks){const b2=S.city[k2];
    if(!b2||b2.type!=='cottage')return false;
    if(S.queue.find(j=>j.slot===k2&&(j.kind==='up-city'||j.kind==='city')))return false;}
  return true;}
function tartHint(key){if(String(key)==='t4')return false;   // grounds explain themselves
  const ks=tartNeighbors(key);if(!ks)return false;
  let n=0;for(const k2 of ks)if(S.city[k2]&&S.city[k2].type==='cottage')n++;
  return n>=5;}   // over halfway to a square: whisper
/* Pair synergies: raise TWO of a building and it earns a named bonus — once.
   (Doubles only, by design: stacking triples was the abuse we ruled out.) */
const SYNERGY={
  barracks:{name:'Twin War Camps',em:'⚔️',desc:'+5% army power on attack'},
  beacon:  {name:'Twin Watch',    em:'👁️',desc:'+25% camp hauls · scouts 15% faster'},
  embassy: {name:'Concordat',     em:'🤝',desc:'research completes 10% faster'},
  market:  {name:'Trade Ring',    em:'⚖️',desc:'+1% better market prices'},
};
function hasSyn(t){return cityCountType(t)>=2;}
function effJobs(){return cityCountType('tartarian')>0?(S.jobs||{}):{};}   // hotel razed → jobs (and buffs) gone
function atkSynergyMult(){ // mirrored server-side from saved state — client can't inflate it
  return (hasSyn('barracks')?1.05:1)*(1+Math.min(0.20,(effJobs().blacksmiths||0)*0.0001));}
function powerOf(a){let p=0;for(const k in UNITS)p+=(a[k]||0)*UNITS[k].pow;return p;}
function slowestSpeed(a){let sp=99;for(const k in UNITS)if((a[k]||0)>0)sp=Math.min(sp,UNITS[k].speed);return sp===99?1:sp;}
function slice(n){ // take n troops from the army, proportionally across types
  const total=troopTotal();n=Math.min(n,total);const out={};let taken=0;
  for(const k in UNITS){const q=Math.floor(n*(S.army[k]||0)/total);out[k]=q;taken+=q;}
  for(const k of ['sword','archer','horse']){if(taken>=n)break;
    if((S.army[k]||0)>(out[k]||0)){out[k]=(out[k]||0)+1;taken++;}}
  return out;}
function compStr(a){const bits=[];for(const k in UNITS)if(a[k])bits.push(a[k]+UNITS[k].em);return bits.join(' ')||'0';}

/* Marches: everything on the map takes TIME. Distance × army size = duration; provisions cost food.
   Troops leave your count and return after the round trip. Absolute timestamps → works offline. */
function distMiles(x,y){return Math.hypot(x,y)/140;}
function marchDur(x,y,comp,kind){const d=Math.hypot(x,y);
  // (Twin Watch trims scout time below via the returned duration)
  if(kind==='scout')return Math.max(25,Math.round(d/900*60*(hasSyn('beacon')?0.85:1)));   // lone rider; Twin Watch rides faster
  const n=typeof comp==='number'?comp:troopTotal(comp);
  const sp=typeof comp==='number'?1:slowestSpeed(comp);
  return Math.max(40,Math.round((d/300)*(1+n/60)*60/sp));}            // slower with mass, faster if all-cavalry
function marchFood(x,y,units){return Math.ceil(distMiles(x,y)*Math.max(1,units)*2);}
function activeMarchTo(tid){return S.marches.find(m=>m.tid===tid&&!m.home);}
let DISPATCH_CTX={};   // {tKind,tLvl,amount,res} set by the menu just before dispatch()
async function dispatch(kind,tid,tx,ty,comp,scouts){
  comp=comp||{};

  if((kind==='raid'||kind==='clearcamp')&&isProtected()){

    if(ctx.foodPaid)S.res.food+=ctx.foodPaid;

    if(r&&r.ok){ if(r.army)S.army=r.army; if(r.scouts!=null)S.scouts=r.scouts; if(r.res)S.res=r.res; if(r.marches)S.marches=r.marches;
      (r.reports||[]).forEach(rp=>addLog(rp.k,rp.x)); save();renderRes();

    return;
  }

    comp,scouts:scouts||0,depart:now,arrive:now+dur,ret:now+dur*2,resolved:false,home:false});
  for(const k in comp)S.army[k]=(S.army[k]||0)-(comp[k]||0);

  const msg=(kind==='scout'?'🔍 Scout':kind==='raid'?'⚔️ '+compStr(comp):'⛏️ Haulers')+' dispatched · ETA '+fmtTime(dur/1000);

/* Battle math — Evony-brutal. Garrison must be out-massed; defeat costs the whole army.
   Camps are the weakest (bandits), Barbarians mid, Derelicts are true NPC castles.
   NOTE FOR SERVER: battles + march lines are OWNER-ONLY. Never broadcast another
   player's marches; other players see only outcomes (razed tiles). */
function garrison(t){ if(t.res) return 60+t.lvl*40;                   // camp bandits  (Lv1 ≈ 100)
  return t.kind==='Derelict'? t.lvl*420 : t.lvl*160; }                // 25-tier scale: Derelict ≫ Barbarian
function npcLoot(t){return t.lvl*(t.kind==='Derelict'?900:350);}      // frontier castles pay frontier gold
/* Watchtower intel: below Tier 11 your scouts ESTIMATE the garrison; Farsight
   Optics (Beacon 11+) reads the exact count. A tier-10+ feature that matters. */
function intel(n,g){ if(cityLvSum('beacon')>=11) return ''+g;
  const fuzz=0.85+((hashKey(n.id)%1000)/1000)*0.3;
  return '~'+(Math.round(g*fuzz/50)*50); }
function battle(comp,G){                                              // returns {win, frac lost}
  const power=powerOf(comp)*forgeBoost()*atkSynergyMult()*(0.85+Math.random()*0.30);   // Forge + synergies count
  if(power<=G) return {win:false, f:1};                               // rout: the army is lost
  const f=Math.min(0.9,(G/power)*0.45*(0.7+Math.random()*0.6));
  return {win:true, f};}
function applyLosses(comp,f){let lost=0;
  for(const k in comp){const q=Math.min(comp[k],Math.ceil(comp[k]*f));comp[k]-=q;lost+=q;}
  return lost;}
function resolveMarch(m){const now=Date.now();
  if(!m.resolved&&now>=m.arrive){m.resolved=true;
    if(m.kind==='scout'){const n=npcs&&npcs.find(q=>q.id===m.tid);
      const rpt=(n&&!S.razed[n.id])?
        '🔍 '+n.kind+' Lv '+n.lvl+': garrison '+intel(n,garrison(n))+' strong · loot ~'+npcLoot(n)+' · one victory razes it'
        :'🔍 Report: only rubble remains.';
      toast(rpt); addLog('scout',rpt);}
    else if(m.kind==='raid'){const n=npcs&&npcs.find(q=>q.id===m.tid);
      if(n&&!S.razed[n.id]){const G=garrison(n), r=battle(m.comp,G);
        if(r.win){const lost=applyLosses(m.comp,r.f), loot=npcLoot(n);
          S.res.gold+=loot;S.res.food+=loot;S.razed[n.id]=1;
          const msg='⚔️ VICTORY over '+n.kind+' '+n.lvl+'! +'+loot+' gold +'+loot+' food · '+lost+' fell · razed to flat land';
          toast(msg);addLog('battle',msg);DBG.log('battle',m.tid+' WIN -'+lost);}
        else{applyLosses(m.comp,1);
          const msg='💀 DEFEAT at '+n.kind+' '+n.lvl+'. The garrison of '+G+' slaughtered the army. No one returns.';
          toast(msg);addLog('battle',msg);DBG.log('battle',m.tid+' LOSS');}}
      else{toast('⚔️ The army found only ruins.');addLog('battle','⚔️ The army found only ruins.');}}
    else if(m.kind==='clearcamp'){const c=camps&&camps.find(q=>q.id===m.tid);
      if(c&&!S.campClear[c.id]){const G=garrison(c), r=battle(m.comp,G);
        if(r.win){S.campClear[c.id]=1;const lost=applyLosses(m.comp,r.f);
          const msg='⚔️ Camp cleared! '+lost+' fell. Haulers may now work it.';
          toast(msg);addLog('battle',msg);}
        else{applyLosses(m.comp,1);
          const msg='💀 The bandits ('+G+') wiped out your force.';toast(msg);addLog('battle',msg);}}
      else if(c)toast('The camp was already clear.');}
    else if(m.kind==='gather'){const c=camps&&camps.find(q=>q.id===m.tid);
      if(c){const left=campLeft(c),take=Math.min(Math.round(500*c.lvl*(hasSyn('beacon')?1.25:1)),left);
        if(take>0){S.mapRes[c.id]=left-take;S.res[c.res]=Math.min(cap(),(S.res[c.res]||0)+take);
          const msg='⛏️ +'+take+' '+c.res+((left-take)<=0?' — camp exhausted, the land lies flat':'');
          toast(msg);addLog('done',msg);}
        else toast('⛏️ The camp was already bare.');}}
    save();renderRes();}
  if(m.resolved&&!m.home&&now>=m.ret){m.home=true;
    let back=0; if(m.comp)for(const k in m.comp){S.army[k]=(S.army[k]||0)+(m.comp[k]||0);back+=m.comp[k]||0;}
    S.scouts+=m.scouts;
    const msg='🏠 March returned'+(back?' · '+compStr(m.comp)+' home':m.scouts?' · scout home':'');
    toast(msg);addLog('done',msg);save();}}
function tickMarches(){if(!S.marches||!S.marches.length)return;
  for(const m of S.marches)resolveMarch(m);
  S.marches=S.marches.filter(m=>!m.home);}
function drawMarches(cam){if(!S.marches)return;const now=Date.now();
  for(const m of S.marches){
    const hx=VW/2-cam.x, hy=VH/2-cam.y, tx=VW/2-cam.x+m.tx*zoom, ty=VH/2-cam.y+m.ty*zoom;
    ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(60,44,20,0.55)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tx,ty);ctx.stroke();ctx.setLineDash([]);
    let px,py;
    if(now<m.arrive){const t=Math.min(1,(now-m.depart)/(m.arrive-m.depart));px=hx+(tx-hx)*t;py=hy+(ty-hy)*t;}
    else{const t=Math.min(1,(now-m.arrive)/(m.ret-m.arrive));px=tx+(hx-tx)*t;py=ty+(hy-ty)*t;}
    ctx.beginPath();ctx.ellipse(px,py+6,7,3,0,0,7);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
    ctx.font='14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(m.kind==='scout'?'🔍':m.kind==='raid'?'⚔️':'⛏️',px,py);ctx.restore();}}
